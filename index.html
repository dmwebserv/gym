    S.owner = b.dataset.owner; saveSettings();
    root.querySelectorAll('[data-owner]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.owner === S.owner)));
  }));
  root.querySelectorAll('[data-savename]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.savename;
    const inp = root.querySelector(`[data-name="${id}"]`);
    const nm = inp.value.trim().slice(0,14);
    if (nm){
      const pp = S.people.find(x => x.id === id);
      pp.name = nm;
      saveSettings(); render(); openSettings();
    }
  }));
  root.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'connect') openSyncSetup();
    else if (a === 'reconnect'){
      S.sync.pin = ''; S.sync.room = ''; S.sync.lastErr = '';
      saveSettings();
      openSyncSetup();
    }
    else if (a === 'syncnow') doSync(true);
    else if (a === 'unsync'){
      if (!confirm('Disconnect this phone from sync? Its local data stays.')) return;
      S.sync = { pin:'', room:'', lastSync:0, lastErr:'', busy:false };
      saveSettings(); openSettings();
    }
    else if (a === 'cleanreps') cleanOldReps();
    else if (a === 'expjson') exportData('json');
    else if (a === 'expcsv') exportData('csv');
    else if (a === 'wipe'){
      if (!confirm('Erase ALL data stored locally on this phone? This cannot be undone.')) return;
      if (!confirm('Are you absolutely sure?')) return;
      wipeLocal();
    }
  }));
}

function openSyncSetup(){
  const cfg = syncConfigured();
  if (!cfg){
    toast('Add your Supabase keys first — see SETUP.md');
    return;
  }
  const colorVar = personDotColor(me().id);
  const body = `
    <p style="font-size:15px;line-height:1.65;color:var(--muted)">One shared PIN connects both phones. Enter the <b style="color:var(--chalk)">same PIN</b> on Danny's and Kieran's phones — pick something you'll both remember (at least 4 characters, more is safer).</p>
    <div class="modal-sec">
      <div class="winput-wrap">
        <input class="winput" id="pin" type="password" inputmode="text" autocomplete="off" style="font-size:34px;max-width:200px" placeholder="····" aria-label="Shared sync PIN">
      </div>
    </div>
    <div class="cta-row">
      <button class="cta primary" id="pinok" style="--pc:${colorVar}">Connect</button>
      <button class="cta ghost" data-close>Cancel</button>
    </div>
    <p id="pinmsg" style="text-align:center;margin-top:14px;font-size:13px;color:var(--d3);display:none"></p>`;
  openOverlay(overlayShell('Connect phones', 'one PIN for both phones', body, {center:true}));
  bindOverlayClicks();
  const ok = document.getElementById('pinok');
  const pin = document.getElementById('pin');
  const msg = document.getElementById('pinmsg');
  const doPin = async () => {
    const v = pin.value.trim();
    if (v.length < 4){ msg.textContent = 'PIN needs at least 4 characters.'; msg.style.display='block'; return; }
    ok.disabled = true; ok.textContent = 'Connecting…';
    msg.style.display = 'none';
    const secret = sha256('gym-pin:' + v.toLowerCase());
    const previous = { pin:S.sync.pin, room:S.sync.room };
    // Try it first, save it only once the store has accepted it — otherwise a mistyped PIN
    // would be retried forever and the only way back is the Reconnect button.
    S.sync.pin = v;
    S.sync.room = wireSecret(secret).slice(0,16);
    const res = await doSync(true, secret);
    if (res && res.ok){
      await saveSettings();
      toast('Phones connected ✦');
      closeOverlay();
      render();
    } else {
      S.sync.pin = previous.pin;
      S.sync.room = previous.room;
      await saveSettings();
      ok.disabled = false; ok.textContent = 'Connect';
      msg.textContent = res && res.msg ? res.msg : 'Could not reach the sync store. Check your connection and the keys in SETUP.md.';
      msg.style.display='block';
    }
  };
  ok.addEventListener('click', doPin);
  pin.addEventListener('keydown', ev => { if (ev.key === 'Enter') doPin(); });
  setTimeout(() => pin.focus(), 80);
}

/* ---------- export / wipe ---------- */
function exportData(fmt){
  const stamp = todayKey();
  const all = {};
  for (const p of S.people) all[p.id] = logOf(p.id);
  let name, type, text;
  if (fmt === 'json'){
    name = `gym-backup-${stamp}.json`;
    type = 'application/json';
    text = JSON.stringify({ exported:new Date().toISOString(), unit:UNIT, people:S.people, data:all }, null, 2);
  } else {
    name = `gym-weights-${stamp}.csv`;
    type = 'text/csv';
    const rows = ['person,date,exercise,weight_kg,reps,note,last_reps'];
    for (const p of S.people){
      for (const e of liftsOf(p.id)){
        const lr = lastReps(e);
        rows.push([p.name, e.date, e.name || e.ex, e.weight, e.reps ? e.reps.join('/') : '', e.note || '',
                   lr != null ? lr : ''].map(v => '"'+String(v).replace(/"/g,'""')+'"').join(','));
      }
    }
    text = rows.join('\n');
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type}));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    S.lastBackup = now();
    saveSettings();
    toast('Backup downloaded');
  } catch(e){ toast('Export failed on this device'); }
}
function wipeLocal(){
  const keys = [];
  try { for (const k of Object.keys(localStorage)) if (k.startsWith('gym:') || /^session:/.test(k)) keys.push(k); } catch(e){}
  for (const k of keys){ try { localStorage.removeItem(k); } catch(e){} }
  try { Object.keys(mem).forEach(k => { if (k.startsWith('gym:') || /^session:/.test(k)) delete mem[k]; }); } catch(e){}
  // clear through the store too, so a host-injected storage bridge is emptied as well
  if (window.storage && window.storage.set){
    (async () => { for (const k of keys){ try { await window.storage.set(k, ''); } catch(e){} } })();
  }
  location.reload();
}

/* ============================================================
   Onboarding
   ============================================================ */
function onboard(){
  const body = `
    <div class="onb-title">Welcome</div>
    <div class="onb-sub">This app tracks your weights, reps and PBs per person — Danny and Kieran.
      First, whose phone is this?</div>
    <div class="onb-cards">
      ${S.people.map((p,i) => `
      <button class="onb-card" data-who="${p.id}">
        <span class="ava" style="background:${personDotColor(p.id)}">${esc(p.initial)}</span>
        <span class="nm">${esc(p.name)}</span>
        <span class="who">this is my phone</span>
      </button>`).join('')}
    </div>
    <p style="margin-top:18px;font-size:13.5px;color:var(--muted);line-height:1.6;text-align:center">
      You can switch who you are any time at the top of the screen.<br>Names can be changed later in Settings.</p>`;
  openOverlay(overlayShell('', '', body, {center:true}));
  document.querySelectorAll('#overlayroot [data-who]').forEach(b => b.addEventListener('click', () => {

/* ============================================================
   Sync engine (Supabase)
   ============================================================ */
function syncConfigured(){
  return !!(SUPABASE.url && SUPABASE.anonKey && SUPABASE_TABLE_SQL_OK);
}
let syncTimer = null, syncInFlight = false;
function scheduleSync(){
  clearTimeout(syncTimer);
  if (!syncConfigured()) return;
  syncTimer = setTimeout(() => doSync(false), 2500);
}
/* the 64-char value sent to the database: derived from the PIN entirely
   in the browser so the store never needs a server-side hash function */
const wireSecret = secret => sha256('gym-store:' + secret);
async function doSync(manual, secretOverride){
  if (!syncConfigured()) return { ok:false, msg:'Sync not configured (see SETUP.md)' };
  if (syncInFlight){
    // A background sync is already running. Never report success for a PIN we have not checked —
    // wait for the running one to finish first, then report its outcome honestly.
    if (!manual) return { ok:true, silent:true };
    while (syncInFlight) await new Promise(r => setTimeout(r, 120));
    if (!secretOverride) return { ok:true, checked:true };
  }
  if (!secretOverride && !S.sync.pin) {
    // first time: prompt for the shared PIN
    if (manual) openSyncSetup();
    return { ok:false, silent:true };
  }
  syncInFlight = true;
  S.sync.busy = true;
  S.sync.lastErr = '';
  saveSettings();
  try {
    const secret = secretOverride || sha256('gym-pin:' + S.sync.pin.toLowerCase());
    const room = wireSecret(secret);
    // build payload: every local lift + tick across both people
    const rows = [];
    for (const p of S.people){
      for (const e of Object.values(logOf(p.id).lifts)) rows.push({ id:e.id, pid:p.id, ts:e.ts, data:e });
      for (const k of Object.keys(logOf(p.id).ticks)){
        const t = logOf(p.id).ticks[k];
        const [dow, date] = k.split(':');
        rows.push({ id:'t:' + p.id + ':' + dow + ':' + date, pid:p.id, ts:t.ts, data:{ kind:'tick', pid:p.id, dow:+dow, date, items:t.items, ts:t.ts } });
      }
    }
    const res = await fetch(SUPABASE.url.replace(/\/$/,'') + '/rest/v1/rpc/sync_state', {
      method:'POST',
      headers:{ 'apikey': SUPABASE.anonKey, 'Authorization':'Bearer ' + SUPABASE.anonKey, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_secret: secret, p_rows: rows, p_since: 0 })
    });
    if (!res.ok){
      let msg = 'Sync failed (' + res.status + ')';
      try {
        const j = await res.json();
        msg = (j.message || j.msg || msg);
        if (j.code === 'PGRST202' || /could not find the function/i.test(msg)){
          msg = 'Database setup isn\u2019t finished yet — open Supabase → SQL Editor and run supabase.sql once.';
        } else if (res.status === 401 || res.status === 403){
          msg = 'Sync store rejected the app key — check the URL/key in the SYNC CONFIG block.';
        }
      } catch(e){}
      throw new Error(msg);
    }
    const remote = await res.json();
    let changed = 0;
    for (const row of (remote || [])){
      const d = row.data || {};
      if (d.kind === 'tick'){
        const pid = d.pid, key = tickKey(d.dow, d.date);
        const t = logOf(pid).ticks[key];
        if (!t || d.ts > t.ts){
          logOf(pid).ticks[key] = { items:(d.items||[]).slice(), ts:d.ts };
          changed++;
        }
      } else if (d.id && d.ts){
        const pid = d.pid;
        const cur = logOf(pid).lifts[d.id];
        if (!cur || d.ts > cur.ts){
          logOf(pid).lifts[d.id] = d;
          changed++;
        }
      }
    }
    if (changed){
      for (const p of S.people) saveLog(p.id, true);
    }
    S.sync.lastSync = now();
    S.sync.lastErr = '';
    await saveSettings();
    render();
    return { ok:true };
  } catch(e){
    S.sync.lastErr = String(e && e.message ? e.message : e).slice(0,200);
    await saveSettings();
    render();
    return { ok:false, msg: S.sync.lastErr };
  } finally {
    syncInFlight = false;
    S.sync.busy = false;
    saveSettings();
  }
}

/* ============================================================
   Boot
   ============================================================ */
(async function boot(){
  await loadSettings();
  await loadLogs();
  await migrateLegacy();

  document.getElementById('switch').innerHTML = '';
  render();

  document.getElementById('gearbtn').addEventListener('click', openSettings);

  if (!S.onboarded){
    onboard();
  } else if (syncConfigured() && S.sync.pin){
    doSync(false);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    // a new day (or a new session) may have started while the app sat in the background
    if (lastRenderedDay !== todayKey()){ lastRenderedDay = todayKey(); render(); }
    if (syncConfigured() && S.sync.pin) doSync(false);
  });
  window.addEventListener('focus', () => {
    if (lastRenderedDay !== todayKey()){ lastRenderedDay = todayKey(); render(); }
    if (syncConfigured() && S.sync.pin && !syncInFlight) doSync(false);
  });
  setInterval(() => {
    if (document.hidden) return;
    if (lastRenderedDay !== todayKey()){ lastRenderedDay = todayKey(); render(); }
    if (syncConfigured() && S.sync.pin && !syncInFlight) doSync(false);
  }, 60000);
})();
