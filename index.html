<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Session">
<meta name="theme-color" content="#12161A">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#12161A;
    --surface:#1A2026;
    --line:#2A333C;
    --chalk:#EDE8DF;
    --muted:#7C8894;
    --d1:#F5C518;   /* day accent: Monday   */
    --d2:#4C8DFF;   /* day accent: Wednesday */
    --d3:#F0575C;   /* day accent: Friday    */
    --p1:#AABA99;   /* Danny   */
    --p2:#2b7b78;   /* Kieran  */
    --accent:var(--d1);
    --pad:20px;
    --tabh:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;touch-action:manipulation;}
  body{
    background:var(--base);
    color:var(--chalk);
    font-family:'Archivo',system-ui,sans-serif;
    font-size:16px;
    line-height:1.45;
    padding:max(env(safe-area-inset-top),14px) var(--pad) calc(env(safe-area-inset-bottom) + var(--tabh) + 34px);
    max-width:620px;
    margin:0 auto;
    overscroll-behavior-y:contain;
    min-height:100vh;
  }

  button{font-family:inherit;}

  /* ---- person switcher ---- */
  .persons{display:flex;gap:6px;margin-bottom:12px;}
  .person{
    flex:1;
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:500;
    letter-spacing:.1em;
    padding:9px 0 8px;
    border-radius:3px;
    cursor:pointer;
    text-transform:uppercase;
    transition:color .15s,border-color .15s,background .15s,box-shadow .15s;
  }
  .person .dot{width:8px;height:8px;border-radius:50%;background:transparent;flex:none;}
  .person[data-a="0"] .dot{background:var(--p1);}
  .person[data-a="1"] .dot{background:var(--p2);}
  .person[aria-pressed="true"]{
    border-color:var(--pc,var(--line));
    color:var(--chalk);
    box-shadow:inset 0 0 0 1px var(--pc,var(--line));
  }
  .person:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .gear{
    flex:none;width:46px;
    border:1px solid var(--line);border-radius:3px;background:transparent;
    color:var(--muted);font-size:20px;line-height:1;cursor:pointer;
    transition:color .15s,border-color .15s;
  }
  .gear:hover{color:var(--chalk);border-color:var(--chalk);}
  .gear:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .toprow{display:flex;gap:8px;align-items:stretch;margin-bottom:12px;}
  .toprow .persons{flex:1;margin-bottom:0;}

  /* ---- day switcher ---- */
  .switch{display:flex;gap:6px;margin-bottom:26px;}
  .switch button{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:500;
    letter-spacing:.14em;
    padding:11px 0 10px;
    border-radius:3px;
    cursor:pointer;
    transition:color .15s,border-color .15s,background .15s;
  }
  .switch button[aria-pressed="true"]{
    color:var(--base);
    background:var(--accent);
    border-color:var(--accent);
    font-weight:600;
  }
  .switch button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}

  /* ---- header ---- */
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.2em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .eyebrow .live{color:var(--accent);}
  .eyebrow .who{color:var(--pc,#fff);font-weight:600;}
  h1{
    font-size:clamp(46px,15vw,64px);
    font-weight:900;
    line-height:.88;
    letter-spacing:-.035em;
    margin:10px 0 6px;
    text-transform:uppercase;
  }
  h1 .idx{color:var(--accent);}
  h1.small{font-size:clamp(34px,10vw,44px);line-height:.95;}
  .focus{font-size:17px;font-weight:600;color:var(--chalk);letter-spacing:-.01em;}
  .stats{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-top:9px;letter-spacing:.02em;}
  .restnote{
    border:1px dashed var(--line);
    border-radius:4px;
    padding:13px 15px;
    margin-top:18px;
    font-size:14.5px;
    color:var(--muted);
    line-height:1.5;
  }
  .restnote b{color:var(--chalk);font-weight:600;}

  /* ---- blocks ---- */
  .block{margin-top:26px;border-top:1px solid var(--line);padding-top:16px;}
  .block-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.2em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:9px;
  }
  .block p{font-size:15.5px;color:var(--chalk);opacity:.9;}

  /* ---- exercise rows ---- */
  ol{list-style:none;margin-top:6px;}
  li.ex{
    display:grid;
    grid-template-columns:36px 1fr auto;
    column-gap:12px;
    padding:15px 0 14px;
    border-bottom:1px solid var(--line);
    align-items:start;
  }
  li.ex:last-child{border-bottom:none;}
  li.ex{cursor:pointer;transition:opacity .22s ease;}
  li.ex:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px;}
  li.ex:active{opacity:.75;}
  .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    font-weight:600;
    color:var(--accent);
    opacity:.65;
    line-height:1.3;
  }
  .num .tk{display:none;}

  .mid{min-width:0;}
  .side{text-align:right;min-width:118px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}

  .name{font-size:18.5px;font-weight:700;letter-spacing:-.015em;line-height:1.2;display:block;}
  .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    margin-top:5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    display:block;
    line-height:1.5;
  }
  .meta .count{color:var(--chalk);font-weight:500;}
  .meta .count.final{color:var(--accent);}
  .meta .also{text-transform:none;letter-spacing:.01em;}
  .meta .choice{color:var(--pc,var(--chalk));}
  .restline{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-top:3px;
    letter-spacing:.04em;
    opacity:.8;
    display:block;
  }

  .prescribe{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    white-space:nowrap;
    letter-spacing:-.01em;
    line-height:1.4;
  }
  .pill{
    min-width:96px;
    height:42px;
    padding:0 14px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid var(--line);
    border-radius:3px;
    background:transparent;
    color:var(--chalk);
    font-family:'IBM Plex Mono',monospace;
    font-size:17px;
    font-weight:600;
    letter-spacing:-.01em;
    cursor:pointer;
    transition:border-color .15s,background .15s,color .15s,box-shadow .15s;
    white-space:nowrap;
  }
  .pill .u{font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.05em;}
  .pill.has{color:var(--pc,var(--accent));border-color:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px var(--pc,var(--accent));}
  .pill.logged{background:var(--pc,var(--accent));border-color:var(--pc,var(--accent));color:var(--base);}
  .pill.logged .u{color:inherit;opacity:.65;}
  .pill:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .pbline{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.03em;
    color:var(--muted);
    line-height:1.45;
    text-align:right;
    white-space:nowrap;
  }
  .pbline b{color:var(--pc,var(--accent));font-weight:600;}
  .pbline.blank{opacity:.72;}
  .pill .xr{font-size:12.5px;opacity:.72;margin-left:4px;letter-spacing:0;}
  .pill.logged .xr{opacity:.9;}
  .choicehint{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:8px;letter-spacing:.02em;line-height:1.5;}
  .bothnote{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:9px;line-height:1.55;}
  .datein{background:var(--base);border:1px solid var(--line);border-radius:3px;color:var(--chalk);
    font-family:'IBM Plex Mono',monospace;font-size:14px;padding:9px 11px;outline:none;}
  .datein:focus{border-color:var(--accent);}

  /* completed */
  li.ex.done{opacity:.52;}
  li.ex.done .name{text-decoration:line-through;text-decoration-thickness:1.5px;font-weight:600;}
  li.ex.done .num .n{display:none;}
  li.ex.done .num .tk{display:inline;opacity:1;font-size:16px;}
  li.ex.done .num{opacity:1;}

  /* progress bar */
  .progress{display:flex;align-items:center;gap:12px;margin-top:14px;}
  .bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
  .bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s cubic-bezier(.2,.7,.3,1);}
  .ptext{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.12em;color:var(--muted);white-space:nowrap;}
  .ptext.complete{color:var(--accent);}
  .reset{
    background:none;border:1px solid var(--line);color:var(--muted);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;padding:6px 10px;border-radius:3px;cursor:pointer;
  }
  .reset:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .taphint{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
    color:var(--muted);text-transform:uppercase;margin-bottom:2px;
  }

  /* ---- reference ---- */
  details{margin-top:14px;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  summary{
    list-style:none;cursor:pointer;padding:14px 15px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;
  }
  summary::-webkit-details-marker{display:none;}
  summary::after{content:'+';font-size:17px;color:var(--accent);line-height:1;}
  details[open] summary{color:var(--chalk);border-bottom:1px solid var(--line);}
  details[open] summary::after{content:'–';}
  .ref-body{padding:15px;font-size:15px;line-height:1.55;}
  .ref-body p+p{margin-top:11px;}
  .ref-body ul{margin:9px 0 0 17px;}
  .ref-body li{margin-bottom:7px;}
  .ref-body strong{font-weight:700;}
  .ref-row{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;align-items:baseline;}
  .ref-row:last-child{border-bottom:none;}
  .ref-row .k{flex:1;color:var(--chalk);}
  .ref-row .v{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);white-space:nowrap;text-align:right;}

  /* ---- bottom tabs ---- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;justify-content:center;gap:6px;
    padding:8px var(--pad) calc(env(safe-area-inset-bottom) + 8px);
    background:rgba(18,22,26,.92);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    pointer-events:none;
  }
  .tabbar nav{
    pointer-events:auto;
    width:100%;max-width:520px;
    display:flex;gap:6px;
  }
  .tabbar button{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:transparent;border:none;border-radius:6px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    padding:7px 0 5px;cursor:pointer;
    transition:color .15s,background .15s;
  }
  .tabbar button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tabbar button[aria-pressed="true"]{color:var(--accent);background:rgba(255,255,255,.04);}
  .tabbar button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}

  /* ---- modal shell ---- */
  .overlay{
    position:fixed;inset:0;z-index:60;
    display:flex;align-items:flex-end;justify-content:center;
    background:rgba(8,10,12,.62);
    animation:fade .2s ease both;
  }
  .sheet{
    width:100%;max-width:620px;max-height:min(88vh,860px);
    overflow-y:auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:14px 14px 0 0;
    padding:20px var(--pad) calc(env(safe-area-inset-bottom) + 20px);
    animation:rise .3s cubic-bezier(.2,.7,.3,1) both;
  }
  .sheet.full{
    border-radius:0;max-height:none;height:100%;max-width:620px;margin:0 auto;
    padding-top:calc(env(safe-area-inset-top) + 16px);
    animation:fade .2s ease both;
  }
  .overlay.center{align-items:center;}
  .overlay.center .sheet{border-radius:14px;border-bottom:1px solid var(--line);max-height:90vh;}
  .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px;flex:none;}
  .modal-title{
    font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.2;
    display:flex;align-items:baseline;gap:10px;justify-content:space-between;
  }
  .modal-sub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:7px;}
  .close-x{
    background:none;border:1px solid var(--line);color:var(--muted);
    width:34px;height:34px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;flex:none;
  }
  .close-x:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .modal-sec{margin-top:22px;}
  .modal-sec > .lbl{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;
    color:var(--muted);text-transform:uppercase;margin-bottom:9px;display:block;
  }

  /* log sheet */
  .presc-line{
    display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);letter-spacing:.02em;
  }
  .presc-line b{color:var(--chalk);font-weight:600;}
  .choicechips{display:flex;gap:8px;margin-top:4px;}
  .choicechips button{
    flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
    font-size:14.5px;font-weight:600;padding:11px 8px;border-radius:3px;cursor:pointer;
    transition:all .15s;
  }
  .choicechips button[aria-pressed="true"]{border-color:var(--pc,var(--accent));color:var(--base);background:var(--pc,var(--accent));}
  .choicechips button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .hint-row{
    margin-top:16px;border:1px dashed var(--line);border-radius:4px;
    padding:12px 13px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.55;color:var(--muted);
  }
  .hint-row b{color:var(--accent);font-weight:600;}
  .hint-row .pb{color:var(--chalk);}
  .hint-row.pb-new{border-color:var(--accent);background:rgba(245,197,24,.06);}

  .winput-wrap{margin-top:18px;text-align:center;}
  .winput{
    width:100%;max-width:260px;text-align:center;
    background:transparent;border:none;border-bottom:2px solid var(--line);
    color:var(--chalk);
    font-family:'IBM Plex Mono',monospace;
    font-size:56px;font-weight:600;letter-spacing:-.02em;
    padding:2px 0 8px;outline:none;caret-color:var(--accent);
    -moz-appearance:textfield;
  }
  .winput::-webkit-outer-spin-button,.winput::-webkit-inner-spin-button{-webkit-appearance:none;}
  .winput:focus{border-bottom-color:var(--accent);}
  .wunit{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px;display:block;}
  .quickchips{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
  .qchip{
    border:1px solid var(--line);background:var(--base);color:var(--chalk);
    font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;
    min-width:64px;padding:11px 12px;border-radius:3px;cursor:pointer;
    transition:border-color .15s,color .15s,background .15s;
  }
  .qchip.small{min-width:0;font-size:13px;padding:10px 13px;}
  .qchip:hover{border-color:var(--accent);color:var(--accent);}
  .qchip:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}

  .reps-block{margin-top:22px;}
  .reps-title{
    display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;
    color:var(--muted);text-transform:uppercase;
  }
  .reps-title .toggle{color:var(--accent);text-transform:uppercase;font-size:10px;letter-spacing:.12em;border:none;background:none;cursor:pointer;font-family:inherit;}
  .setrow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;
  }
  .setrow:last-child{border-bottom:none;}
  .setrow .s{color:var(--muted);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;}
  .setstepper{display:flex;align-items:center;gap:0;}
  .setstepper button{
    width:42px;height:38px;border:1px solid var(--line);background:var(--base);
    color:var(--chalk);font-size:18px;cursor:pointer;line-height:1;
  }
  .setstepper button:first-child{border-radius:3px 0 0 3px;}
  .setstepper button:last-child{border-radius:0 3px 3px 0;}
  .setstepper button:focus-visible{outline:2px solid var(--chalk);outline-offset:1px;}
  .setstepper input{
    width:52px;height:38px;border:1px solid var(--line);border-left:none;border-right:none;
    background:var(--base);color:var(--chalk);text-align:center;
    font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;outline:none;
  }

  .cta-row{display:flex;gap:10px;margin-top:26px;}
  .cta{
    flex:1;border:none;border-radius:4px;padding:16px 10px;
    font-size:16px;font-weight:700;letter-spacing:-.01em;cursor:pointer;
    font-family:inherit;
    transition:transform .1s,opacity .15s;
  }
  .cta:active{transform:scale(.98);}
  .cta.primary{background:var(--pc,var(--accent));color:var(--base);}
  .cta.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600;}
  .cta.danger{background:transparent;border:1px solid var(--d3);color:var(--d3);}
  .cta:disabled{opacity:.4;cursor:default;}
  .cta:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .cta .sub{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-top:3px;}

  /* toast */
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + var(--tabh) + 14px);
    z-index:80;max-width:calc(100% - 40px);
    background:var(--pc,var(--accent));color:var(--base);
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.08em;
    padding:12px 18px;border-radius:4px;text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    animation:rise .25s cubic-bezier(.2,.7,.3,1) both;
    display:none;
  }
  .toast.show{display:block;}
  .toast .undobtn{
    background:none;border:1px solid currentColor;color:inherit;font-family:inherit;
    font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    padding:5px 9px;border-radius:3px;margin-left:10px;cursor:pointer;vertical-align:middle;
  }

  /* progress tab */
  .sumline{
    display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;
  }
  .statcard{
    flex:1;min-width:110px;border:1px solid var(--line);border-radius:4px;padding:12px 13px;
  }

    if (e.opts) for (const o of e.opts) if (o.id !== e.opts[0].id) list.unshift({ id:o.id, name:o.name });
    if (list.length) out[e.canon] = list;
  }
  return out;
})();

/* ============================================================
   Storage. Tries the host's storage first (so nothing breaks if
   the page runs inside a shell that injects window.storage),
   then localStorage, then memory for the current visit only.
   ============================================================ */
const mem = {};
const Store = {
  async get(k){
    try { if (window.storage) { const r = await window.storage.get(k); if (r) return r.value; } } catch(e){}
    try { const v = localStorage.getItem(k); if (v !== null) return v; } catch(e){}
    return k in mem ? mem[k] : null;
  },
  async set(k,v){
    mem[k] = v;
    try { if (window.storage) { await window.storage.set(k,v); return; } } catch(e){}
    try { localStorage.setItem(k,v); } catch(e){}
  }
};

/* ---- Undo: memory only, deliberately gone on reload ---- */
let undoStack = [];
function snapshotBefore(pids){
  const s = {};
  for (const pid of pids) s[pid] = JSON.stringify(logOf(pid));
  return s;
}
function registerUndo(snap){
  undoStack.push(snap);
  if (undoStack.length > 5) undoStack.shift();
}
/* Puts the previous state back *and* re-stamps it, so the undo travels to the
   other phone (sync is newest-wins). A record the action created becomes a
   tombstone rather than simply vanishing, so it can't be pulled back down. */
function undoLast(){
  const snap = undoStack.pop();
  if (!snap) return;
  for (const pid of Object.keys(snap)){
    let before = { lifts:{}, ticks:{} };
    try { before = JSON.parse(snap[pid]); } catch(e){}
    const cur = logOf(pid);
    const outLifts = {};
    const ids = new Set(Object.keys(before.lifts||{}).concat(Object.keys(cur.lifts||{})));
    for (const id of ids){
      const bE = (before.lifts||{})[id] || null;
      const cE = (cur.lifts||{})[id] || null;
      if (JSON.stringify(bE) === JSON.stringify(cE)){ if (cE) outLifts[id] = cE; continue; }
      if (bE) outLifts[id] = Object.assign({}, bE, { ts: now() });
      else outLifts[id] = { id, kind:'lift', pid, deleted:true, ts: now() };
    }
    cur.lifts = outLifts;
    const outTicks = {};
    const tks = new Set(Object.keys(before.ticks||{}).concat(Object.keys(cur.ticks||{})));
    for (const k of tks){
      const bT = (before.ticks||{})[k] || null;
      const cT = (cur.ticks||{})[k] || null;
      if (JSON.stringify(bT) === JSON.stringify(cT)){ if (cT) outTicks[k] = cT; continue; }
      outTicks[k] = { items: bT ? (bT.items||[]).slice() : [], ts: now() };
    }
    cur.ticks = outTicks;
    saveLog(pid, true);
  }
  toast('Undone');
  render();
}

// deterministic sha-256 hex (compact, public-domain style implementation)
const sha256 = (() => {
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  const chr=(c)=>c.charCodeAt(0);
  return function(str){
    const bytes=unescape(encodeURIComponent(str));
    const l=bytes.length;
    let n=Math.ceil((l+1)/64)*64;
    const msg=new Uint8Array(n+64);
    for(let i=0;i<l;i++)msg[i]=bytes.charCodeAt(i);
    msg[l]=0x80;
    const bitLen=l*8;
    const dv=new DataView(msg.buffer);
    dv.setUint32(n,0);dv.setUint32(n+4,0);
    dv.setUint32(n+8,Math.floor(bitLen/0x100000000));
    dv.setUint32(n+12,bitLen>>>0);
    const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const w=new Int32Array(64);
    for(let off=0;off<msg.length;off+=64){
      for(let i=0;i<16;i++)w[i]=dv.getUint32(off+i*4);
      for(let i=16;i<64;i++){
        const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
        const s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
        w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
      }
      let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(let i=0;i<64;i++){
        const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
        const ch=(e&f)^(~e&g);
        const t1=(h+S1+ch+K[i]+w[i])|0;
        const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
        const maj=(a&b)^(a&c)^(b&c);
        const t2=(S0+maj)|0;
        h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
    }
    return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
  };
})();

/* ============================================================
   Parse prescription strings: "3 × 8–10" → {sets:3,min:8,max:10}
   ============================================================ */
function parsePresc(s){
  const m = String(s).replace(/x/gi,'×').replace(/–/g,'-').replace(/—/g,'-').match(/^\s*(\d+)\s*×\s*(\d+)\s*[-–]\s*(\d+)(.*?)\s*$/);
  if (!m) return null;
  return { sets:+m[1], min:+m[2], max:+m[3], tail:m[4] };
}

    rotatePick:{},                  // pid → slotKey → {c, d} — a one-day override on an alternating slot
    swap:{},                        // pid → 'dayN:date:idx' → {id, name} — "machine taken?" for today only

/* ---------- per-day helpers (all local, none of it touches your records) ---------- */
function swapKey(dayN, date, idx){ return dayN + ':' + date + ':' + idx; }
function swapFor(pid, dayN, date, idx){
  const m = S.swap && S.swap[pid];
  return (m && m[swapKey(dayN, date, idx)]) || null;
}
function setSwap(pid, dayN, date, idx, val){
  S.swap = S.swap || {};
  S.swap[pid] = S.swap[pid] || {};
  const k = swapKey(dayN, date, idx);
  if (val) S.swap[pid][k] = val; else delete S.swap[pid][k];
  saveSettings();
}
function orderFor(pid, dayN, date, len){
  const key = dayN + ':' + date;
  const o = S.dayOrder && S.dayOrder[pid] && S.dayOrder[pid][key];
  const nat = [...Array(len).keys()];
  if (!o || !o.length) return nat;
  const seen = o.filter(i => i >= 0 && i < len);
  return seen.concat(nat.filter(i => !seen.includes(i)));
}
function moveToEnd(pid, dayN, date, idx, len){
  const cur = orderFor(pid, dayN, date, len).filter(i => i !== idx);
  S.dayOrder = S.dayOrder || {};
  S.dayOrder[pid] = S.dayOrder[pid] || {};
  S.dayOrder[pid][dayN + ':' + date] = cur.concat([idx]);
  saveSettings();
}
/* one-day override on an alternating slot; expires tomorrow on its own */
function rotatePickFor(pid, slotKey){
  const m = S.rotatePick && S.rotatePick[pid] && S.rotatePick[pid][slotKey];
  if (!m) return null;
  return m.d === todayKey() ? m.c : null;
}
function setRotatePick(pid, slotKey, canon, date){
  S.rotatePick = S.rotatePick || {};
  S.rotatePick[pid] = S.rotatePick[pid] || {};
  S.rotatePick[pid][slotKey] = { c:canon, d:date || todayKey() };
  saveSettings();
}
/* the pull-up ladder lives in the log as its own record, so it syncs like anything else */
function ladderOf(pid){
  const e = logOf(pid).lifts['x:' + pid + ':ladder'];
  return (e && !isDeleted(e)) ? e : null;
}
function setLadder(pid, patch){
  const cur = ladderOf(pid) || { id:'x:' + pid + ':ladder', kind:'ladder', pid, level:1, ts:0 };
  const next = Object.assign({}, cur, patch, { ts: now(), last: (patch && patch.markDone) ? todayKey() : cur.last });
  if (patch && patch.markDone) delete next.markDone;
  logOf(pid).lifts[next.id] = next;
  saveLog(pid, true);
  render();
}
const me = () => S.people.find(p => p.id === S.sel) || S.people[0];
const pcVar = p => `var(${p.color})`;
const personDotColor = pid => { const p = S.people.find(x=>x.id===pid); return p ? `var(${p.color})` : 'var(--accent)'; };

function logOf(pid){
  if (!logs[pid]) logs[pid] = { lifts:{}, ticks:{} };
  return logs[pid];
}
function tickKey(dow, date){ return dow + ':' + date; }

/* all logged lifts for a person, newest first (deleted ones and non-lift records hidden) */
function liftsOf(pid){
  return Object.values(logOf(pid).lifts)
    .filter(e => !isDeleted(e) && (e.kind === undefined || e.kind === 'lift'))
    .sort((a,b) => b.ts - a.ts);
}
function liftsByCanon(pid, canon){
  return liftsOf(pid).filter(e => e.ex === canon);
}
function ticksFor(pid, dow, date){
  const k = tickKey(dow, date);
  const t = logOf(pid).ticks[k];
  return t ? t.items.slice() : [];
}

function personStats(pid, canon){
  const list = liftsByCanon(pid, canon);
  if (!list.length) return null;
  let pb = null, last = null;
  for (const e of list){                       // list is newest-first
    if (!last) last = e;
    if (!pb || e.weight > pb.weight || (e.weight === pb.weight && e.ts < pb.ts)) pb = e;
  }
  return { count:list.length, last, pb };
}

/* which canon ids this slot could refer to */
function slotCanons(slot){
  if (slot.opts && slot.opts.length) return slot.opts.map(o => o.id);
  return [slot.canon];
}
function slotKeyOf(dayN, idx){ return dayN + ':' + idx; }
function lastChoiceFor(pid, slotKey, slot){
  const c = S.lastChoice[pid] && S.lastChoice[pid][slotKey];
  if (c && slot.opts && slot.opts.some(o => o.id === c)) return c;
  return slot.opts ? slot.opts[0].id : null;
}
/* the canon this person is actually doing for this slot:
   1. a substitute picked today because the machine was taken
   2. an explicit pick (remembered forever on fixed slots, for today only on alternating ones)
   3. on an alternating slot: whichever variant they did NOT do last time
   4. otherwise the one they lifted most recently, else the first option */
function chosenCanonFor(pid, slotKey, slot, date){
  const d = date || todayKey();
  const slotIdx = +(slotKey.split(':')[1]);
  const sw = swapFor(pid, +(slotKey.split(':')[0]), d, slotIdx);
  if (sw && sw.id) return sw.id;
  if (!slot.opts || !slot.opts.length) return slot.canon;
  const canons = slotCanons(slot);
  if (slot.rotate){
    const pick = rotatePickFor(pid, slotKey);
    if (pick && canons.includes(pick)) return pick;
    const recs = liftsOf(pid).filter(e => canons.includes(e.ex));
    if (recs.length){
      const alternate = canons.find(c => c !== recs[0].ex);   // offer the other one
      if (alternate) return alternate;
    }
    return slot.opts[0].id;
  }
  const stored = S.lastChoice[pid] && S.lastChoice[pid][slotKey];
  if (stored && canons.includes(stored)) return stored;
  const recs = liftsOf(pid).filter(e => canons.includes(e.ex));
  return recs.length ? recs[0].ex : slot.opts[0].id;
}
/* the label for a canon, whichever way it was reached */
function labelForCanon(canon, slot){
  const o = slot && slot.opts && slot.opts.find(x => x.id === canon);
  if (o) return o.name;
  const sub = slot && (slot.subs || []).find(x => x.id === canon);
  if (sub) return sub.name;
  return CANON_LABEL[canon] || (slot ? slot.name : canon);
}
/* the fewest words that distinguish this variant from the other option */
function variantTag(slot, canon){
  if (!slot || !slot.opts || slot.opts.length < 2) return '';
  const me = slot.opts.find(o => o.id === canon);
  if (!me) return '';
  const others = slot.opts.filter(o => o.id !== canon)
    .map(o => o.name.toLowerCase().split(/\s+/));
  const words = me.name.split(/\s+/);
  const tag = words.filter(w => !others.some(list => list.includes(w.toLowerCase())));
  return (tag.length ? tag : words).join(' ');
}

/* is this lift, as chosen today, a bodyweight one? */
function isBWChoice(slot, canon){
  if (slot.bw) return true;
  const o = slot.opts && slot.opts.find(x => x.id === canon);
  return !!(o && o.bw);
}
function slotLastLift(pid, slot, slotKey){
  const canons = slotCanons(slot);
  const ch = slot.opts ? lastChoiceFor(pid, slotKey, slot) : null;
  const list = liftsOf(pid).filter(e => canons.includes(e.ex));
  if (!list.length) return null;
  return list.find(e => ch && e.ex === ch) || list[0];
}

/* migrate pre-two-people data ("session:1:2026-09-08") into the owner's log */
async function migrateLegacy(){
  if (S.legacyMigrated) return;
  S.legacyMigrated = true;
  try {
    for (let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      const m = /^session:(\d):([\d-]+)$/.exec(k);
      if (!m) continue;
      const raw = localStorage.getItem(k);
      const items = JSON.parse(raw);
      if (Array.isArray(items) && items.length){
        const t = logOf(S.owner).ticks;
        const key = tickKey(m[1], m[2]);
        const old = t[key];
        const merged = [...new Set([...(old?old.items:[]), ...items.map(Number)])].sort((a,b)=>a-b);
        t[key] = { items:merged, ts: now() };
      }
    }
  } catch(e){}
  saveLog(S.owner, true);
  await saveSettings();
}

function dayRowHTML(day, idx, p, dayKey){
  const e = day.ex[idx];
  const badge = BADGE[day.n + ':' + idx] || { i:1, n:1 };
  const final = badge.i === badge.n && badge.n > 1;
  const slotKey = slotKeyOf(day.n, idx);
  const chosen = chosenCanonFor(p.id, slotKey, e);
  const todayLift = todayLiftFor(p.id, day, idx);
  const done = ticksFor(p.id, day.n, todayKey()).includes(idx);
  const isBW = isBWChoice(e, chosen);
  const swapped = !!swapFor(p.id, day.n, todayKey(), idx);

  let pillHTML, pbHTML = '';
  if (isBW){
    pillHTML = `<span class="pill" aria-hidden="true">BW</span>`;
    pbHTML = `<span class="pbline blank">no weight to log</span>`;
  } else {
    const st = personStats(p.id, chosen);
    const pb = st && st.pb;
    const ref = todayLift || (st ? st.last : null);   // today's entry, else last time
    const displayW = ref ? ref.weight : null;
    const displayR = lastReps(ref);
    const logged = !!todayLift;
    pillHTML = `
      <button class="pill ${logged?'logged':(displayW!=null?'has':'')}" data-i="${idx}" aria-label="Log weight and reps for ${esc(e.name)}">
        ${displayW != null ? wFmt(displayW) : '—'}<span class="u">${UNIT}</span>${displayR ? `<span class="xr">×${displayR}</span>` : ''}
      </button>`;
    if (pb){
      const pbDate = fmtGB(pb.date, true);
      const pbReps = lastReps(pb);
      pbHTML = `<span class="pbline">PB <b>${wFmt(pb.weight)}</b>${pbReps ? ` ×${pbReps}` : ''} · ${esc(pbDate)}</span>`;
    } else {
      pbHTML = `<span class="pbline blank">no PB yet</span>`;
    }
  }

  /* which variant is live today: always named, never left to memory */
  let doing = '';
  if (e.opts){
    const c = e.opts.find(o => o.id === chosen);
    const isFirst = c && e.opts[0] && c.id === e.opts[0].id;
    const tag = variantTag(e, chosen);
    if (swapped){
      doing = ` <span class="choice" style="color:${personDotColor(p.id)}">→ ${esc(labelForCanon(chosen, e))}</span>`;
    } else if (c && (e.rotate || !isFirst)){
      doing = ` <span class="choice" style="color:${personDotColor(p.id)}">→ ${esc(tag)}</span>`;
    }
  } else if (swapped){
    doing = ` <span class="choice" style="color:${personDotColor(p.id)}">→ ${esc(labelForCanon(chosen, e))}</span>`;
  }

  const perHand = e.perHand && !isBW;
  const line2 = [
    perHand ? 'per dumbbell' : '',
    e.supersetWith != null ? 'superset' : ''
  ].filter(Boolean).join(' · ');

  return `<li class="ex ${done?'done':''}" data-i="${idx}" role="button" tabindex="0"
      aria-label="${esc(e.name)}, ${esc(e.sets)}. Tap to log." aria-pressed="${done}">
    <span class="num"><span class="n">${String(idx+1).padStart(2,'0')}</span><span class="tk">✓</span></span>
    <span class="mid">
      <span class="name">${esc(e.name)}</span>
      <span class="meta">${esc(e.muscle)}
        <span class="count${final?' final':''}">${badge.i}/${badge.n}</span>${
          e.also ? ` <span class="also">· also ${esc(e.also)}</span>` : ''}${doing}</span>
      <span class="restline">${REST[e.type]}${line2 ? ' · ' + line2 : ''}</span>
    </span>
    <span class="side">
      <span class="prescribe">${esc(e.sets)}</span>
      ${pillHTML}
      ${pbHTML}
    </span>
  </li>`;
}

          <button class="cta primary" data-ladder="done" style="--pc:${personDotColor(p.id)}">${doneToday ? 'Practised today ✓' : 'Mark practised today'}<span class="sub">logs it, no weight needed</span></button>
        </div>
        <div class="cta-row" style="margin-top:10px">
          <button class="cta ghost" data-ladder="up" ${lvl>=LADDER.length?'disabled':''}>Move up a level</button>

function bindLadderPanel(p){
  const root = document.getElementById('app');
  const done = root.querySelector('[data-ladder="done"]');
  if (done) done.addEventListener('click', () => {
    setLadder(p.id, { markDone:true });
    toast(`Ladder: ${esc(LADDER[Math.min(LADDER.length,(ladderOf(p.id)||{}).level||1)-1].t)} logged`, personDotColor(p.id));
  });
  const up = root.querySelector('[data-ladder="up"]');
  if (up) up.addEventListener('click', () => {
    const cur = (ladderOf(p.id) || {}).level || 1;
    setLadder(p.id, { level: Math.min(LADDER.length, cur + 1) });
    toast('Moved up — ' + esc(LADDER[Math.min(LADDER.length, cur + 1) - 1].t));
  });
  const down = root.querySelector('[data-ladder="down"]');
  if (down) down.addEventListener('click', () => {
    const cur = (ladderOf(p.id) || {}).level || 1;
    setLadder(p.id, { level: Math.max(1, cur - 1) });
    toast('Moved down a level');
  });
  root.querySelectorAll('[data-band] button').forEach(b => b.addEventListener('click', () => {
    setLadder(p.id, { band:+b.dataset.b });
    toast(BAND_LABEL[+b.dataset.b] ? 'Band: ' + BAND_LABEL[+b.dataset.b] : 'Band cleared');
  }));

function todayLiftFor(pid, day, idx){

  const slotKey = slotKeyOf(day.n, idx);

  if (isBWChoice(slot, canon)) return null;
  return liveLift(pid, canon, todayKey());
}

function backupNudgeHTML(){

  if (days != null && days < 30) return '';
  const text = days == null
    ? 'No backup yet — Settings → Data &amp; backup gives you a file copy.'
    : `Last backup ${days} days ago — worth a fresh one.`;

/* Blank the reps that the old version invented (it stored the top of the rep range on every
   save). Weights, dates, PBs and every other field are left exactly as they are, a backup is
   offered first, and nothing happens unless you press the button. */
function cleanOldReps(){
  const ids = [];
  const cut = S.repsCleanedAt || 1759600000000; // records logged before Release 1
  for (const p of S.people) for (const id of Object.keys(logOf(p.id).lifts)){
    const e = logOf(p.id).lifts[id];
    if (!e || e.kind !== 'lift' || e.deleted) continue;
    if (e.repsMode === 'last') continue;
    if (!Array.isArray(e.reps) || !e.reps.some(r => parseInt(r, 10) > 0)) continue;
    ids.push({ pid:p.id, id });
  }
  if (!ids.length){ toast('Nothing to clean — no auto-filled reps left'); return; }
  if (!confirm(`Blank the auto-filled reps on ${ids.length} old ${ids.length === 1 ? 'record' : 'records'}?\n\nWeights, dates and PBs are not touched, and you can export a backup first from the Settings sheet.`)) return;
  if (!confirm('Export a backup first if you have not already. Go ahead now?')) return;
  const snap = snapshotBefore(S.people.map(p => p.id));
  for (const x of ids){
    const e = logOf(x.pid).lifts[x.id];
    logOf(x.pid).lifts[x.id] = Object.assign({}, e, { reps:null, ts: now() });
    delete logOf(x.pid).lifts[x.id].repsMode;
  }
  for (const p of S.people) saveLog(p.id, true);
  registerUndo(snap);
  S.repsCleanedAt = now();
  saveSettings();
  toast(`Cleaned ${ids.length} records — weights and PBs untouched`, null, undoLast);
  render();
}

function renderSession(){
  setPersonAccent();
  const p = me();
  const day = currentDay();
  const todayDow = new Date().getDay();
  const isToday = day.dow === todayDow;
  const dateStr = new Date().toLocaleDateString('en-GB', {weekday:'long',day:'numeric',month:'long'}).toUpperCase();

  let eyebrow, rest = '';
  if (isToday){
    eyebrow = `<span class="live">● TODAY</span> &nbsp;${esc(dateStr)}`;
  } else {
    const FULL = { MON:'MONDAY', WED:'WEDNESDAY', FRI:'FRIDAY' };
    eyebrow = `${FULL[day.label] || (day.label + 'DAY')} SESSION`;
    const scheduled = DAYS.some(d => d.dow === todayDow);
    if (!scheduled){
      const next = DAYS.find(d => d.dow > todayDow) || DAYS[0];
      const gap = ((next.dow - todayDow) + 7) % 7;
      rest = `<div class="restnote">No session today — it's a rest day. Next up is
        <b>Day ${next.n}, ${next.title}</b>, ${gap === 1 ? 'tomorrow' : 'in ' + gap + ' days'}.
        Get your steps in.</div>`;
    }
  }

  const date = todayKey();
  const done = ticksFor(p.id, day.n, date);
  const order = orderFor(p.id, day.n, date, day.ex.length);
  const rows = order.map(i => dayRowHTML(day, i, p, date)).join('');

  const prevScroll = window.scrollY;
  const lastKey = sessionKey;
  sessionKey = p.id + ':' + day.n;
  const scrollToTop = lastKey !== sessionKey;

  document.getElementById('app').innerHTML = `
    <div class="anim" id="sessionRoot">
      <div class="eyebrow"><span class="who">${esc(p.name)}</span> &nbsp;·&nbsp; ${eyebrow}</div>
      <h1>Day <span class="idx">${day.n}</span></h1>
      <div class="focus">${esc(day.title)}</div>
      <div class="stats">${day.ex.length} exercises &nbsp;·&nbsp; ${setCount(day)} working sets &nbsp;·&nbsp; ${day.mins}</div>
      ${rest}

      <div class="block">
        <div class="block-label">Warm-up · 5–8 min</div>
        <p>${esc(day.warmup)}</p>
      </div>

      <div class="block">
        <div class="block-label">The session</div>
        <div class="taphint">Tap an exercise to log weight and reps</div>
        <div class="progress">
          <div class="bar"><span id="barfill"></span></div>
          <div class="ptext" id="ptext"></div>
          <button class="reset" id="reset" hidden>Reset</button>
        </div>
        <ol id="list">${rows}</ol>
      </div>

      <div class="block">
        <div class="block-label">Finisher</div>
        <p>${esc(day.finisher)}</p>
      </div>

      ${ladderPanelHTML(p)}

      <div class="block">
        <div class="block-label">Reference</div>
        ${REFERENCE}
      </div>

      <footer>
        Tap a weight pill to log what you lifted — weight and last-set reps — and it ticks the exercise off too.
        The number under the pill is your last set; below that is your <b style="color:var(--accent)">PB</b> for that lift.
        ${syncFooterHTML()}
        ${backupNudgeHTML()}
        <br><br>
        General fitness plan for healthy adults. Swap exercises if the kit is taken,
        something hurts, or an old injury says no.
      </footer>
    </div>`;

  paintSession(day, p, date, done);

  const list = document.getElementById('list');
  list.addEventListener('click', ev => {
    const pill = ev.target.closest('.pill');
    const li = ev.target.closest('li.ex');
    if (li && pill) ev.stopPropagation();
    if (li) openLogSheet(+li.dataset.i);
  });
  list.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const li = ev.target.closest('li.ex');
    if (li){ ev.preventDefault(); openLogSheet(+li.dataset.i); }
  });
  document.getElementById('reset').addEventListener('click', () => {
    if (!done.length) return;
    if (!confirm(`Clear ${p.name}'s ticks for today? (Lift logs are kept.)`)) return;
    setTicks(day.n, date, []);
  });
  bindSyncButtons();
  bindLadderPanel(p);
  if (scrollToTop) window.scrollTo(0,0);
  else window.scrollTo(0, prevScroll);
}

function paintSession(day, p, date, done){
  const total = day.ex.length;
  const n = done.length;
  document.querySelectorAll('#list li.ex').forEach(li => {
    const on = done.includes(+li.dataset.i);
    li.classList.toggle('done', on);
    li.setAttribute('aria-pressed', String(on));
  });
  const fill = document.getElementById('barfill');
  const txt  = document.getElementById('ptext');
  const rst  = document.getElementById('reset');
  if (!fill) return;
  fill.style.width = (n / total * 100) + '%';
  txt.textContent = n === total ? 'SESSION DONE' : `${n}/${total} DONE`;
  txt.classList.toggle('complete', n === total);
  rst.hidden = n === 0;
}

function setTicks(dow, date, items){
  const p = me();
  const t = logOf(p.id).ticks;
  const k = tickKey(dow, date);
  // always store (even empty) so a cleared day propagates through sync
  t[k] = { items:items.slice(), ts:now() };
  saveLog(p.id, true);
  render();
}

function toggleTick(dow, date, idx){
  const p = me();
  const cur = ticksFor(p.id, dow, date);
  const next = cur.includes(idx) ? cur.filter(x => x !== idx) : cur.concat([idx]).sort((a,b)=>a-b);
  setTicks(dow, date, next);
}

function bindSyncButtons(){
  document.querySelectorAll('[data-syncnow]').forEach(b => b.addEventListener('click', () => doSync()));
}

/* ============================================================
   Log sheet  (Release 1: last-set reps, undo, log-for-both, typo guard)
   ============================================================ */
function openLogSheet(idx){
  const p = me();
  const day = currentDay();
  const slot = day.ex[idx];
  const slotKey = slotKeyOf(day.n, idx);
  const date = todayKey();
  const doneNow = ticksFor(p.id, day.n, date).includes(idx);
  const chosen = chosenCanonFor(p.id, slotKey, slot);
  const isBW = isBWChoice(slot, chosen);
  const swapped = !!swapFor(p.id, day.n, date, idx);
  const subLabel = swapped ? labelForCanon(chosen, slot) : null;
  const lift = liveLift(p.id, chosen, date);
  const st = personStats(p.id, chosen);
  const pb = st ? st.pb : null;
  const last = st ? st.last : null;
  const presc = parsePresc(slot.sets);
  const colorVar = personDotColor(p.id);
  const ref = lift || last;                      // what the sheet pre-fills from
  const refReps = lastReps(ref);
  const partner = S.people.find(x => x.id !== p.id) || null;
  const canBoth = !!partner && !isBW;
  const unitHint = isPerHand(slot) ? `${UNIT} per dumbbell` : `${UNIT} per working set`;

  const body = `
    ${slot.opts ? `<div class="modal-sec" style="margin-top:14px"><span class="lbl">Which one today?</span>
      <div class="choicechips" data-choices>${slot.opts.map(o =>
        `<button data-c="${o.id}" aria-pressed="${chosen===o.id}">${esc(o.name)}</button>`).join('')}</div>
      <div class="choicehint">${slot.rotate
        ? `Today: <b style="color:var(--chalk)">${esc(labelForCanon(chosen, slot))}</b>. The app alternates these for you each week — tapping the other one switches it for today.`
        : 'Your choice is remembered and offered again next time.'}</div></div>` : ''}

    ${subLabel ? `<div class="hint-row" style="border-style:solid;margin-top:14px">
      Machine was taken — logging this as <b>${esc(subLabel)}</b> today.
      Your ${esc(slot.name)} history and PB are untouched.
      <button class="mini-btn" id="unsub" style="margin-top:10px;display:block">Put it back</button></div>` : ''}

    <div class="presc-line">
      <span>Set: <b>${esc(slot.sets)}</b></span>
      <span>Rest: <b>${REST[slot.type]}</b></span>
      ${slot.supersetWith != null ? `<span>Superset: <b>with #${slot.supersetWith + 1}</b></span>` : ''}
    </div>

    <div class="hint-row" id="lastrow">${lastHintHTML(last, pb, lift, isBW)}</div>

    ${isBW ? `
      <div class="modal-sec">
        <p style="font-size:15px;color:var(--chalk);opacity:.9;line-height:1.6">Nothing to weigh here — tap <b>Done</b> when you've finished your sets. Your pull-up ladder is at the bottom of the session.</p>
      </div>`
    : `
    <div class="modal-sec" id="wsec">
      <div class="winput-wrap">
        <input class="winput" id="winput" type="text" inputmode="decimal" autocomplete="off"
          value="${ref ? wFmt(ref.weight) : ''}"
          placeholder="—" aria-label="Weight in ${UNIT}">
        <span class="wunit">${unitHint}</span>
      </div>
      <div class="quickchips">
        <button class="qchip small" data-add="-2.5">−2.5</button>
        <button class="qchip" data-add="2.5">+2.5</button>
        <button class="qchip" data-add="5">+5</button>
        ${last ? `<button class="qchip small" data-last>last ${wFmt(last.weight)}</button>` : ''}
      </div>

      <div class="reps-block" id="repsblock">
        <div class="reps-title">
          <span>Reps · last set</span>
          <button class="toggle" id="repstoggle">log every set</button>
        </div>
        <div class="setrows" id="repsingle">
          <div class="setrow"><span class="s">Last set</span>
            <div class="setstepper">
              <button data-d="-1" aria-label="fewer reps">−</button>
              <input type="text" inputmode="numeric" value="${refReps != null ? refReps : ''}"
                placeholder="${presc ? presc.max : '—'}" aria-label="Reps in the last set">
              <button data-d="1" aria-label="more reps">+</button>
            </div>
          </div>
        </div>
        <div class="setrows" id="repsmulti" style="display:none">${multiRepRowsHTML(lift, presc)}</div>
        <div class="choicehint" id="rephint">Only the last set is saved — that's the one that counts.</div>
      </div>

      ${canBoth ? `
      <div class="reps-block" style="margin-top:18px">
        <div class="reps-title"><span>Who is this for?</span></div>
        <div class="choicechips" data-both>
          <button data-bothv="0" aria-pressed="true">Just ${esc(p.name)}</button>
          <button data-bothv="1" aria-pressed="false">${esc(p.name)} + ${esc(partner.name)}</button>
        </div>
        <div class="bothnote" id="bothnote" style="display:none">
          Saves the same weight and reps for both of you — each against their own exercise choice — and ticks it off for both.
        </div>
      </div>` : ''}
    </div>`}

    <div class="cta-row" style="margin-top:18px">
      <button class="cta ghost" id="subsbtn">Machine taken?</button>
      ${slot.supersetWith != null ? '<button class="cta ghost" id="ssbtn">Superset with #' + (slot.supersetWith + 1) + '</button>' : ''}
    </div>

    <div class="cta-row">
      ${isBW
        ? `<button class="cta primary" id="tickbtn" style="--pc:${colorVar}">${doneNow ? 'Untick this exercise' : 'Tick it done'}<span class="sub">${slot.bw ? 'bodyweight — nothing to log' : 'no weight to log — tick when done'}</span></button>`
        : lift
          ? `<button class="cta primary" id="savebtn" style="--pc:${colorVar}">Update</button>
             <button class="cta ghost" data-close>Close</button>`
          : `<button class="cta primary" id="savebtn" style="--pc:${colorVar}">Log</button>
             <button class="cta ghost" id="tickbtn">${doneNow ? 'Untick' : 'Done without a weight'}</button>`}
    </div>
    <p id="note" style="text-align:center;margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.5">${noteText(lift, doneNow)}</p>`;

  openOverlay(overlayShell(`${esc(slot.name)}`, `${esc(p.name)} · ${isBW ? 'bodyweight' : esc(slot.sets)}`, body, {center:true}));
  bindOverlayClicks();

  const root = document.getElementById('ov');
  root.style.setProperty('--pc', colorVar);

  let curLift = lift, curLast = last, curPb = pb;
  let both = false;
  const autoVal = () => curLift ? wFmt(curLift.weight) : (curLast ? wFmt(curLast.weight) : '');
  let autoRef = autoVal();

  const multiOn = () => { const m = document.getElementById('repsmulti'); return !!m && m.style.display !== 'none'; };
  function singleRep(){
    const el = document.querySelector('#repsingle .setstepper input');
    return el ? parseRepInput(el.value) : null;
  }
  function lastEnteredRep(){
    const inputs = [...document.querySelectorAll('#repsmulti .setstepper input')];
    for (let i = inputs.length - 1; i >= 0; i--){ const v = parseRepInput(inputs[i].value); if (v) return v; }
    return null;
  }
  function updateSaveBtn(){
    const el = document.getElementById('winput');
    const b = document.getElementById('savebtn');
    if (!el || !b) return;
    const w = parseWeight(el.value);
    const r = multiOn() ? lastEnteredRep() : singleRep();
    const base = curLift ? 'Update to' : 'Log';
    const wTxt = w != null ? `${wFmt(w)} ${UNIT}` : UNIT;
    const sub = both
      ? `for ${esc(p.name)} + ${esc(partner.name)}`
      : (curLift ? 'saves &amp; keeps it ticked' : 'saves &amp; ticks it off');
    b.innerHTML = `${base} ${wTxt}${r ? ' × ' + r : ''}<span class="sub">${sub}</span>`;
    b.classList.toggle('can', w != null);
    b.style.opacity = w != null ? 1 : .45;
  }

  if (slot.opts){
    root.querySelectorAll('[data-choices] button').forEach(b => b.addEventListener('click', () => {
      if (slot.rotate) setRotatePick(p.id, slotKey, b.dataset.c);
      else { S.lastChoice[p.id] = S.lastChoice[p.id] || {}; S.lastChoice[p.id][slotKey] = b.dataset.c; saveSettings(); }
      if (isBWChoice(slot, b.dataset.c) !== isBW){ openLogSheet(idx); return; }
      const c = b.dataset.c;
      root.querySelectorAll('[data-choices] button').forEach(x =>
        x.setAttribute('aria-pressed', String(x.dataset.c === c)));
      const wi = document.getElementById('winput');
      const typedW = wi ? wi.value.trim() : '';
      const ri = document.querySelector('#repsingle .setstepper input');
      const typedR = ri ? String(ri.value).trim() : '';
      const repsWereAuto = ri ? (typedR === '' || typedR === String(refReps != null ? refReps : '')) : true;
      curLift = liveLift(p.id, c, date);
      const st2 = personStats(p.id, c);
      curLast = st2 ? st2.last : null;
      curPb = st2 ? st2.pb : null;
      autoRef = autoVal();
      if (wi && !isBW && (!typedW || typedW === autoRef)) wi.value = '';
      if (wi && !isBW && !wi.value.trim()) wi.value = autoRef;
      if (ri && repsWereAuto){
        const r2 = lastReps(curLift || curLast);
        ri.value = r2 != null ? r2 : '';
      }
      const lr = document.getElementById('lastrow');
      if (lr) lr.innerHTML = lastHintHTML(curLast, curPb, curLift, isBW);
      const note = document.getElementById('note');
      if (note) note.innerHTML = noteText(curLift, doneNow);
      const lb = root.querySelector('[data-last]');
      if (lb){
        lb.textContent = curLast ? `last ${wFmt(curLast.weight)}` : '';
        lb.style.display = curLast ? '' : 'none';
      }
      if (!isBW) updateSaveBtn();
    }));
  }

  if (!isBW){
    const inp = document.getElementById('winput');
    inp.addEventListener('input', updateSaveBtn);
    root.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
      const cur = parseWeight(inp.value);
      const v = (cur != null ? cur : 0) + parseFloat(b.dataset.add);
      inp.value = v > 0 ? wFmt(v) : '';
      updateSaveBtn();
    }));
    const lastBtn = root.querySelector('[data-last]');
    if (lastBtn) lastBtn.addEventListener('click', () => {
      inp.value = curLast ? wFmt(curLast.weight) : '';
      updateSaveBtn();
    });

    /* one number by default, every set on request (the old way is still here) */
    document.getElementById('repstoggle').addEventListener('click', () => {
      const single = document.getElementById('repsingle');
      const multi = document.getElementById('repsmulti');
      const goingMulti = single.style.display !== 'none';
      single.style.display = goingMulti ? 'none' : '';
      multi.style.display = goingMulti ? '' : 'none';
      document.getElementById('repstoggle').textContent = goingMulti ? 'log one set' : 'log every set';
      document.getElementById('rephint').textContent = goingMulti
        ? 'Each set is saved as you enter it.'
        : "Only the last set is saved — that's the one that counts.";
      if (goingMulti){
        const v = singleRep();
        const inputs = [...multi.querySelectorAll('.setstepper input')];
        if (v) inputs.forEach(el => { if (!parseRepInput(el.value)) el.value = v; });
      } else {
        const el = single.querySelector('.setstepper input');
        const v = lastEnteredRep();
        if (el && v) el.value = v;
      }
      updateSaveBtn();
    });
    root.querySelectorAll('#repsingle .setstepper button, #repsmulti .setstepper button').forEach(b =>
      b.addEventListener('click', () => {
        const input = b.parentElement.querySelector('input');
        const step = +b.dataset.d;
        const cur = parseRepInput(input.value) || 0;
        const next = Math.max(0, Math.min(100, cur + step));
        input.value = next > 0 ? next : '';
        updateSaveBtn();
      }));
    root.querySelectorAll('#repsingle .setstepper input, #repsmulti .setstepper input').forEach(el =>
      el.addEventListener('input', updateSaveBtn));

    const rb = root.querySelector('[data-both]');
    if (rb) rb.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      both = b.dataset.bothv === '1';
      rb.querySelectorAll('button').forEach(x =>
        x.setAttribute('aria-pressed', String((x.dataset.bothv === '1') === both)));
      document.getElementById('bothnote').style.display = both ? 'block' : 'none';
      updateSaveBtn();
    }));

    updateSaveBtn();
  }

  const subsbtn = document.getElementById('subsbtn');
  if (subsbtn) subsbtn.addEventListener('click', () => { closeOverlay(); openSubsSheet(idx); });
  const ssbtn = document.getElementById('ssbtn');
  if (ssbtn) ssbtn.addEventListener('click', () => {
    const o = currentDay().ex[slot.supersetWith];
    toast(`Superset ${esc(CANON_LABEL[chosen] || slot.name)} with ${esc((o && o.name) || 'the next exercise')} — alternate them, rest at the end`);
  });
  const unsub = document.getElementById('unsub');
  if (unsub) unsub.addEventListener('click', () => {
    setSwap(p.id, day.n, date, idx, null);
    closeOverlay();
    toast('Back to ' + esc(slot.name));
    render();
  });

  const tickbtn = document.getElementById('tickbtn');
  if (tickbtn) tickbtn.addEventListener('click', () => {
    toggleTick(day.n, date, idx);          // toggles both ways for tick-only rows
    closeOverlay();
    toast(doneNow ? 'Unticked' : 'Ticked off — no weight logged', colorVar);
  });
  if (!isBW) document.getElementById('savebtn').addEventListener('click', () => saveLogSheet(idx, { both }));
}
function noteText(lift, doneNow){
  if (lift){
    const r = lastReps(lift);
    return `Logged today at <b style="color:var(--chalk)">${wFmt(lift.weight)} ${UNIT}${r ? ' × ' + r : ''}</b> — saving replaces it.`;
  }
  return doneNow ? 'This exercise is ticked today without a weight.' : 'Tap Log to record it, or Done to just tick it off.';
}

function multiRepRowsHTML(lift, presc){
  const sets = presc ? presc.sets : 3;
  const cur = (lift && Array.isArray(lift.reps)) ? lift.reps : [];
  let rows = '';
  for (let i=0;i<sets;i++){
    const v = (cur[i] != null && cur[i] > 0) ? cur[i] : '';
    rows += `<div class="setrow"><span class="s">Set ${i+1}</span>
      <div class="setstepper"><button data-d="-1" aria-label="fewer reps">−</button>
      <input type="text" inputmode="numeric" value="${v}" aria-label="Reps in set ${i+1}">
      <button data-d="1" aria-label="more reps">+</button></div></div>`;
  }
  return `<div class="setrows">${rows}</div>`;
}

function lastHintHTML(last, pb, lift, isBW){
  if (isBW) return 'Nothing to weigh — just tick it off when your sets are done.';
  let parts = [];
  if (last){
    const r = lastReps(last);
    parts.push(`Last: <b>${wFmt(last.weight)} ${UNIT}</b>${r ? ' × ' + r : ''} <span style="opacity:.6">· ${fmtGB(last.date)}</span>`);
  } else {
    parts.push('No weight logged for this lift yet — start it off!');
  }
  if (pb){
    const r = lastReps(pb);
    parts.push(`PB: <b style="color:var(--pc)">${wFmt(pb.weight)} ${UNIT}</b>${r ? ' × ' + r : ''} <span style="opacity:.6">· ${fmtGB(pb.date,true)}</span>`);
  }
  const beat = last && pb && lift && lift.weight > pb.weight;
  return `<div class="${beat ? 'pb-new' : ''}">${parts.join('<br>')}</div>`;
}

/* Reads the sheet, guards against typos, then writes. */
function saveLogSheet(idx, opts){
  opts = opts || {};
  const p = me();
  const day = currentDay();
  const slot = day.ex[idx];
  const slotKey = slotKeyOf(day.n, idx);
  const multiIsOn = (() => { const m = document.getElementById('repsmulti'); return !!m && m.style.display !== 'none'; })();

  let w = opts.w, reps = opts.reps, repsMode = opts.repsMode;
  if (w == null){
    w = parseWeight(document.getElementById('winput').value);
    if (multiIsOn){
      const vals = [...document.querySelectorAll('#repsmulti .setstepper input')].map(r => parseRepInput(r.value));
      if (vals.some(v => v != null)){ reps = vals; repsMode = 'all'; }
    } else {
      const v = singleRepFromSheet();
      if (v){ reps = [v]; repsMode = 'last'; }
    }
  }
  if (w == null || w > MAXW){ toast('Enter a valid weight first'); return; }

  const targets = [p].concat(opts.both ? S.people.filter(x => x.id !== p.id) : []);

  if (!opts.confirmed){
    const risky = [];
    for (const t of targets){
      const tc = chosenCanonFor(t.id, slotKey, slot);
      const tst = personStats(t.id, tc);
      if (tst && tst.pb && w > tst.pb.weight * 2 && (w - tst.pb.weight) >= 10)
        risky.push({ name:t.name, pb:tst.pb });
    }
    if (risky.length){ confirmRiskyWeight(idx, { w, reps, repsMode, both: !!opts.both }, risky); return; }
  }
  writeLift(idx, targets, { w, reps, repsMode });
}
function singleRepFromSheet(){
  const el = document.querySelector('#repsingle .setstepper input');
  return el ? parseRepInput(el.value) : null;
}
function confirmRiskyWeight(idx, payload, risky){
  const slot = currentDay().ex[idx];
  const r = risky[0];
  const body = `
    <p style="font-size:15px;line-height:1.65;color:var(--chalk);opacity:.92">
      <b>${wFmt(payload.w)} ${UNIT}</b> is more than double ${risky.length > 1 ? 'a' : esc(r.name) + "'s"} PB for
      ${esc(slot.name)} (${wFmt(r.pb.weight)} ${UNIT}, ${fmtGB(r.pb.date, true)}).
    </p>
    <p style="font-size:14px;color:var(--muted);line-height:1.6;margin-top:10px">
      A weight like that is the one mistake that permanently distorts your PB and trend, so this is the last check before it saves.</p>
    <div class="cta-row">
      <button class="cta ghost" data-close>Go back</button>
      <button class="cta primary" id="riskyes">Yes, log it</button>
    </div>`;
  openOverlay(overlayShell('That looks heavy', 'double-check before it saves', body, {center:true}));
  bindOverlayClicks();
  document.getElementById('riskyes').addEventListener('click', () => {
    closeOverlay();
    saveLogSheet(idx, Object.assign({}, payload, { confirmed:true }));
  });
}

/* The single write path for a logged lift — used by the sheet, the typo-confirm
   and "log for both". Nothing here removes or rewrites anything that exists. */
function writeLift(idx, targets, payload){
  const day = currentDay();
  const slot = day.ex[idx];
  const slotKey = slotKeyOf(day.n, idx);
  const date = todayKey();
  const { w, reps, repsMode } = payload;
  const snap = snapshotBefore(targets.map(t => t.id));
  const before = {};
  for (const t of targets){
    before[t.id] = personStats(t.id, chosenCanonFor(t.id, slotKey, slot));
  }
  const labelFor = canon => labelForCanon(canon, slot);
  for (const t of targets){
    const canon = chosenCanonFor(t.id, slotKey, slot);
    const eid = 'l:' + t.id + ':' + canon + ':' + date;
    const entry = { id:eid, kind:'lift', pid:t.id, ex:canon, name:labelFor(canon), date,
                    weight:w, reps:reps ? reps.slice() : null, ts:now(), day: day.n };
    if (reps && repsMode) entry.repsMode = repsMode;
    logOf(t.id).lifts[eid] = entry;
    const done = ticksFor(t.id, day.n, date);
    if (!done.includes(idx)){
      logOf(t.id).ticks[tickKey(day.n, date)] = { items:done.concat([idx]).sort((a,b)=>a-b), ts:now() };
    }
    saveLog(t.id, true);
  }
  closeOverlay();
  registerUndo(snap);

  const main = targets[0];
  const mainCanon = chosenCanonFor(main.id, slotKey, slot);
  const r = lastReps({ reps });
  const pbNames = targets.filter(t => {
    const b = before[t.id];
    return !(b && b.pb && b.pb.weight >= w);
  }).map(t => t.name);

  let msg = `Logged ${wFmt(w)} ${UNIT}${r ? ' × ' + r : ''} · ${esc(labelFor(mainCanon))}`;
  if (targets.length > 1) msg += ' — both of you';
  if (pbNames.length) msg += ` 🏆 PB${pbNames.length > 1 ? ' for both' : ' for ' + esc(pbNames[0])}`;
  toast(msg, personDotColor(main.id), undoLast);
  render();
}

/* ---- edit / delete a past record ---- */
function openEditSheet(entryId){
  const p = me();
  const e = logOf(p.id).lifts[entryId];
  if (!e || isDeleted(e)){ toast('That record is no longer here'); return; }
  const colorVar = personDotColor(p.id);

  const body = `
    <div class="modal-sec" style="margin-top:6px">
      <span class="lbl">Weight</span>
      <div class="winput-wrap" style="margin-top:2px">

        <button class="qchip small" data-add="-2.5">−2.5</button>

      </div>
    </div>
    <div class="modal-sec">
      <span class="lbl">Reps · last set</span>
      <div class="setrow"><span class="s">${repsModeOf(e) === 'last' ? 'Last set' : 'Last set (of ' + ((e.reps||[]).length || 1) + ' sets)'}</span>
        <div class="setstepper">
          <button data-rd="-1" aria-label="fewer reps">−</button>
          <input id="ewreps" type="text" inputmode="numeric" value="${r != null ? r : ''}" placeholder="—" aria-label="Reps in the last set">
          <button data-rd="1" aria-label="more reps">+</button>
        </div>
      </div>
    </div>
    <div class="modal-sec">

      <div class="choicehint">Changing the date moves the record and leaves a hidden marker on the old day, so the other phone follows.</div>
    </div>
    <div class="cta-row">
      <button class="cta primary" id="esave" style="--pc:${colorVar}">Save changes</button>
      <button class="cta ghost" data-close>Cancel</button>

    <div class="cta-row" style="margin-top:10px">
      <button class="cta danger" id="edel">Delete this record</button>
    </div>`;
  openOverlay(overlayShell(`${esc(e.name || e.ex)}`, `edit a past record · ${esc(p.name)}`, body, {center:true}));
  bindOverlayClicks();
  const root = document.getElementById('ov');
  root.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    const inp = document.getElementById('ewin');
    const cur = parseWeight(inp.value);
    const v = (cur != null ? cur : 0) + parseFloat(b.dataset.add);
    inp.value = v > 0 ? wFmt(v) : '';
  }));
  root.querySelectorAll('[data-rd]').forEach(b => b.addEventListener('click', () => {
    const input = document.getElementById('ewreps');
    const cur = parseRepInput(input.value) || 0;
    const next = Math.max(0, Math.min(100, cur + (+b.dataset.rd)));
    input.value = next > 0 ? next : '';
  }));
  document.getElementById('esave').addEventListener('click', () => saveEdit(entryId));
  document.getElementById('edel').addEventListener('click', () => deleteRecord(entryId));
}
function saveEdit(entryId){
  const p = me();
  const e = logOf(p.id).lifts[entryId];
  if (!e) return;
  const w = parseWeight(document.getElementById('ewin').value);
  const rv = parseRepInput(document.getElementById('ewreps').value);
  const newDate = document.getElementById('ewdate').value || e.date;
  if (w == null || w > MAXW){ toast('Enter a valid weight first'); return; }
  const snap = snapshotBefore([p.id]);
  const entry = Object.assign({}, e, { weight:w, reps: rv ? [rv] : null, ts: now() });
  if (rv) entry.repsMode = 'last'; else delete entry.repsMode;

  if (newDate !== e.date){
    const newId = 'l:' + p.id + ':' + e.ex + ':' + newDate;
    entry.id = newId; entry.date = newDate;
    logOf(p.id).lifts[newId] = entry;
    logOf(p.id).lifts[entryId] = Object.assign({}, e, { deleted:true, ts: now() });
  } else {
    logOf(p.id).lifts[entryId] = entry;
  }
  saveLog(p.id, true);
  registerUndo(snap);
  closeOverlay();
  toast(`Updated ${wFmt(w)} ${UNIT}${rv ? ' × ' + rv : ''} · ${esc(e.name || e.ex)}`, personDotColor(p.id), undoLast);
  render();
  openHistory(e.ex);          // straight back to the list, so you can see it changed
}
function deleteRecord(entryId){
  const p = me();
  const e = logOf(p.id).lifts[entryId];
  if (!e) return;
  const snap = snapshotBefore([p.id]);
  logOf(p.id).lifts[entryId] = Object.assign({}, e, { deleted:true, ts: now() });
  saveLog(p.id, true);
  registerUndo(snap);
  closeOverlay();
  toast(`Deleted ${wFmt(e.weight)} ${UNIT} · ${fmtGB(e.date, true)}`, personDotColor(p.id), undoLast);
  render();
  openHistory(e.ex);
}

function renderProgress(){

function muscleFor(ex){
  for (const d of DAYS) for (const e of d.ex) if (e.canon === ex || (e.opts && e.opts.some(o=>o.id===ex))) return e.muscle;
  return MUSCLE_FALLBACK[ex] || '';
}
function liftCount(lifts){
  const days = new Set(lifts.map(e => e.date));
  return days.size;
}
function sparkSVG(weights){
  if (weights.length < 2) return '<span class="spark" style="display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);letter-spacing:.05em;font-family:\'IBM Plex Mono\',monospace">soon</span>';
  const w = 74, h = 28, p = 3;
  const mn = Math.min(...weights), mx = Math.max(...weights);
  const rng = (mx - mn) || 1;
  const pts = weights.map((v,i) => {
    const x = p + (i/(weights.length-1))*(w-2*p);
    const y = h - p - ((v - mn)/rng)*(h-2*p);
    return [x,y];
  });
  const line = pts.map(pt => pt.map(v=>v.toFixed(1)).join(',')).join(' ');
  const last = pts[pts.length-1];
  const first = pts[0];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${first[0].toFixed(1)},${h-p} ${line}" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--accent)" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.4" fill="var(--accent)"/>
  </svg>`;
}

function openHistory(ex){

  let hist = entries.slice().reverse().map(e => {

        aria-label="Edit the record from ${fmtGB(e.date, true)}">

      </div>
      ${detail ? `<div class="hreps">${esc(detail)}</div>`

  }).join('');

  const body = `
    <div class="modal-sec" style="margin-top:10px">
      <div class="sumline" style="margin-top:0">
        <div class="statcard"><span class="v" style="color:${colorVar}">${pb ? wFmt(pb.weight) : '—'}</span><span class="k">PB ${UNIT} · ${pb ? fmtGB(pb.date,true) : ''}</span></div>
        <div class="statcard"><span class="v" style="color:${colorVar}">${entries.length}</span><span class="k">sessions</span></div>
        <div class="statcard"><span class="v" style="color:${colorVar}">${pb ? wFmt(pb.weight) + (lastReps(pb) ? '×' + lastReps(pb) : '') : '—'}</span><span class="k">best set</span></div>
      </div>
      ${entries.length >= 2 ? `<div style="margin-top:16px;text-align:center">${sparkSVG(entries.map(e=>e.weight)).replace('<span class="spark"','<span class="spark" style="width:100%;height:46px"')}</div>` : ''}
    </div>
    <div class="modal-sec"><span class="lbl">Every logged session — tap one to edit or delete it</span>${hist || '<div class="empty">Nothing yet.</div>'}</div>`;

  openOverlay(overlayShell(`${esc(name)} — ${esc(p.name)}`, `PB &amp; full history · ${UNIT}`, body, {full:false, center:false}));
  bindOverlayClicks();
  const hroot = document.getElementById('ov');
  const openEd = ev => {
    const item = ev.target.closest('.hist-item');
    if (item && item.dataset.eid) openEditSheet(item.dataset.eid);
  };
  hroot.querySelectorAll('.hist-item').forEach(item => {

}

/* ============================================================
   Timer tab
   ============================================================ */
const Timer = { total:0, left:0, raf:null, end:0, running:false, preset:null };
let audioCtx = null;
function beep(){
  try {
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.3, audioCtx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + .5);
    o.start(); o.stop(audioCtx.currentTime + .55);
  } catch(e){}
}
const timerLeft = () => Math.max(0, Math.round((Timer.end - now())/1000));
const timerLabel = () => {
  if (Timer.running) return 'Pause';
  if (Timer.total > 0 && Timer.left < Timer.total) return 'Resume'; // paused mid-countdown
  return 'Start';
};
function renderTimer(){
  setPersonAccent();
  const total = Timer.total, left = Math.max(0, Math.round(Timer.running ? (Timer.end - now())/1000 : Timer.left));
  const pct = total ? (1 - left/total)*100 : 0;
  const mm = String(Math.floor(left/60)).padStart(2,'0'), ss = String(left%60).padStart(2,'0');
  const hasPreset = !!Timer.preset;
  document.getElementById('app').innerHTML = `
    <div class="anim">
      <div class="eyebrow">REST <span class="live">TIMER</span></div>
      <h1 class="small">Between <span class="idx">sets</span></h1>
      <div class="timer-card">
        <div class="tring" id="tring"><span class="tdisp" id="tdisp">${mm}:${ss}<span class="unit">sec</span></span></div>
        <div class="tctl">
          <button class="cta ${Timer.running?'ghost':'primary'}" id="tstart">${timerLabel()}</button>
          <button class="cta ghost" id="treset" ${total?'':'disabled'}>Reset</button>
        </div>
        <div class="tpresets" id="tpresets">
          <button class="tpreset" data-s="105" aria-pressed="${hasPreset && Timer.preset===105}">Compound 1:45</button>
          <button class="tpreset" data-s="60"  aria-pressed="${hasPreset && Timer.preset===60}">Isolation 1:00</button>
          <button class="tpreset" data-s="45"  aria-pressed="${hasPreset && Timer.preset===45}">Core 0:45</button>
        </div>
        <div class="tend-note" id="tendnote"></div>
        <p style="margin-top:22px;font-size:13px;color:var(--muted);line-height:1.6">Presets match the plan: compounds 90–120s, isolation 45–75s, core 30–60s. The timer pings when it's time to lift again.</p>
      </div>
    </div>`;
  const ring = document.getElementById('tring');
  ring.style.background = `conic-gradient(var(--accent) ${pct*3.6}deg, var(--line) 0deg)`;
  document.getElementById('tstart').addEventListener('click', toggleTimer);
  document.getElementById('treset').addEventListener('click', () => {
    Timer.running = false; cancelAnimationFrame(Timer.raf);
    Timer.total = 0; Timer.left = 0; Timer.preset = null;
    renderTimer();
  });
  document.querySelectorAll('.tpreset').forEach(b => b.addEventListener('click', () => {
    const s = +b.dataset.s;
    Timer.running = false; cancelAnimationFrame(Timer.raf);
    Timer.total = s; Timer.left = s; Timer.preset = s;
    renderTimer();
    beep();
  }));
  document.getElementById('tendnote').innerHTML = '';
}
function toggleTimer(){
  if (Timer.running){
    // pause — in place, no screen rebuild
    Timer.running = false;
    cancelAnimationFrame(Timer.raf);
    Timer.left = timerLeft();
    const btn = document.getElementById('tstart');
    if (btn) btn.textContent = 'Resume';
    paintTimer();
    return;
  }
  if (!Timer.total){
    // Start with no preset picked → default to compound
    Timer.total = REST_MIN.compound; Timer.left = Timer.total; Timer.preset = REST_MIN.compound;
    renderTimer();
    return;
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  Timer.end = now() + Timer.left*1000;
  Timer.running = true;
  const btn = document.getElementById('tstart');
  if (btn) btn.textContent = 'Pause';
  tickTimer();
}
function paintTimer(){
  const left = Math.max(0, Math.round(Timer.running ? (Timer.end - now())/1000 : Timer.left));
  const d = document.getElementById('tdisp');
  const ring = document.getElementById('tring');
  if (!d) return;
  const mm = String(Math.floor(left/60)).padStart(2,'0'), ss = String(left%60).padStart(2,'0');
  d.innerHTML = `${mm}:${ss}<span class="unit">sec</span>`;
  if (ring){
    const pct = Timer.total ? (1 - left/Timer.total)*100 : 0;
    ring.style.background = `conic-gradient(var(--accent) ${pct*3.6}deg, var(--line) 0deg)`;
  }
}
function tickTimer(){
  if (!Timer.running) return;
  const left = timerLeft();
  Timer.left = left;
  const d = document.getElementById('tdisp');
  const ring = document.getElementById('tring');
  if (d && ring){
    const mm = String(Math.floor(left/60)).padStart(2,'0'), ss = String(left%60).padStart(2,'0');
    d.innerHTML = `${mm}:${ss}<span class="unit">sec</span>`;
    const pct = Timer.total ? (1 - left/Timer.total)*100 : 0;
    ring.style.background = `conic-gradient(var(--accent) ${pct*3.6}deg, var(--line) 0deg)`;
  }
  if (left <= 0){
    Timer.running = false;
    beep(); setTimeout(beep, 500); setTimeout(beep, 1000);
    try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
    const n = document.getElementById('tendnote');
    if (n) n.innerHTML = `<b>Time's up</b> — rest over, next set when you're ready.`;
    const b = document.getElementById('tstart');
    if (b) b.textContent = 'Start';
    if (d) d.innerHTML = `00:00<span class="unit">sec</span>`;
    Timer.left = Timer.total; // pressing Start runs a fresh full rest
    return;
  }
  Timer.raf = requestAnimationFrame(tickTimer);
}
