<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Session">
<meta name="theme-color" content="#12161A">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#12161A;
    --surface:#1A2026;
    --line:#2A333C;
    --chalk:#EDE8DF;
    --muted:#7C8894;
    --d1:#F5C518;   /* day accent: Monday   */
    --d2:#4C8DFF;   /* day accent: Wednesday */
    --d3:#F0575C;   /* day accent: Friday    */
    --p1:#AABA99;   /* Danny   */
    --p2:#2b7b78;   /* Kieran  */
    --accent:var(--d1);
    --pad:20px;
    --tabh:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;touch-action:manipulation;}
  body{
    background:var(--base);
    color:var(--chalk);
    font-family:'Archivo',system-ui,sans-serif;
    font-size:16px;
    line-height:1.45;
    padding:max(env(safe-area-inset-top),14px) var(--pad) calc(env(safe-area-inset-bottom) + var(--tabh) + 34px);
    max-width:620px;
    margin:0 auto;
    overscroll-behavior-y:contain;
    min-height:100vh;
  }

  button{font-family:inherit;}

  /* ---- person switcher ---- */
  .persons{display:flex;gap:6px;margin-bottom:12px;}
  .person{
    flex:1;
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:500;
    letter-spacing:.1em;
    padding:9px 0 8px;
    border-radius:3px;
    cursor:pointer;
    text-transform:uppercase;
    transition:color .15s,border-color .15s,background .15s,box-shadow .15s;
  }
  .person .dot{width:8px;height:8px;border-radius:50%;background:transparent;flex:none;}
  .person[data-a="0"] .dot{background:var(--p1);}
  .person[data-a="1"] .dot{background:var(--p2);}
  .person[aria-pressed="true"]{
    border-color:var(--pc,var(--line));
    color:var(--chalk);
    box-shadow:inset 0 0 0 1px var(--pc,var(--line));
  }
  .person:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .gear{
    flex:none;width:46px;
    border:1px solid var(--line);border-radius:3px;background:transparent;
    color:var(--muted);font-size:20px;line-height:1;cursor:pointer;
    transition:color .15s,border-color .15s;
  }
  .gear:hover{color:var(--chalk);border-color:var(--chalk);}
  .gear:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .toprow{display:flex;gap:8px;align-items:stretch;margin-bottom:12px;}
  .toprow .persons{flex:1;margin-bottom:0;}

  /* ---- day switcher ---- */
  .switch{display:flex;gap:6px;margin-bottom:26px;}
  .switch button{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:500;
    letter-spacing:.14em;
    padding:11px 0 10px;
    border-radius:3px;
    cursor:pointer;
    transition:color .15s,border-color .15s,background .15s;
  }
  .switch button[aria-pressed="true"]{
    color:var(--base);
    background:var(--accent);
    border-color:var(--accent);
    font-weight:600;
  }
  .switch button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}

  /* ---- header ---- */
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.2em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .eyebrow .live{color:var(--accent);}
  .eyebrow .who{color:var(--pc,#fff);font-weight:600;}
  h1{
    font-size:clamp(46px,15vw,64px);
    font-weight:900;
    line-height:.88;
    letter-spacing:-.035em;
    margin:10px 0 6px;
    text-transform:uppercase;
  }
  h1 .idx{color:var(--accent);}
  h1.small{font-size:clamp(34px,10vw,44px);line-height:.95;}
  .focus{font-size:17px;font-weight:600;color:var(--chalk);letter-spacing:-.01em;}
  .stats{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-top:9px;letter-spacing:.02em;}
  .restnote{
    border:1px dashed var(--line);
    border-radius:4px;
    padding:13px 15px;
    margin-top:18px;
    font-size:14.5px;
    color:var(--muted);
    line-height:1.5;
  }
  .restnote b{color:var(--chalk);font-weight:600;}

  /* ---- blocks ---- */
  .block{margin-top:26px;border-top:1px solid var(--line);padding-top:16px;}
  .block-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.2em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:9px;
  }
  .block p{font-size:15.5px;color:var(--chalk);opacity:.9;}

  /* ---- exercise rows ---- */
  ol{list-style:none;margin-top:6px;}
  li.ex{
    display:grid;
    grid-template-columns:36px 1fr auto;
    column-gap:12px;
    padding:15px 0 14px;
    border-bottom:1px solid var(--line);
    align-items:start;
  }
  li.ex:last-child{border-bottom:none;}
  li.ex{cursor:pointer;transition:opacity .22s ease;}
  li.ex:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px;}
  li.ex:active{opacity:.75;}
  .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    font-weight:600;
    color:var(--accent);
    opacity:.65;
    line-height:1.3;
  }
  .num .tk{display:none;}

  .mid{min-width:0;}
  .side{text-align:right;min-width:118px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}

  .name{font-size:18.5px;font-weight:700;letter-spacing:-.015em;line-height:1.2;display:block;}
  .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    margin-top:5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    display:block;
    line-height:1.5;
  }
  .meta .count{color:var(--chalk);font-weight:500;}
  .meta .count.final{color:var(--accent);}
  .meta .also{text-transform:none;letter-spacing:.01em;}
  .meta .choice{color:var(--pc,var(--chalk));}
  .restline{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-top:3px;
    letter-spacing:.04em;
    opacity:.8;
    display:block;
  }

  .prescribe{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    white-space:nowrap;
    letter-spacing:-.01em;
    line-height:1.4;
  }
  .pill{
    min-width:96px;
    height:42px;
    padding:0 14px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid var(--line);
    border-radius:3px;
    background:transparent;
    color:var(--chalk);
    font-family:'IBM Plex Mono',monospace;
    font-size:17px;
    font-weight:600;
    letter-spacing:-.01em;
    cursor:pointer;
    transition:border-color .15s,background .15s,color .15s,box-shadow .15s;
    white-space:nowrap;
  }
  .pill .u{font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.05em;}
  .pill.has{color:var(--pc,var(--accent));border-color:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px var(--pc,var(--accent));}
  .pill.logged{background:var(--pc,var(--accent));border-color:var(--pc,var(--accent));color:var(--base);}
  .pill.logged .u{color:inherit;opacity:.65;}
  .pill:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .pbline{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.03em;
    color:var(--muted);
    line-height:1.45;
    text-align:right;
    white-space:nowrap;
  }
  .pbline b{color:var(--pc,var(--accent));font-weight:600;}
  .pbline.blank{opacity:.55;}

  /* completed */
  li.ex.done{opacity:.4;}
  li.ex.done .name{text-decoration:line-through;text-decoration-thickness:1.5px;font-weight:600;}
  li.ex.done .num .n{display:none;}
  li.ex.done .num .tk{display:inline;opacity:1;font-size:16px;}
  li.ex.done .num{opacity:1;}

  /* progress bar */
  .progress{display:flex;align-items:center;gap:12px;margin-top:14px;}
  .bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
  .bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s cubic-bezier(.2,.7,.3,1);}
  .ptext{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.12em;color:var(--muted);white-space:nowrap;}
  .ptext.complete{color:var(--accent);}
  .reset{
    background:none;border:1px solid var(--line);color:var(--muted);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;padding:6px 10px;border-radius:3px;cursor:pointer;
  }
  .reset:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .taphint{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
    color:var(--muted);text-transform:uppercase;margin-bottom:2px;
  }

  /* ---- reference ---- */
  details{margin-top:14px;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  summary{
    list-style:none;cursor:pointer;padding:14px 15px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;
  }
  summary::-webkit-details-marker{display:none;}
  summary::after{content:'+';font-size:17px;color:var(--accent);line-height:1;}
  details[open] summary{color:var(--chalk);border-bottom:1px solid var(--line);}
  details[open] summary::after{content:'–';}
  .ref-body{padding:15px;font-size:15px;line-height:1.55;}
  .ref-body p+p{margin-top:11px;}
  .ref-body ul{margin:9px 0 0 17px;}
  .ref-body li{margin-bottom:7px;}
  .ref-body strong{font-weight:700;}
  .ref-row{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;align-items:baseline;}
  .ref-row:last-child{border-bottom:none;}
  .ref-row .k{flex:1;color:var(--chalk);}
  .ref-row .v{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);white-space:nowrap;text-align:right;}

  /* ---- bottom tabs ---- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;justify-content:center;gap:6px;
    padding:8px var(--pad) calc(env(safe-area-inset-bottom) + 8px);
    background:rgba(18,22,26,.92);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    pointer-events:none;
  }
  .tabbar nav{
    pointer-events:auto;
    width:100%;max-width:520px;
    display:flex;gap:6px;
  }
  .tabbar button{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:transparent;border:none;border-radius:6px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    padding:7px 0 5px;cursor:pointer;
    transition:color .15s,background .15s;
  }
  .tabbar button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tabbar button[aria-pressed="true"]{color:var(--accent);background:rgba(255,255,255,.04);}
  .tabbar button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}

  /* ---- modal shell ---- */
  .overlay{
    position:fixed;inset:0;z-index:60;
    display:flex;align-items:flex-end;justify-content:center;
    background:rgba(8,10,12,.62);
    animation:fade .2s ease both;
  }
  .sheet{
    width:100%;max-width:620px;max-height:min(88vh,860px);
    overflow-y:auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:14px 14px 0 0;
    padding:20px var(--pad) calc(env(safe-area-inset-bottom) + 20px);
    animation:rise .3s cubic-bezier(.2,.7,.3,1) both;
  }
  .sheet.full{
    border-radius:0;max-height:none;height:100%;max-width:620px;margin:0 auto;
    padding-top:calc(env(safe-area-inset-top) + 16px);
    animation:fade .2s ease both;
  }
  .overlay.center{align-items:center;}
  .overlay.center .sheet{border-radius:14px;border-bottom:1px solid var(--line);max-height:90vh;}
  .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px;flex:none;}
  .modal-title{
    font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.2;
    display:flex;align-items:baseline;gap:10px;justify-content:space-between;
  }
  .modal-sub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:7px;}
  .close-x{
    background:none;border:1px solid var(--line);color:var(--muted);
    width:34px;height:34px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;flex:none;
  }
  .close-x:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .modal-sec{margin-top:22px;}
  .modal-sec > .lbl{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;
    color:var(--muted);text-transform:uppercase;margin-bottom:9px;display:block;
  }

  /* log sheet */
  .presc-line{
    display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);letter-spacing:.02em;
  }
  .presc-line b{color:var(--chalk);font-weight:600;}
  .choicechips{display:flex;gap:8px;margin-top:4px;}
  .choicechips button{
    flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
    font-size:14.5px;font-weight:600;padding:11px 8px;border-radius:3px;cursor:pointer;
    transition:all .15s;
  }
  .choicechips button[aria-pressed="true"]{border-color:var(--pc,var(--accent));color:var(--base);background:var(--pc,var(--accent));}
  .choicechips button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .hint-row{
    margin-top:16px;border:1px dashed var(--line);border-radius:4px;
    padding:12px 13px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.55;color:var(--muted);
  }
  .hint-row b{color:var(--accent);font-weight:600;}
  .hint-row .pb{color:var(--chalk);}
  .hint-row.pb-new{border-color:var(--accent);background:rgba(245,197,24,.06);}

  .winput-wrap{margin-top:18px;text-align:center;}
  .winput{
    width:100%;max-width:260px;text-align:center;
    background:transparent;border:none;border-bottom:2px solid var(--line);
    color:var(--chalk);
    font-family:'IBM Plex Mono',monospace;
    font-size:56px;font-weight:600;letter-spacing:-.02em;
    padding:2px 0 8px;outline:none;caret-color:var(--accent);
    -moz-appearance:textfield;
  }
  .winput::-webkit-outer-spin-button,.winput::-webkit-inner-spin-button{-webkit-appearance:none;}
  .winput:focus{border-bottom-color:var(--accent);}
  .wunit{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px;display:block;}
  .quickchips{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
  .qchip{
    border:1px solid var(--line);background:var(--base);color:var(--chalk);
    font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;
    min-width:64px;padding:11px 12px;border-radius:3px;cursor:pointer;
    transition:border-color .15s,color .15s,background .15s;
  }
  .qchip.small{min-width:0;font-size:13px;padding:10px 13px;}
  .qchip:hover{border-color:var(--accent);color:var(--accent);}
  .qchip:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}

  .reps-block{margin-top:22px;}
  .reps-title{
    display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;
    color:var(--muted);text-transform:uppercase;
  }
  .reps-title .toggle{color:var(--accent);text-transform:uppercase;font-size:10px;letter-spacing:.12em;border:none;background:none;cursor:pointer;font-family:inherit;}
  .setrow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;
  }
  .setrow:last-child{border-bottom:none;}
  .setrow .s{color:var(--muted);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;}
  .setstepper{display:flex;align-items:center;gap:0;}
  .setstepper button{
    width:42px;height:38px;border:1px solid var(--line);background:var(--base);
    color:var(--chalk);font-size:18px;cursor:pointer;line-height:1;
  }
  .setstepper button:first-child{border-radius:3px 0 0 3px;}
  .setstepper button:last-child{border-radius:0 3px 3px 0;}
  .setstepper button:focus-visible{outline:2px solid var(--chalk);outline-offset:1px;}
  .setstepper input{
    width:52px;height:38px;border:1px solid var(--line);border-left:none;border-right:none;
    background:var(--base);color:var(--chalk);text-align:center;
    font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;outline:none;
  }

  .cta-row{display:flex;gap:10px;margin-top:26px;}
  .cta{
    flex:1;border:none;border-radius:4px;padding:16px 10px;
    font-size:16px;font-weight:700;letter-spacing:-.01em;cursor:pointer;
    font-family:inherit;
    transition:transform .1s,opacity .15s;
  }
  .cta:active{transform:scale(.98);}
  .cta.primary{background:var(--pc,var(--accent));color:var(--base);}
  .cta.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600;}
  .cta.danger{background:transparent;border:1px solid var(--d3);color:var(--d3);}
  .cta:disabled{opacity:.4;cursor:default;}
  .cta:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  .cta .sub{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-top:3px;}

  /* toast */
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + var(--tabh) + 14px);
    z-index:80;max-width:calc(100% - 40px);
    background:var(--pc,var(--accent));color:var(--base);
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.08em;
    padding:12px 18px;border-radius:4px;text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    animation:rise .25s cubic-bezier(.2,.7,.3,1) both;
    display:none;
  }
  .toast.show{display:block;}

  /* progress tab */
  .sumline{
    display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;
  }
  .statcard{
    flex:1;min-width:110px;border:1px solid var(--line);border-radius:4px;padding:12px 13px;
  }
  .statcard .v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--pc,var(--accent));line-height:1;}
  .statcard .k{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:7px;display:block;line-height:1.5;}
  .pr-group{margin-top:22px;}
  .pr-group .glabel{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--muted);
    text-transform:uppercase;margin-bottom:2px;display:flex;justify-content:space-between;
  }
  .pr-row{
    display:flex;align-items:center;gap:12px;
    padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;
    transition:opacity .15s;
  }
  .pr-row:last-child{border-bottom:none;}
  .pr-row:active{opacity:.6;}
  .pr-row .rn{flex:1;min-width:0;}

/* ============================================================

   the page runs inside a shell that injects window.storage),

   ============================================================ */
const mem = {};
const Store = {
  async get(k){
    try { if (window.storage) { const r = await window.storage.get(k); if (r) return r.value; } } catch(e){}
    try { const v = localStorage.getItem(k); if (v !== null) return v; } catch(e){}
    return k in mem ? mem[k] : null;
  },
  async set(k,v){
    mem[k] = v;
    try { if (window.storage) { await window.storage.set(k,v); return; } } catch(e){}
    try { localStorage.setItem(k,v); } catch(e){}
  }
};

const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// deterministic sha-256 hex (compact, public-domain style implementation)
const sha256 = (() => {
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

    const l=bytes.length;
    let n=Math.ceil((l+1)/64)*64;
    const msg=new Uint8Array(n+64);
    for(let i=0;i<l;i++)msg[i]=bytes.charCodeAt(i);
    msg[l]=0x80;
    const bitLen=l*8;
    const dv=new DataView(msg.buffer);
    dv.setUint32(n,0);dv.setUint32(n+4,0);
    dv.setUint32(n+8,Math.floor(bitLen/0x100000000));
    dv.setUint32(n+12,bitLen>>>0);

function parsePresc(s){

  if (!m) return null;
  return { sets:+m[1], min:+m[2], max:+m[3], tail:m[4] };

function liftsOf(pid){

function liftsByCanon(pid, canon){

function ticksFor(pid, dow, date){

function personStats(pid, canon){
  const list = liftsByCanon(pid, canon);

/* which canon ids this slot could refer to */
function slotCanons(slot){
  if (slot.opts && slot.opts.length) return slot.opts.map(o => o.id);
  return [slot.canon];
}
function slotKeyOf(dayN, idx){ return dayN + ':' + idx; }
function lastChoiceFor(pid, slotKey, slot){
  const c = S.lastChoice[pid] && S.lastChoice[pid][slotKey];
  if (c && slot.opts && slot.opts.some(o => o.id === c)) return c;
  return slot.opts ? slot.opts[0].id : null;
}
/* the canon this person is actually doing for this slot:
   last explicit pick, else the option they lifted most recently,
   else the first option. Keeps "Squat or Leg Press" honest. */
function chosenCanonFor(pid, slotKey, slot){
  if (!slot.opts || !slot.opts.length) return slot.canon;
  const canons = slotCanons(slot);
  const stored = S.lastChoice[pid] && S.lastChoice[pid][slotKey];
  if (stored && canons.includes(stored)) return stored; // an explicit pick wins
  const recs = liftsOf(pid).filter(e => canons.includes(e.ex));
  const latest = recs.length ? recs[0].ex : null;       // liftsOf is newest-first
  return latest || slot.opts[0].id;
}
function slotLastLift(pid, slot, slotKey){
  const canons = slotCanons(slot);
  const ch = slot.opts ? lastChoiceFor(pid, slotKey, slot) : null;
  const list = liftsOf(pid).filter(e => canons.includes(e.ex));
  if (!list.length) return null;
  return list.find(e => ch && e.ex === ch) || list[0];
}

   Persistence
   ============================================================ */
const K = {
  settings:'gym:settings',
  log:p => 'gym:log:' + p
};
let saveLogTimer = {};
async function saveSettings(){ await Store.set(K.settings, JSON.stringify(S)); }
function saveLog(pid, immediate){
  clearTimeout(saveLogTimer[pid]);
  saveLogTimer[pid] = setTimeout(() => {
    Store.set(K.log(pid), JSON.stringify(logs[pid]));
    scheduleSync();
  }, immediate ? 0 : 350);
}
async function loadSettings(){
  const raw = await Store.get(K.settings);
  if (raw){ try { S = Object.assign(settingsDefault(), JSON.parse(raw)); } catch(e){ S = settingsDefault(); } }
  else S = settingsDefault();
  if (!S.people || !S.people.length) S.people = settingsDefault().people;
  // person colours moved from the day accents to their own pair — remap older saves
  if (S.people) S.people.forEach(pp => {
    if (pp.color === '--d1') pp.color = '--p1';
    else if (pp.color === '--d2') pp.color = '--p2';
  });
  if (!S.people.find(p => p.id === S.sel)) S.sel = S.people[0].id;
  if (!S.people.find(p => p.id === S.owner)) S.owner = S.people[0].id;
}
async function loadLogs(){
  for (const p of S.people){
    const raw = await Store.get(K.log(p.id));
    if (raw){ try { const o = JSON.parse(raw); logs[p.id] = { lifts:o.lifts||{}, ticks:o.ticks||{} }; } catch(e){ logs[p.id] = {lifts:{},ticks:{}}; } }
    else logs[p.id] = {lifts:{},ticks:{}};
  }
}

/* migrate pre-two-people data ("session:1:2026-09-08") into the owner's log */
async function migrateLegacy(){
  if (S.legacyMigrated) return;
  S.legacyMigrated = true;
  try {
    for (let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      const m = /^session:(\d):([\d-]+)$/.exec(k);
      if (!m) continue;
      const raw = localStorage.getItem(k);
      const items = JSON.parse(raw);
      if (Array.isArray(items) && items.length){
        const t = logOf(S.owner).ticks;
        const key = tickKey(m[1], m[2]);
        const old = t[key];
        const merged = [...new Set([...(old?old.items:[]), ...items.map(Number)])].sort((a,b)=>a-b);
        t[key] = { items:merged, ts: now() };
      }
    }
  } catch(e){}
  saveLog(S.owner, true);
  await saveSettings();
}

}

  return DAYS.find(x => x.n === selDayN) || openingDay();
}

function dayRowHTML(day, idx, p, dayKey){
  const e = day.ex[idx];
  const final = e.c[0] === e.c[1] && e.c[1] > 1;
  const slotKey = slotKeyOf(day.n, idx);
  const chosen = chosenCanonFor(p.id, slotKey, e);
  const todayLift = todayLiftFor(p.id, day, idx);
  const done = ticksFor(p.id, day.n, todayKey()).includes(idx);
  const isBW = !!e.bw;

  let pillHTML, pbHTML = '';
  if (isBW){
    pillHTML = `<span class="pill" aria-hidden="true">BW</span>`;
    pbHTML = `<span class="pbline blank">bodyweight</span>`;
  } else {
    const st = personStats(p.id, chosen);
    const pb = st && st.pb;
    const lastW = (st && st.last) ? st.last.weight : null;
    const displayW = todayLift ? todayLift.weight : (lastW != null ? lastW : null);
    const logged = !!todayLift;
    pillHTML = `
      <button class="pill ${logged?'logged':(displayW!=null?'has':'')}" data-i="${idx}" aria-label="Log weight for ${esc(e.name)}">
        ${displayW != null ? wFmt(displayW) : '—'}<span class="u">${UNIT}</span>
      </button>`;
    if (pb){
      const pbDate = fmtGB(pb.date, true);
      pbHTML = `<span class="pbline">PB <b>${wFmt(pb.weight)}</b> · ${esc(pbDate)}</span>`;
    } else {
      pbHTML = `<span class="pbline blank">no PB yet</span>`;
    }
  }

  const doing = e.opts ? (() => {
    const c = e.opts.find(o=>o.id===chosen);
    return c && c.id !== e.opts[0].id ? ` <span class="choice" style="color:${personDotColor(p.id)}">→ ${esc(c.name)}</span>` : '';
  })() : '';

  return `<li class="ex ${done?'done':''}" data-i="${idx}" role="button" tabindex="0"
      aria-label="${esc(e.name)}, ${esc(e.sets)}. Tap to log." aria-pressed="${done}">
    <span class="num"><span class="n">${String(idx+1).padStart(2,'0')}</span><span class="tk">✓</span></span>
    <span class="mid">
      <span class="name">${esc(e.name)}</span>
      <span class="meta">${esc(e.muscle)}
        <span class="count${final?' final':''}">${e.c[0]}/${e.c[1]}</span>${
          e.also ? ` <span class="also">· also ${esc(e.also)}</span>` : ''}${doing}</span>
      <span class="restline">${REST[e.type]}</span>
    </span>
    <span class="side">
      <span class="prescribe">${esc(e.sets)}</span>
      ${pillHTML}
      ${pbHTML}
    </span>
  </li>`;
}

function todayLiftFor(pid, day, idx){
  const slot = day.ex[idx];
  const slotKey = slotKeyOf(day.n, idx);
  const canon = chosenCanonFor(pid, slotKey, slot);
  if (slot.bw) return null;
  const d = todayKey();
  const e = logOf(pid).lifts['l:' + pid + ':' + canon + ':' + d];
  return e || null;
}

function renderSession(){
  setPersonAccent();

  const day = currentDay();

  const isToday = day.dow === todayDow;
  const dateStr = new Date().toLocaleDateString('en-GB', {weekday:'long',day:'numeric',month:'long'}).toUpperCase();

  let eyebrow, rest = '';
  if (isToday){
    eyebrow = `<span class="live">● TODAY</span> &nbsp;${esc(dateStr)}`;
  } else {
    const FULL = { MON:'MONDAY', WED:'WEDNESDAY', FRI:'FRIDAY' };
    eyebrow = `${FULL[day.label] || (day.label + 'DAY')} SESSION`;
    const scheduled = DAYS.some(d => d.dow === todayDow);
    if (!scheduled){
      const next = DAYS.find(d => d.dow > todayDow) || DAYS[0];
      const gap = ((next.dow - todayDow) + 7) % 7;
      rest = `<div class="restnote">No session today — it's a rest day. Next up is
        <b>Day ${next.n}, ${next.title}</b>, ${gap === 1 ? 'tomorrow' : 'in ' + gap + ' days'}.
        Get your steps in.</div>`;
    }
  }

  const date = todayKey();
  const done = ticksFor(p.id, day.n, date);
  const rows = day.ex.map((e,i) => dayRowHTML(day, i, p, date)).join('');

  const prevScroll = window.scrollY;
  const lastKey = sessionKey;
  sessionKey = p.id + ':' + day.n;
  const scrollToTop = lastKey !== sessionKey;

  document.getElementById('app').innerHTML = `
    <div class="anim" id="sessionRoot">
      <div class="eyebrow"><span class="who">${esc(p.name)}</span> &nbsp;·&nbsp; ${eyebrow}</div>
      <h1>Day <span class="idx">${day.n}</span></h1>
      <div class="focus">${esc(day.title)}</div>
      <div class="stats">${day.ex.length} exercises &nbsp;·&nbsp; ${setCount(day)} working sets &nbsp;·&nbsp; ${day.mins}</div>
      ${rest}

      <div class="block">
        <div class="block-label">Warm-up · 5–8 min</div>
        <p>${esc(day.warmup)}</p>
      </div>

      <div class="block">
        <div class="block-label">The session</div>
        <div class="taphint">Tap an exercise to log your weight</div>
        <div class="progress">
          <div class="bar"><span id="barfill"></span></div>
          <div class="ptext" id="ptext"></div>
          <button class="reset" id="reset" hidden>Reset</button>
        </div>
        <ol id="list">${rows}</ol>
      </div>

      <div class="block">
        <div class="block-label">Finisher</div>
        <p>${esc(day.finisher)}</p>
      </div>

      <div class="block">
        <div class="block-label">Reference</div>
        ${REFERENCE}
      </div>

      <footer>
        Tap a weight pill to log what you lifted — it ticks the exercise off too.
        Below every pill is your <b style="color:var(--accent)">PB</b> for that lift.
        ${syncFooterHTML()}
        <br><br>
        General fitness plan for healthy adults. Swap exercises if the kit is taken,
        something hurts, or an old injury says no.
      </footer>
    </div>`;

  paintSession(day, p, date, done);

  const list = document.getElementById('list');
  list.addEventListener('click', ev => {
    const pill = ev.target.closest('.pill');
    const li = ev.target.closest('li.ex');
    if (li && pill) ev.stopPropagation();
    if (li) openLogSheet(+li.dataset.i);
  });
  list.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const li = ev.target.closest('li.ex');
    if (li){ ev.preventDefault(); openLogSheet(+li.dataset.i); }
  });
  document.getElementById('reset').addEventListener('click', () => {
    if (!done.length) return;
    if (!confirm(`Clear ${p.name}'s ticks for today? (Lift logs are kept.)`)) return;
    setTicks(day.n, date, []);
  });
  bindSyncButtons();
  if (scrollToTop) window.scrollTo(0,0);
  else window.scrollTo(0, prevScroll);
}

function paintSession(day, p, date, done){
  const total = day.ex.length;
  const n = done.length;
  document.querySelectorAll('#list li.ex').forEach(li => {
    const on = done.includes(+li.dataset.i);
    li.classList.toggle('done', on);
    li.setAttribute('aria-pressed', String(on));
  });
  const fill = document.getElementById('barfill');
  const txt  = document.getElementById('ptext');
  const rst  = document.getElementById('reset');
  if (!fill) return;
  fill.style.width = (n / total * 100) + '%';
  txt.textContent = n === total ? 'SESSION DONE' : `${n}/${total} DONE`;
  txt.classList.toggle('complete', n === total);
  rst.hidden = n === 0;
}

function setTicks(dow, date, items){
  const p = me();
  const t = logOf(p.id).ticks;
  const k = tickKey(dow, date);
  // always store (even empty) so a cleared day propagates through sync
  t[k] = { items:items.slice(), ts:now() };
  saveLog(p.id, true);
  render();
}

function toggleTick(dow, date, idx){
  const p = me();
  const cur = ticksFor(p.id, dow, date);
  const next = cur.includes(idx) ? cur.filter(x => x !== idx) : cur.concat([idx]).sort((a,b)=>a-b);
  setTicks(dow, date, next);
}

      ${lift ? `Logged today at <b style="color:var(--chalk)">${wFmt(lift.weight)} ${UNIT}</b>${lift.reps ? ' · ' + lift.reps.join('/') + ' reps' : ''} — updating replaces it.`
        : doneNow ? 'This exercise is ticked today without a weight.' : 'Tap Log to record the weight, or Done to just tick it.'}
    </p>`;

  const title = `${esc(slot.name)}`;
  const sub = `${esc(p.name)} · ${isBW ? 'bodyweight' : esc(slot.sets)}`;
  openOverlay(overlayShell(title, sub, body, {center:true}));
  bindOverlayClicks();
  document.querySelectorAll('#overlayroot [data-close]').forEach(b => b.addEventListener('click', closeOverlay));

  const root = document.getElementById('ov');
  root.style.setProperty('--pc', colorVar);

  let curLift = lift, curLast = last, curPb = pb;
  const autoVal = () => curLift ? wFmt(curLift.weight) : (curLast ? wFmt(curLast.weight) : '');
  let autoRef = autoVal();

  // Update the identity-dependent parts in place — no full sheet rebuild,
  // so switching between e.g. Goblet Squat and Hack Squat is instant.
  const refreshIdentity = () => {
    const lr = document.getElementById('lastrow');
    if (lr) lr.innerHTML = lastHintHTML(curLast, curPb, curLift, isBW);
    const note = document.getElementById('note');
    if (note){
      note.innerHTML = curLift
        ? `Logged today at <b style="color:var(--chalk)">${wFmt(curLift.weight)} ${UNIT}</b>${curLift.reps ? ' · ' + curLift.reps.join('/') + ' reps' : ''} — updating replaces it.`
        : (doneNow ? 'This exercise is ticked today without a weight.' : 'Tap Log to record the weight, or Done to just tick it.');
    }
    const lb = root.querySelector('[data-last]');
    if (lb && !isBW){
      lb.dataset.has = curLast ? '1' : '';
      lb.textContent = curLast ? `last ${wFmt(curLast.weight)}` : '';
      lb.style.display = curLast ? '' : 'none';
    }
    if (!isBW) updateSaveBtn();
  };

  if (slot.opts){
    root.querySelectorAll('[data-choices] button').forEach(b => b.addEventListener('click', () => {
      S.lastChoice[p.id] = S.lastChoice[p.id] || {};
      S.lastChoice[p.id][slotKey] = b.dataset.c;
      saveSettings();
      const c = b.dataset.c;
      root.querySelectorAll('[data-choices] button').forEach(x =>
        x.setAttribute('aria-pressed', String(x.dataset.c === c)));
      const wi = document.getElementById('winput');
      if (wi && !isBW){
        const typed = wi.value.trim();
        // only overwrite the pre-fill if the user hasn't typed their own number
        if (!typed || typed === autoRef) wi.value = '';
      }
      curLift = logOf(p.id).lifts['l:' + p.id + ':' + c + ':' + date] || null;
      const st2 = personStats(p.id, c);
      curLast = st2 ? st2.last : null;
      curPb = st2 ? st2.pb : null;
      autoRef = autoVal();
      const wi2 = document.getElementById('winput');
      if (wi2 && !isBW && !wi2.value.trim()) wi2.value = autoRef;
      refreshIdentity();
    }));
  }

  if (!isBW){
    const inp = document.getElementById('winput');
    inp.addEventListener('input', () => updateSaveBtn());
    root.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
      const cur = parseFloat(inp.value);
      const v = (isFinite(cur) ? cur : 0) + parseFloat(b.dataset.add);
      inp.value = v > 0 ? wFmt(v) : '';
      updateSaveBtn();
    }));
    const lastBtn = root.querySelector('[data-last]');
    if (lastBtn) lastBtn.addEventListener('click', () => { inp.value = curLast ? wFmt(curLast.weight) : ''; updateSaveBtn(); });
    document.getElementById('repstoggle').addEventListener('click', () => {
      const rows = document.querySelector('#repsblock .setrows');
      const showing = rows.style.display !== 'none';
      rows.style.display = showing ? 'none' : '';
      document.getElementById('repstoggle').textContent = showing ? 'edit' : 'hide';
    });
    root.querySelectorAll('.setstepper button').forEach(b => b.addEventListener('click', () => {
      const step = +b.dataset.d;
      const input = b.parentElement.querySelector('input');
      let v = parseInt(input.value,10) || 0;
      v = Math.max(0, Math.min(60, v + step));
      input.value = v;
    }));
    updateSaveBtn();
  }

  const tickbtn = document.getElementById('tickbtn');
  if (tickbtn) tickbtn.addEventListener('click', () => {
    toggleTick(day.n, date, idx);          // toggles both ways for tick-only rows
    closeOverlay();
    toast(doneNow ? 'Unticked' : 'Ticked off — no weight logged', colorVar);
  });
  if (!isBW){
    document.getElementById('savebtn').addEventListener('click', () => saveLogSheet(idx));
  }

  function updateSaveBtn(){
    const el = document.getElementById('winput');
    const b = document.getElementById('savebtn');
    if (!el || !b) return;
    const w = parseFloat(el.value);
    const base = lift ? 'Update to' : 'Log';
    const wTxt = isFinite(w) && w > 0 ? `${wFmt(w)} ${UNIT}` : UNIT;
    b.innerHTML = `${base} ${wTxt}<span class="sub">${lift ? 'saves &amp; keeps it ticked' : 'saves &amp; ticks it off'}</span>`;
    b.classList.toggle('can', isFinite(w) && w > 0);
    if (b.classList.contains('can')) b.style.opacity = 1; else b.style.opacity = .45;
  }
}

function repRowsHTML(lift, presc){
  const sets = presc ? presc.sets : 3;
  const max = presc ? presc.max : 12;
  const cur = lift && lift.reps ? lift.reps : Array(sets).fill(max);
  let rows = '';
  for (let i=0;i<sets;i++){
    rows += `<div class="setrow"><span class="s">Set ${i+1}</span>
      <div class="setstepper"><button data-d="-1" aria-label="fewer reps">−</button>
      <input type="text" inputmode="numeric" value="${cur[i]}" aria-label="Reps in set ${i+1}">
      <button data-d="1" aria-label="more reps">+</button></div></div>`;
  }
  return `<div class="setrows" ${lift && lift.reps ? '' : 'style="display:none"'} data-open="${lift && lift.reps ? '1':'0'}">${rows}</div>`;
}

function lastHintHTML(last, pb, lift, isBW){
  if (isBW) return 'Nothing to weigh — just tick it off when your sets are done.';
  let parts = [];
  if (last){
    const repTxt = last.reps ? last.reps.map(r => r || '·').join('·') : 'target';
    parts.push(`Last: <b>${wFmt(last.weight)} ${UNIT}</b>${last.reps ? ' · ' + repTxt : ''} <span style="opacity:.6">· ${fmtGB(last.date)}</span>`);
  } else {
    parts.push('No weight logged for this lift yet — start it off!');
  }
  if (pb){
    parts.push(`PB: <b style="color:var(--pc)">${wFmt(pb.weight)} ${UNIT}</b> <span style="opacity:.6">· ${fmtGB(pb.date,true)}</span>`);
  }
  const beat = last && pb && lift && lift.weight > pb.weight;
  const cls = beat ? 'pb-new' : '';
  return `<div class="${cls}">${parts.join('<br>')}</div>`;
}

function saveLogSheet(idx){
  const p = me();
  const day = currentDay();
  const slot = day.ex[idx];
  const slotKey = slotKeyOf(day.n, idx);
  const date = todayKey();
  let canon = chosenCanonFor(p.id, slotKey, slot);
  if (slot.opts){
    const pressed = document.querySelector('#ov [data-choices] button[aria-pressed="true"]');
    if (pressed && slot.opts.some(o => o.id === pressed.dataset.c)) canon = pressed.dataset.c;
  }
  const opt = slot.opts ? slot.opts.find(o => o.id === canon) : null;
  const label = opt ? opt.name : slot.name;
  const w = parseFloat(document.getElementById('winput').value);
  if (!isFinite(w) || w <= 0 || w > MAXW){ toast('Enter a valid weight first'); return; }

  // optional reps
  let reps = null;
  const rows = document.querySelectorAll('#repsblock .setstepper input');
  if (rows.length){
    const vals = [...rows].map(r => parseInt(r.value,10) || 0);
    reps = vals;
  }

  const oldPb = personStats(p.id, canon);
  const eid = 'l:' + p.id + ':' + canon + ':' + date;
  const entry = {
    id:eid, kind:'lift', pid:p.id, ex:canon, name:label,
    date, weight:w, reps, ts:now(),
    day: day.n
  };
  logOf(p.id).lifts[eid] = entry;
  saveLog(p.id, true);

  // tick it off
  const done = ticksFor(p.id, day.n, date);
  if (!done.includes(idx)){
    const t = logOf(p.id).ticks;
    t[tickKey(day.n, date)] = { items:done.concat([idx]).sort((a,b)=>a-b), ts:now() };
  }
  saveLog(p.id, true);

  closeOverlay();

  const isNewPb = !(oldPb && oldPb.pb && oldPb.pb.weight >= w);
  toast(isNewPb
    ? `🏆 NEW PB — ${wFmt(w)} ${UNIT} on ${esc(label)}`
    : `Logged ${wFmt(w)} ${UNIT} · ${esc(label)}`, personDotColor(p.id));
  render();
}

function renderProgress(){
  setPersonAccent();
  const p = me();
  const lifts = liftsOf(p.id);
  const date = todayKey();

  // aggregate by canon
  const map = new Map();
  for (const e of lifts){
    if (!map.has(e.ex)) map.set(e.ex, { ex:e.ex, name:CANON_LABEL[e.ex] || e.name, entries:[] });
    map.get(e.ex).entries.push(e);
  }
  const groups = [];
  for (const [ex, g] of map){
    g.entries.sort((a,b)=>a.ts-b.ts);
    let pb = null;
    for (const e of g.entries) if (!pb || e.weight > pb.weight) pb = e;
    g.pb = pb;
    g.muscle = muscleFor(ex);
    groups.push(g);
  }
  groups.sort((a,b) => (b.pb.weight - a.pb.weight));

  let body = `
    <div class="eyebrow"><span class="who">${esc(p.name)}</span> &nbsp;·&nbsp; PROGRESS</div>
    <h1 class="small">Lift <span class="idx" style="color:${personDotColor(p.id)}">history</span></h1>
    <div class="sumline">
      <div class="statcard"><span class="v" style="color:${personDotColor(p.id)}">${groups.length}</span><span class="k">lifts logged</span></div>
      <div class="statcard"><span class="v" style="color:${personDotColor(p.id)}">${groups.filter(g=>g.entries.length>=2).length}</span><span class="k">with a trend</span></div>
      <div class="statcard"><span class="v" style="color:${personDotColor(p.id)}">${liftCount(lifts)}</span><span class="k">total sessions</span></div>
    </div>`;

  if (!groups.length){
    body += `<div class="empty">Nothing logged yet.<br>Tap an exercise in the SESSION tab and enter a weight.<br>Your PBs and history build up here.</div>`;
  } else {
    for (const g of groups){
      const repsTxt = g.pb.reps ? g.pb.reps.map(r=>r||'·').join('·') : '';
      body += `
      <div class="block" style="margin-top:22px">
        <div class="pr-row" data-ex="${g.ex}">
          <span class="rn"><span class="nm">${esc(g.name)}</span>
            <span class="mus">${esc(g.muscle)}${g.pb.reps ? ' · ' + esc(g.pb.reps.length) + ' sets logged' : ''}</span></span>
          <span class="spark">${sparkSVG(g.entries.map(e=>e.weight))}</span>
          <span class="pbv"><span class="w">${wFmt(g.pb.weight)}</span>
            <span class="d">PB · ${fmtGB(g.pb.date)}</span></span>
        </div>
      </div>`;
    }
  }
  body += `<p style="margin-top:20px;font-size:13px;color:var(--muted);line-height:1.6;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em">
    PB = the heaviest weight you've logged for that lift, with the date you first hit it.
    Tap a row to see every session.</p>
    <div style="margin-top:26px;border-top:1px solid var(--line);padding-top:14px">
      ${syncFooterHTML()}
    </div>`;

  document.getElementById('app').innerHTML = `<div class="anim">${body}</div>`;
  document.querySelectorAll('.pr-row').forEach(r => r.addEventListener('click', () => openHistory(r.dataset.ex)));
  bindSyncButtons();
  window.scrollTo(0,0);
  // pull fresh updates from the other phone whenever Progress opens
  if (syncConfigured() && S.sync.pin && !syncInFlight) doSync(false);
}
function muscleFor(ex){
  for (const d of DAYS) for (const e of d.ex) if (e.canon === ex || (e.opts && e.opts.some(o=>o.id===ex))) return e.muscle;
  return '';
}
function liftCount(lifts){
  const days = new Set(lifts.map(e => e.date));
  return days.size;
}
function sparkSVG(weights){
  if (weights.length < 2) return '<span class="spark" style="display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);letter-spacing:.05em;font-family:\'IBM Plex Mono\',monospace">soon</span>';
  const w = 74, h = 28, p = 3;
  const mn = Math.min(...weights), mx = Math.max(...weights);
  const rng = (mx - mn) || 1;
  const pts = weights.map((v,i) => {
    const x = p + (i/(weights.length-1))*(w-2*p);
    const y = h - p - ((v - mn)/rng)*(h-2*p);
    return [x,y];
  });
  const line = pts.map(pt => pt.map(v=>v.toFixed(1)).join(',')).join(' ');
  const last = pts[pts.length-1];
  const first = pts[0];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${first[0].toFixed(1)},${h-p} ${line}" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--accent)" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.4" fill="var(--accent)"/>
  </svg>`;
}

function openHistory(ex){
  const p = me();
  const colorVar = personDotColor(p.id);
  const entries = liftsByCanon(p.id, ex).sort((a,b)=>a.ts-b.ts);
  let pb = null;
  for (const e of entries) if (!pb || e.weight > pb.weight) pb = e;
  const name = CANON_LABEL[ex] || (entries.length ? entries[0].name : ex);

  let hist = entries.slice().reverse().map(e => {
    const isPb = pb && e.weight === pb.weight && e.ts === pb.ts;
    const repTxt = e.reps ? e.reps.map(r=>r||'·').join(' · ') : '';
    return `<div class="hist-item">
      <div class="hrow">
        <span class="hdate">${fmtGB(e.date, true)}</span>
        <span class="hw ${isPb?'pb-mark':''}">${wFmt(e.weight)} ${UNIT} ${isPb?'<span class="tag">· PB</span>':''}</span>
      </div>
      ${repTxt ? `<div class="hreps">${repTxt} reps</div>` : '<div class="hreps">target reps (not entered)</div>'}
    </div>`;
  }).join('');

  const body = `
    <div class="modal-sec" style="margin-top:10px">
      <div class="sumline" style="margin-top:0">
        <div class="statcard"><span class="v" style="color:${colorVar}">${pb ? wFmt(pb.weight) : '—'}</span><span class="k">PB ${UNIT} · ${pb ? fmtGB(pb.date,true) : ''}</span></div>
        <div class="statcard"><span class="v" style="color:${colorVar}">${entries.length}</span><span class="k">sessions</span></div>
        <div class="statcard"><span class="v" style="color:${colorVar}">${entries.reduce((s,e)=>s+(e.reps?e.reps.reduce((a,b)=>a+(b||0),0):0),0)}</span><span class="k">total reps</span></div>
      </div>
      ${entries.length >= 2 ? `<div style="margin-top:16px;text-align:center">${sparkSVG(entries.map(e=>e.weight)).replace('<span class="spark"','<span class="spark" style="width:100%;height:46px"')}</div>` : ''}
    </div>
    <div class="modal-sec"><span class="lbl">Every logged session</span>${hist || '<div class="empty">Nothing yet.</div>'}</div>`;

  openOverlay(overlayShell(`${esc(name)} — ${esc(p.name)}`, `PB &amp; full history · ${UNIT}`, body, {full:false, center:false}));
  bindOverlayClicks();
}

/* ============================================================
   Timer tab
   ============================================================ */
const Timer = { total:0, left:0, raf:null, end:0, running:false, preset:null };
let audioCtx = null;
function beep(){
  try {
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.3, audioCtx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + .5);
    o.start(); o.stop(audioCtx.currentTime + .55);
  } catch(e){}
}
const timerLeft = () => Math.max(0, Math.round((Timer.end - now())/1000));
const timerLabel = () => {
  if (Timer.running) return 'Pause';
  if (Timer.total > 0 && Timer.left < Timer.total) return 'Resume'; // paused mid-countdown
  return 'Start';
};
function renderTimer(){
  setPersonAccent();
  const total = Timer.total, left = Math.max(0, Math.round(Timer.running ? (Timer.end - now())/1000 : Timer.left));
  const pct = total ? (1 - left/total)*100 : 0;
  const mm = String(Math.floor(left/60)).padStart(2,'0'), ss = String(left%60).padStart(2,'0');
  const hasPreset = !!Timer.preset;
  document.getElementById('app').innerHTML = `
    <div class="anim">
      <div class="eyebrow">REST <span class="live">TIMER</span></div>
      <h1 class="small">Between <span class="idx">sets</span></h1>
      <div class="timer-card">
        <div class="tring" id="tring"><span class="tdisp" id="tdisp">${mm}:${ss}<span class="unit">sec</span></span></div>
        <div class="tctl">
          <button class="cta ${Timer.running?'ghost':'primary'}" id="tstart">${timerLabel()}</button>
          <button class="cta ghost" id="treset" ${total?'':'disabled'}>Reset</button>
        </div>
        <div class="tpresets" id="tpresets">
          <button class="tpreset" data-s="105" aria-pressed="${hasPreset && Timer.preset===105}">Compound 1:45</button>
          <button class="tpreset" data-s="60"  aria-pressed="${hasPreset && Timer.preset===60}">Isolation 1:00</button>
          <button class="tpreset" data-s="45"  aria-pressed="${hasPreset && Timer.preset===45}">Core 0:45</button>
        </div>
        <div class="tend-note" id="tendnote"></div>
        <p style="margin-top:22px;font-size:13px;color:var(--muted);line-height:1.6">Presets match the plan: compounds 90–120s, isolation 45–75s, core 30–60s. The timer pings when it's time to lift again.</p>
      </div>
    </div>`;
  const ring = document.getElementById('tring');
  ring.style.background = `conic-gradient(var(--accent) ${pct*3.6}deg, var(--line) 0deg)`;
  document.getElementById('tstart').addEventListener('click', toggleTimer);
  document.getElementById('treset').addEventListener('click', () => {
    Timer.running = false; cancelAnimationFrame(Timer.raf);
    Timer.total = 0; Timer.left = 0; Timer.preset = null;
    renderTimer();
  });
  document.querySelectorAll('.tpreset').forEach(b => b.addEventListener('click', () => {
    const s = +b.dataset.s;
    Timer.running = false; cancelAnimationFrame(Timer.raf);
    Timer.total = s; Timer.left = s; Timer.preset = s;
    renderTimer();
    beep();
  }));
  document.getElementById('tendnote').innerHTML = '';
}
function toggleTimer(){
  if (Timer.running){
    // pause — in place, no screen rebuild
    Timer.running = false;
    cancelAnimationFrame(Timer.raf);
    Timer.left = timerLeft();
    const btn = document.getElementById('tstart');
    if (btn) btn.textContent = 'Resume';
    paintTimer();
    return;
  }
  if (!Timer.total){
    // Start with no preset picked → default to compound
    Timer.total = REST_MIN.compound; Timer.left = Timer.total; Timer.preset = REST_MIN.compound;
    renderTimer();
    return;
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  Timer.end = now() + Timer.left*1000;
  Timer.running = true;
  const btn = document.getElementById('tstart');
  if (btn) btn.textContent = 'Pause';
  tickTimer();
}
function paintTimer(){
  const left = Math.max(0, Math.round(Timer.running ? (Timer.end - now())/1000 : Timer.left));
  const d = document.getElementById('tdisp');
  const ring = document.getElementById('tring');
  if (!d) return;
  const mm = String(Math.floor(left/60)).padStart(2,'0'), ss = String(left%60).padStart(2,'0');
  d.innerHTML = `${mm}:${ss}<span class="unit">sec</span>`;
  if (ring){
    const pct = Timer.total ? (1 - left/Timer.total)*100 : 0;
    ring.style.background = `conic-gradient(var(--accent) ${pct*3.6}deg, var(--line) 0deg)`;
  }
}
function tickTimer(){
  if (!Timer.running) return;
  const left = timerLeft();
  Timer.left = left;
  const d = document.getElementById('tdisp');
  const ring = document.getElementById('tring');
  if (d && ring){
    const mm = String(Math.floor(left/60)).padStart(2,'0'), ss = String(left%60).padStart(2,'0');
    d.innerHTML = `${mm}:${ss}<span class="unit">sec</span>`;
    const pct = Timer.total ? (1 - left/Timer.total)*100 : 0;
    ring.style.background = `conic-gradient(var(--accent) ${pct*3.6}deg, var(--line) 0deg)`;
  }
  if (left <= 0){
    Timer.running = false;
    beep(); setTimeout(beep, 500); setTimeout(beep, 1000);
    try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
    const n = document.getElementById('tendnote');
    if (n) n.innerHTML = `<b>Time's up</b> — rest over, next set when you're ready.`;
    const b = document.getElementById('tstart');
    if (b) b.textContent = 'Start';
    if (d) d.innerHTML = `00:00<span class="unit">sec</span>`;
    Timer.left = Timer.total; // pressing Start runs a fresh full rest
    return;
  }
  Timer.raf = requestAnimationFrame(tickTimer);
}

  } else {
    const st = S.sync.lastSync ? new Date(S.sync.lastSync).toLocaleString('en-GB') : 'never';
    const err = S.sync.lastErr ? `<div class="sv" style="color:var(--d3);margin-top:6px">${esc(S.sync.lastErr)}</div>` : '';
    const neverConnected = !S.sync.lastSync;
    syncHTML = `
      <div class="set-row">
        <span class="sk">Phone-to-phone sync</span>
        <div style="margin-top:8px" class="sync-status">
          <span class="dotlive ${S.sync.busy?'busy':(S.sync.lastErr?'err':(S.sync.lastSync?'ok':''))}"></span>
          ${S.sync.busy ? 'Syncing…' : (S.sync.lastErr ? 'Last sync failed' : (S.sync.lastSync ? 'Last synced ' + esc(st) : 'Never synced yet'))}
        </div>
        ${err}
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          ${neverConnected ? `<button class="mini-btn accent" data-act="reconnect">Reconnect (enter the shared PIN)</button>` : `<button class="mini-btn accent" data-act="syncnow">Sync now</button>`}
          <button class="mini-btn" data-act="unsync">Disconnect this phone</button>
        </div>
        <div class="sv" style="margin-top:12px;font-size:12.5px;line-height:1.6">Both phones use the same PIN. If you forget it, each phone keeps its own copy — use Export below as a backup.</div>
      </div>`;
  }
  const whoRows = S.people.map((pp,i) => `
    <div class="set-row">
      <span class="sk"><span class="dot" style="background:${personDotColor(pp.id)}"></span>${esc(pp.name)}</span>
      <div class="name-edit">
        <input data-name="${pp.id}" value="${esc(pp.name)}" maxlength="14" aria-label="Name for ${esc(pp.name)}">
        <button class="mini-btn accent" data-savename="${pp.id}">Save</button>
      </div>
      <div class="sv" style="margin-top:8px;font-size:12px">This phone opens as:
        <b style="color:var(--chalk)">${S.people.find(x=>x.id===S.owner).name}</b> · owner setting below.</div>
    </div>`).join('');

  const body = `
    <div class="modal-sec" style="margin-top:8px">
      <span class="lbl">Who are you right now?</span>
      <div style="display:flex;gap:8px">${S.people.map(pp => `
        <button class="person" data-setp="${pp.id}" data-a="${S.people.indexOf(pp)}" style="--pc:${personDotColor(pp.id)}" aria-pressed="${pp.id===S.sel}">
          <span class="dot"></span>${esc(pp.name)}</button>`).join('')}
      </div>
    </div>
    <div class="modal-sec">
      <span class="lbl">This phone belongs to</span>
      <div style="display:flex;gap:8px">${S.people.map(pp => `
        <button class="person" data-owner="${pp.id}" data-a="${S.people.indexOf(pp)}" style="--pc:${personDotColor(pp.id)}" aria-pressed="${pp.id===S.owner}">
          <span class="dot"></span>${esc(pp.name)}</button>`).join('')}
      </div>
      <div class="sv" style="margin-top:9px;font-size:12.5px;color:var(--muted)">Used on first open and to keep your data with you. You can still switch who you are any time from the top bar.</div>
    </div>
    <div class="modal-sec"><span class="lbl">Names</span>${whoRows}</div>
    <div class="modal-sec"><span class="lbl">Sync</span>${syncHTML}</div>
    <div class="modal-sec">
      <span class="lbl">Data &amp; backup</span>
      <div class="set-row">
        <span class="sk">Export everything</span>
        <div class="sv">Download a full backup of both people's logs as a file. Do this every few weeks for peace of mind.</div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="mini-btn" data-act="expjson">Full backup (.json)</button>
          <button class="mini-btn" data-act="expcsv">Spreadsheet (.csv)</button>
        </div>
      </div>
      <div class="set-row">
        <span class="sk" style="color:var(--d3)">Danger zone</span>
        <div class="sv">Wipe <b>this phone's</b> local data only. It won't touch the other phone unless sync re-uploads it.</div>
        <div style="margin-top:10px"><button class="mini-btn" style="border-color:var(--d3);color:var(--d3)" data-act="wipe">Erase local data</button></div>
      </div>
    </div>
    <div class="modal-sec">
      <span class="lbl">About</span>
      <div class="sv" style="line-height:1.7">
        Weights in ${UNIT}. General fitness plan for healthy adults — swap exercises if the kit is taken,
        something hurts, or an old injury says no. Tick marks clear each day; your lift history is kept forever.
        ${SUPABASE.url && !SUPABASE_TABLE_SQL_OK ? 'Sync is switched on but the database tables have not been created yet — run the SQL in supabase.sql.' : ''}
      </div>
    </div>`;

  openOverlay(overlayShell('Settings', 'for this app', body, {full:false, center:false}));
  bindOverlayClicks();

  const root = document.getElementById('ov');
  root.querySelectorAll('[data-setp]').forEach(b => b.addEventListener('click', () => {
    S.sel = b.dataset.setp; saveSettings(); render();
    root.querySelectorAll('[data-setp]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.setp === S.sel)));
  }));
  root.querySelectorAll('[data-owner]').forEach(b => b.addEventListener('click', () => {
    S.owner = b.dataset.owner; saveSettings();
    root.querySelectorAll('[data-owner]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.owner === S.owner)));
  }));
  root.querySelectorAll('[data-savename]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.savename;
    const inp = root.querySelector(`[data-name="${id}"]`);
    const nm = inp.value.trim().slice(0,14);
    if (nm){
      const pp = S.people.find(x => x.id === id);
      pp.name = nm;
      saveSettings(); render(); openSettings();
    }
  }));
  root.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'connect') openSyncSetup();
    else if (a === 'reconnect'){
      S.sync.pin = ''; S.sync.room = ''; S.sync.lastErr = '';
      saveSettings();
      openSyncSetup();
    }
    else if (a === 'syncnow') doSync(true);
    else if (a === 'unsync'){
      if (!confirm('Disconnect this phone from sync? Its local data stays.')) return;
      S.sync = { pin:'', room:'', lastSync:0, lastErr:'', busy:false };
      saveSettings(); openSettings();
    }
    else if (a === 'expjson') exportData('json');
    else if (a === 'expcsv') exportData('csv');
    else if (a === 'wipe'){
      if (!confirm('Erase ALL data stored locally on this phone? This cannot be undone.')) return;
      if (!confirm('Are you absolutely sure?')) return;
      wipeLocal();
    }
  }));
}

function openSyncSetup(){
  const cfg = syncConfigured();
  if (!cfg){
    toast('Add your Supabase keys first — see SETUP.md');
    return;
  }
  const colorVar = personDotColor(me().id);
  const body = `
    <p style="font-size:15px;line-height:1.65;color:var(--muted)">One shared PIN connects both phones. Enter the <b style="color:var(--chalk)">same PIN</b> on Danny's and Kieran's phones — pick something you'll both remember (at least 4 characters, more is safer).</p>
    <div class="modal-sec">
      <div class="winput-wrap">
        <input class="winput" id="pin" type="password" inputmode="text" autocomplete="off" style="font-size:34px;max-width:200px" placeholder="····" aria-label="Shared sync PIN">
      </div>
    </div>
    <div class="cta-row">
      <button class="cta primary" id="pinok" style="--pc:${colorVar}">Connect</button>
      <button class="cta ghost" data-close>Cancel</button>
    </div>
    <p id="pinmsg" style="text-align:center;margin-top:14px;font-size:13px;color:var(--d3);display:none"></p>`;
  openOverlay(overlayShell('Connect phones', 'one PIN for both phones', body, {center:true}));
  bindOverlayClicks();
  const ok = document.getElementById('pinok');
  const pin = document.getElementById('pin');
  const msg = document.getElementById('pinmsg');
  const doPin = async () => {
    const v = pin.value.trim();
    if (v.length < 4){ msg.textContent = 'PIN needs at least 4 characters.'; msg.style.display='block'; return; }
    ok.disabled = true; ok.textContent = 'Connecting…';
    msg.style.display = 'none';
    const secret = sha256('gym-pin:' + v.toLowerCase());
    S.sync.pin = v;
    S.sync.room = wireSecret(secret).slice(0,16);
    await saveSettings();
    const res = await doSync(true, secret);
    if (res && res.ok){
      toast('Phones connected ✦');
      closeOverlay();
      render();
    } else {
      ok.disabled = false; ok.textContent = 'Connect';
      msg.textContent = res && res.msg ? res.msg : 'Could not reach the sync store. Check your connection and the keys in SETUP.md.';
      msg.style.display='block';
    }
  };
  ok.addEventListener('click', doPin);
  pin.addEventListener('keydown', ev => { if (ev.key === 'Enter') doPin(); });
  setTimeout(() => pin.focus(), 80);
}

/* ---------- export / wipe ---------- */
function exportData(fmt){
  const stamp = todayKey();
  const all = {};
  for (const p of S.people) all[p.id] = logOf(p.id);
  let name, type, text;
  if (fmt === 'json'){
    name = `gym-backup-${stamp}.json`;
    type = 'application/json';
    text = JSON.stringify({ exported:new Date().toISOString(), unit:UNIT, people:S.people, data:all }, null, 2);
  } else {
    name = `gym-weights-${stamp}.csv`;
    type = 'text/csv';
    const rows = ['person,date,exercise,weight_kg,reps,note'];
    for (const p of S.people){
      for (const e of liftsOf(p.id)){
        rows.push([p.name, e.date, e.name || e.ex, e.weight, e.reps ? e.reps.join('/') : '', e.note || ''].map(v => '"'+String(v).replace(/"/g,'""')+'"').join(','));
      }
    }
    text = rows.join('\n');
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type}));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    toast('Backup downloaded');
  } catch(e){ toast('Export failed on this device'); }
}
function wipeLocal(){
  for (const k of Object.keys(localStorage)){
    if (k.startsWith('gym:') || /^session:/.test(k)) localStorage.removeItem(k);
  }
  if (window.storage){ /* best effort only for our own keys */
    try { Object.keys(mem).forEach(k => delete mem[k]); } catch(e){}
  }
  location.reload();
}

/* ============================================================
   Sync engine (Supabase)
   ============================================================ */
function syncConfigured(){
  return !!(SUPABASE.url && SUPABASE.anonKey && SUPABASE_TABLE_SQL_OK);
}
let syncTimer = null, syncInFlight = false;
function scheduleSync(){
  clearTimeout(syncTimer);
  if (!syncConfigured()) return;
  syncTimer = setTimeout(() => doSync(false), 2500);
}
/* the 64-char value sent to the database: derived from the PIN entirely
   in the browser so the store never needs a server-side hash function */
const wireSecret = secret => sha256('gym-store:' + secret);
async function doSync(manual, secretOverride){
  if (!syncConfigured()) return { ok:false, msg:'Sync not configured (see SETUP.md)' };
  if (syncInFlight) return { ok:true, silent:true };
  if (!secretOverride && !S.sync.pin) {
    // first time: prompt for the shared PIN
    if (manual) openSyncSetup();
    return { ok:false, silent:true };
  }
  syncInFlight = true;
  S.sync.busy = true;
  S.sync.lastErr = '';
  saveSettings();
  try {
    const secret = secretOverride || sha256('gym-pin:' + S.sync.pin.toLowerCase());
    const room = wireSecret(secret);
    // build payload: every local lift + tick across both people
    const rows = [];
    for (const p of S.people){
      for (const e of Object.values(logOf(p.id).lifts)) rows.push({ id:e.id, pid:p.id, ts:e.ts, data:e });
      for (const k of Object.keys(logOf(p.id).ticks)){
        const t = logOf(p.id).ticks[k];
        const [dow, date] = k.split(':');
        rows.push({ id:'t:' + p.id + ':' + dow + ':' + date, pid:p.id, ts:t.ts, data:{ kind:'tick', pid:p.id, dow:+dow, date, items:t.items, ts:t.ts } });
      }
    }
    const res = await fetch(SUPABASE.url.replace(/\/$/,'') + '/rest/v1/rpc/sync_state', {
      method:'POST',
      headers:{ 'apikey': SUPABASE.anonKey, 'Authorization':'Bearer ' + SUPABASE.anonKey, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_secret: secret, p_rows: rows, p_since: 0 })
    });
    if (!res.ok){
      let msg = 'Sync failed (' + res.status + ')';
      try {
        const j = await res.json();
        msg = (j.message || j.msg || msg);
        if (j.code === 'PGRST202' || /could not find the function/i.test(msg)){
          msg = 'Database setup isn\u2019t finished yet — open Supabase → SQL Editor and run supabase.sql once.';
        } else if (res.status === 401 || res.status === 403){
          msg = 'Sync store rejected the app key — check the URL/key in the SYNC CONFIG block.';
        }
      } catch(e){}
      throw new Error(msg);
    }
    const remote = await res.json();
    let changed = 0;
    for (const row of (remote || [])){
      const d = row.data || {};
      if (d.kind === 'tick'){
        const pid = d.pid, key = tickKey(d.dow, d.date);
        const t = logOf(pid).ticks[key];
        if (!t || d.ts > t.ts){
          logOf(pid).ticks[key] = { items:(d.items||[]).slice(), ts:d.ts };
          changed++;
        }
      } else if (d.id && d.ts){
        const pid = d.pid;
        const cur = logOf(pid).lifts[d.id];
        if (!cur || d.ts > cur.ts){
          logOf(pid).lifts[d.id] = d;
          changed++;
        }
      }
    }
    if (changed){
      for (const p of S.people) saveLog(p.id, true);
    }
    S.sync.lastSync = now();
    S.sync.lastErr = '';
    await saveSettings();
    render();
    return { ok:true };
  } catch(e){
    S.sync.lastErr = String(e && e.message ? e.message : e).slice(0,200);
    await saveSettings();
    render();
    return { ok:false, msg: S.sync.lastErr };
  } finally {
    syncInFlight = false;
    S.sync.busy = false;
    saveSettings();
  }
}

/* ============================================================
   Boot
   ============================================================ */
(async function boot(){
  await loadSettings();
  await loadLogs();
  await migrateLegacy();

  document.getElementById('switch').innerHTML = '';
  render();

  document.getElementById('gearbtn').addEventListener('click', openSettings);

  if (!S.onboarded){
    onboard();
  } else if (syncConfigured() && S.sync.pin){
    doSync(false);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && syncConfigured() && S.sync.pin) doSync(false);
  });
  window.addEventListener('focus', () => {
    if (syncConfigured() && S.sync.pin && !syncInFlight) doSync(false);
  });
  setInterval(() => {
    if (!document.hidden && syncConfigured() && S.sync.pin && !syncInFlight) doSync(false);
  }, 60000);
})();
</script>
