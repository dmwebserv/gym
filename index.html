    <div class="presc-line">
      <span>Set: <b>${esc(slot.sets)}</b></span>
      <span>Rest: <b>${REST[slot.type]}</b></span>
      ${slot.supersetWith != null ? `<span>Superset: <b>with #${slot.supersetWith + 1}</b></span>` : ''}
    </div>

    <div class="hint-row" id="lastrow">${lastHintHTML(last, pb, lift, isBW, p.id, chosen)}</div>

    ${isBW ? `
      <div class="modal-sec">
        <p style="font-size:15px;color:var(--chalk);opacity:.9;line-height:1.6">Nothing to weigh here — tap <b>Done</b> when you've finished your sets. Your pull-up ladder is at the bottom of the session.</p>
      </div>`
    : `
    <div class="modal-sec" id="wsec">
      <div class="winput-wrap">
        <input class="winput" id="winput" type="text" inputmode="decimal" autocomplete="off"
          value="${ref ? wFmt(ref.weight) : ''}"
          placeholder="—" aria-label="Weight in ${UNIT}">
        <span class="wunit">${unitHint}</span>
      </div>
      <div class="quickchips">
        <button class="qchip small" data-add="-2.5">−2.5</button>
        <button class="qchip" data-add="2.5">+2.5</button>
        <button class="qchip" data-add="5">+5</button>
        ${last ? `<button class="qchip small" data-last>last ${wFmt(last.weight)}</button>` : ''}
      </div>

      <div class="reps-block" id="repsblock">
        <div class="reps-title">
          <span>Reps · last set</span>
          <button class="toggle" id="repstoggle">log every set</button>
        </div>
        <div class="setrows" id="repsingle">
          <div class="setrow"><span class="s">Last set</span>
            <div class="setstepper">
              <button data-d="-1" aria-label="fewer reps">−</button>
              <input type="text" inputmode="numeric" value="${refReps != null ? refReps : ''}"
                placeholder="${presc ? presc.max : '—'}" aria-label="Reps in the last set">
              <button data-d="1" aria-label="more reps">+</button>
            </div>
          </div>
        </div>
        <div class="setrows" id="repsmulti" style="display:none">${multiRepRowsHTML(lift, presc)}</div>
        <div class="choicehint" id="rephint">Only the last set is saved — that's the one that counts.</div>
      </div>

      ${canBoth ? `
      <div class="reps-block" style="margin-top:18px">
        <div class="reps-title"><span>Who is this for?</span></div>
        <div class="choicechips" data-both>
          <button data-bothv="0" aria-pressed="true">Just ${esc(p.name)}</button>
          <button data-bothv="1" aria-pressed="false">${esc(p.name)} + ${esc(partner.name)}</button>
        </div>
        <div class="bothnote" id="bothnote" style="display:none">
          Saves the same weight and reps for both of you — each against their own exercise choice — and ticks it off for both.
        </div>
      </div>` : ''}
    </div>`}

    <div class="cta-row" style="margin-top:18px">
      <button class="cta ghost" id="subsbtn">Machine taken?</button>
      ${slot.supersetWith != null ? '<button class="cta ghost" id="ssbtn">Superset with #' + (slot.supersetWith + 1) + '</button>' : ''}
    </div>

    <div class="cta-row">
      ${isBW
        ? `<button class="cta primary" id="tickbtn" style="--pc:${colorVar}">${doneNow ? 'Untick this exercise' : 'Tick it done'}<span class="sub">${slot.bw ? 'bodyweight — nothing to log' : 'no weight to log — tick when done'}</span></button>`
        : lift
          ? `<button class="cta primary" id="savebtn" style="--pc:${colorVar}">Update</button>
             <button class="cta ghost" data-close>Close</button>`
          : `<button class="cta primary" id="savebtn" style="--pc:${colorVar}">Log</button>
             <button class="cta ghost" id="tickbtn">${doneNow ? 'Untick' : 'Done without a weight'}</button>`}
    </div>
    <p id="note" style="text-align:center;margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.5">${noteText(lift, doneNow)}</p>`;

  openOverlay(overlayShell(`${esc(slot.name)}`, `${esc(p.name)} · ${isBW ? 'bodyweight' : esc(slot.sets)}`, body, {center:true}));
  bindOverlayClicks();

  const root = document.getElementById('ov');
  root.style.setProperty('--pc', colorVar);

  let curLift = lift, curLast = last, curPb = pb;
  let both = false;
  const autoVal = () => curLift ? wFmt(curLift.weight) : (curLast ? wFmt(curLast.weight) : '');
  let autoRef = autoVal();

  const multiOn = () => { const m = document.getElementById('repsmulti'); return !!m && m.style.display !== 'none'; };
  function singleRep(){
    const el = document.querySelector('#repsingle .setstepper input');
    return el ? parseRepInput(el.value) : null;
  }
  function lastEnteredRep(){
    const inputs = [...document.querySelectorAll('#repsmulti .setstepper input')];
    for (let i = inputs.length - 1; i >= 0; i--){ const v = parseRepInput(inputs[i].value); if (v) return v; }
    return null;
  }
  function updateSaveBtn(){
    const el = document.getElementById('winput');
    const b = document.getElementById('savebtn');
    if (!el || !b) return;
    const w = parseWeight(el.value);
    const r = multiOn() ? lastEnteredRep() : singleRep();
    const base = curLift ? 'Update to' : 'Log';
    const wTxt = w != null ? `${wFmt(w)} ${UNIT}` : UNIT;
    const sub = both
      ? `for ${esc(p.name)} + ${esc(partner.name)}`
      : (curLift ? 'saves &amp; keeps it ticked' : 'saves &amp; ticks it off');
    b.innerHTML = `${base} ${wTxt}${r ? ' × ' + r : ''}<span class="sub">${sub}</span>`;
    b.classList.toggle('can', w != null);
    b.style.opacity = w != null ? 1 : .45;
  }

  if (slot.opts){
    root.querySelectorAll('[data-choices] button').forEach(b => b.addEventListener('click', () => {
      if (slot.rotate) setRotatePick(p.id, slotKey, b.dataset.c);
      else { S.lastChoice[p.id] = S.lastChoice[p.id] || {}; S.lastChoice[p.id][slotKey] = b.dataset.c; saveSettings(); }
      if (isBWChoice(slot, b.dataset.c) !== isBW){ openLogSheet(idx); return; }
      const c = b.dataset.c;
      root.querySelectorAll('[data-choices] button').forEach(x =>
        x.setAttribute('aria-pressed', String(x.dataset.c === c)));
      const wi = document.getElementById('winput');
      const typedW = wi ? wi.value.trim() : '';
      const ri = document.querySelector('#repsingle .setstepper input');
      const typedR = ri ? String(ri.value).trim() : '';
      const repsWereAuto = ri ? (typedR === '' || typedR === String(refReps != null ? refReps : '')) : true;
      curLift = liveLift(p.id, c, date);
      const st2 = personStats(p.id, c);
      curLast = st2 ? st2.last : null;
      curPb = st2 ? st2.pb : null;
      autoRef = autoVal();
      if (wi && !isBW && (!typedW || typedW === autoRef)) wi.value = '';
      if (wi && !isBW && !wi.value.trim()) wi.value = autoRef;
      if (ri && repsWereAuto){
        const r2 = lastReps(curLift || curLast);
        ri.value = r2 != null ? r2 : '';
      }
      const lr = document.getElementById('lastrow');
      if (lr) lr.innerHTML = lastHintHTML(curLast, curPb, curLift, isBW, p.id, chosenCanonFor(p.id, slotKeyOf(day.n, idx), slot));
      const note = document.getElementById('note');
      if (note) note.innerHTML = noteText(curLift, doneNow);
      const lb = root.querySelector('[data-last]');
      if (lb){
        lb.textContent = curLast ? `last ${wFmt(curLast.weight)}` : '';
        lb.style.display = curLast ? '' : 'none';
      }
      if (!isBW) updateSaveBtn();
    }));
  }

  if (!isBW){
    const inp = document.getElementById('winput');
    inp.addEventListener('input', updateSaveBtn);
    root.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
      const cur = parseWeight(inp.value);
      const v = (cur != null ? cur : 0) + parseFloat(b.dataset.add);
      inp.value = v > 0 ? wFmt(v) : '';
      updateSaveBtn();
    }));
    const lastBtn = root.querySelector('[data-last]');
    if (lastBtn) lastBtn.addEventListener('click', () => {
      inp.value = curLast ? wFmt(curLast.weight) : '';
      updateSaveBtn();
    });

    /* one number by default, every set on request (the old way is still here) */
    document.getElementById('repstoggle').addEventListener('click', () => {
      const single = document.getElementById('repsingle');
      const multi = document.getElementById('repsmulti');
      const goingMulti = single.style.display !== 'none';
      single.style.display = goingMulti ? 'none' : '';
      multi.style.display = goingMulti ? '' : 'none';
      document.getElementById('repstoggle').textContent = goingMulti ? 'log one set' : 'log every set';
      document.getElementById('rephint').textContent = goingMulti
        ? 'Each set is saved as you enter it.'
        : "Only the last set is saved — that's the one that counts.";
      if (goingMulti){
        const v = singleRep();
        const inputs = [...multi.querySelectorAll('.setstepper input')];
        if (v) inputs.forEach(el => { if (!parseRepInput(el.value)) el.value = v; });
      } else {
        const el = single.querySelector('.setstepper input');
        const v = lastEnteredRep();
        if (el && v) el.value = v;
      }
      updateSaveBtn();
    });
    root.querySelectorAll('#repsingle .setstepper button, #repsmulti .setstepper button').forEach(b =>
      b.addEventListener('click', () => {
        const input = b.parentElement.querySelector('input');
        const step = +b.dataset.d;
        const cur = parseRepInput(input.value) || 0;
        const next = Math.max(0, Math.min(100, cur + step));
        input.value = next > 0 ? next : '';
        updateSaveBtn();
      }));
    root.querySelectorAll('#repsingle .setstepper input, #repsmulti .setstepper input').forEach(el =>
      el.addEventListener('input', updateSaveBtn));

    const rb = root.querySelector('[data-both]');
    if (rb) rb.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      both = b.dataset.bothv === '1';
      rb.querySelectorAll('button').forEach(x =>
        x.setAttribute('aria-pressed', String((x.dataset.bothv === '1') === both)));
      document.getElementById('bothnote').style.display = both ? 'block' : 'none';
      updateSaveBtn();
    }));

    updateSaveBtn();
  }

  const subsbtn = document.getElementById('subsbtn');
  if (subsbtn) subsbtn.addEventListener('click', () => { closeOverlay(); openSubsSheet(idx); });
  const ssbtn = document.getElementById('ssbtn');
  if (ssbtn) ssbtn.addEventListener('click', () => {
    const o = currentDay().ex[slot.supersetWith];
    toast(`Superset ${esc(CANON_LABEL[chosen] || slot.name)} with ${esc((o && o.name) || 'the next exercise')} — alternate them, rest at the end`);
  });
  const unsub = document.getElementById('unsub');
  if (unsub) unsub.addEventListener('click', () => {
    setSwap(p.id, day.n, date, idx, null);
    closeOverlay();
    toast('Back to ' + esc(slot.name));
    render();
  });

  const tickbtn = document.getElementById('tickbtn');
  if (tickbtn) tickbtn.addEventListener('click', () => {
    toggleTick(day.n, date, idx);          // toggles both ways for tick-only rows
    closeOverlay();
    toast(doneNow ? 'Unticked' : 'Ticked off — no weight logged', colorVar);
  });
  if (!isBW) document.getElementById('savebtn').addEventListener('click', () => saveLogSheet(idx, { both }));
}
function noteText(lift, doneNow){
  if (lift){
    const r = lastReps(lift);
    return `Logged today at <b style="color:var(--chalk)">${wFmt(lift.weight)} ${UNIT}${r ? ' × ' + r : ''}</b> — saving replaces it.`;
  }
  return doneNow ? 'This exercise is ticked today without a weight.' : 'Tap Log to record it, or Done to just tick it off.';
}

function multiRepRowsHTML(lift, presc){
  const sets = presc ? presc.sets : 3;
  const cur = (lift && Array.isArray(lift.reps)) ? lift.reps : [];
  let rows = '';
  for (let i=0;i<sets;i++){
    const v = (cur[i] != null && cur[i] > 0) ? cur[i] : '';
    rows += `<div class="setrow"><span class="s">Set ${i+1}</span>
      <div class="setstepper"><button data-d="-1" aria-label="fewer reps">−</button>
      <input type="text" inputmode="numeric" value="${v}" aria-label="Reps in set ${i+1}">
      <button data-d="1" aria-label="more reps">+</button></div></div>`;
  }
  return `<div class="setrows">${rows}</div>`;
}

function lastHintHTML(last, pb, lift, isBW, pid, canon){
  if (isBW) return 'Nothing to weigh — just tick it off when your sets are done.';
  let parts = [];
  if (last){
    const r = lastReps(last);
    parts.push(`Last: <b>${wFmt(last.weight)} ${UNIT}</b>${r ? ' × ' + r : ''} <span style="opacity:.6">· ${fmtGB(last.date)}</span>`);
  } else {
    parts.push('No weight logged for this lift yet — start it off!');
  }
  if (pb){
    const r = lastReps(pb);
    parts.push(`PB: <b style="color:var(--pc)">${wFmt(pb.weight)} ${UNIT}</b>${r ? ' × ' + r : ''} <span style="opacity:.6">· ${fmtGB(pb.date,true)}</span>`);
  }
  const beat = last && pb && lift && lift.weight > pb.weight;
  // X38 — the last three times, so you can pick your next weight without leaving the sheet
  const recent = (pid && canon)
    ? liftsOf(pid).filter(e => e.ex === canon).sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 3)
    : [];
  let history = '';
  if (recent.length){
    history = `<div class="l3">
      <span class="l3label">Last ${recent.length === 1 ? 'session' : recent.length + ' sessions'}</span>
      ${recent.map((e, i) => {
        const r = lastReps(e);
        const pbMark = pb && e.id === pb.id ? ' <span class="l3pb">PB</span>' : '';
        return `<span class="l3row${i === 0 ? ' now' : ''}">
          <span class="l3w">${wFmt(e.weight)}<span class="u">${UNIT}</span>${r ? `<span class="l3x">×${r}</span>` : ''}</span>
          <span class="l3d">${esc(fmtGB(e.date, true))}${pbMark}</span></span>`;
      }).join('')}
      ${recent.length > 1 && recent[0].weight === recent[1].weight && recent[1].weight === (recent[2] || {}).weight
        ? '<span class="l3same">Same weight three times — add a little, or add a rep.</span>' : ''}
    </div>`;
  }
  return `<div class="${beat ? 'pb-new' : ''}">${parts.join('<br>')}</div>${history}`;
}

/* Reads the sheet, guards against typos, then writes. */
function saveLogSheet(idx, opts){
  opts = opts || {};
  const p = me();
  const day = currentDay();
  const slot = day.ex[idx];
  const slotKey = slotKeyOf(day.n, idx);
  const multiIsOn = (() => { const m = document.getElementById('repsmulti'); return !!m && m.style.display !== 'none'; })();

  let w = opts.w, reps = opts.reps, repsMode = opts.repsMode;
  if (w == null){
    w = parseWeight(document.getElementById('winput').value);
    if (multiIsOn){
      const vals = [...document.querySelectorAll('#repsmulti .setstepper input')].map(r => parseRepInput(r.value));
      if (vals.some(v => v != null)){ reps = vals; repsMode = 'all'; }
    } else {
      const v = singleRepFromSheet();
      if (v){ reps = [v]; repsMode = 'last'; }
    }
  }
  if (w == null || w > MAXW){ toast('Enter a valid weight first'); return; }

  const targets = [p].concat(opts.both ? S.people.filter(x => x.id !== p.id) : []);

  if (!opts.confirmed){
    const risky = [];
    for (const t of targets){
      const tc = chosenCanonFor(t.id, slotKey, slot);
      const tst = personStats(t.id, tc);
      if (tst && tst.pb && w > tst.pb.weight * 2 && (w - tst.pb.weight) >= 10)
        risky.push({ name:t.name, pb:tst.pb });
    }
    if (risky.length){ confirmRiskyWeight(idx, { w, reps, repsMode, both: !!opts.both }, risky); return; }
  }
  writeLift(idx, targets, { w, reps, repsMode });
}
function singleRepFromSheet(){
  const el = document.querySelector('#repsingle .setstepper input');
  return el ? parseRepInput(el.value) : null;
}
function confirmRiskyWeight(idx, payload, risky){
  const slot = currentDay().ex[idx];
  const r = risky[0];
  const body = `
    <p style="font-size:15px;line-height:1.65;color:var(--chalk);opacity:.92">
      <b>${wFmt(payload.w)} ${UNIT}</b> is more than double ${risky.length > 1 ? 'a' : esc(r.name) + "'s"} PB for
      ${esc(slot.name)} (${wFmt(r.pb.weight)} ${UNIT}, ${fmtGB(r.pb.date, true)}).
    </p>
    <p style="font-size:14px;color:var(--muted);line-height:1.6;margin-top:10px">
      A weight like that is the one mistake that permanently distorts your PB and trend, so this is the last check before it saves.</p>
    <div class="cta-row">
      <button class="cta ghost" data-close>Go back</button>
      <button class="cta primary" id="riskyes">Yes, log it</button>
    </div>`;
  openOverlay(overlayShell('That looks heavy', 'double-check before it saves', body, {center:true}));
  bindOverlayClicks();
  document.getElementById('riskyes').addEventListener('click', () => {
    closeOverlay();
    saveLogSheet(idx, Object.assign({}, payload, { confirmed:true }));
  });
}

/* The single write path for a logged lift — used by the sheet, the typo-confirm
   and "log for both". Nothing here removes or rewrites anything that exists. */
function writeLift(idx, targets, payload){
  const day = currentDay();
  const slot = day.ex[idx];
  const slotKey = slotKeyOf(day.n, idx);
  const date = todayKey();
  const { w, repsMode } = payload;
  const reps = Array.isArray(payload.reps) ? payload.reps
             : (payload.reps == null ? null : [payload.reps]);
  const snap = snapshotBefore(targets.map(t => t.id));
  const before = {};
  for (const t of targets){
    before[t.id] = personStats(t.id, chosenCanonFor(t.id, slotKey, slot));
  }
  const labelFor = canon => labelForCanon(canon, slot);
  for (const t of targets){
    const canon = chosenCanonFor(t.id, slotKey, slot);
    const eid = 'l:' + t.id + ':' + canon + ':' + date;
    const entry = { id:eid, kind:'lift', pid:t.id, ex:canon, name:labelFor(canon), date,
                    weight:w, reps:reps ? reps.slice() : null, ts:now(), day: day.n };
    if (reps && repsMode) entry.repsMode = repsMode;
    logOf(t.id).lifts[eid] = entry;
    const done = ticksFor(t.id, day.n, date);
    if (!done.includes(idx)){
      logOf(t.id).ticks[tickKey(day.n, date)] = { items:done.concat([idx]).sort((a,b)=>a-b), ts:now() };
    }
    saveLog(t.id, true);
  }
  closeOverlay();
  registerUndo(snap);

  const main = targets[0];
  const mainCanon = chosenCanonFor(main.id, slotKey, slot);
  const r = lastReps({ reps });
  const pbNames = targets.filter(t => {
    const b = before[t.id];
    return !(b && b.pb && b.pb.weight >= w);
  }).map(t => t.name);

  let msg = `Logged ${wFmt(w)} ${UNIT}${r ? ' × ' + r : ''} · ${esc(labelFor(mainCanon))}`;
  if (targets.length > 1) msg += ' — both of you';
  if (pbNames.length) msg += ` 🏆 PB${pbNames.length > 1 ? ' for both' : ' for ' + esc(pbNames[0])}`;
  toast(msg, personDotColor(main.id), undoLast);
  // X158 — a real PB gets the moment it deserves, but only in the tab that did it
  if (pbNames.length){
    const pbList = targets.filter(t => pbNames.includes(t.name)).map(t => ({
      name:t.name, entry:{ weight:w, reps:reps || null }
    }));
    celebratePB(pbList);
  }
  render();
}

/* ---- edit / delete a past record ---- */
function openEditSheet(entryId){
  const p = me();
  const e = logOf(p.id).lifts[entryId];
  if (!e || isDeleted(e)){ toast('That record is no longer here'); return; }
  const colorVar = personDotColor(p.id);
  const r = lastReps(e);
  const body = `
    <div class="modal-sec" style="margin-top:6px">
      <span class="lbl">Weight</span>
      <div class="winput-wrap" style="margin-top:2px">
        <input class="winput" id="ewin" type="text" inputmode="decimal" value="${wFmt(e.weight)}" aria-label="Weight in ${UNIT}">
        <span class="wunit">${UNIT}</span>
      </div>
      <div class="quickchips">
        <button class="qchip small" data-add="-2.5">−2.5</button>
        <button class="qchip" data-add="2.5">+2.5</button>
        <button class="qchip" data-add="5">+5</button>
      </div>
    </div>
    <div class="modal-sec">
      <span class="lbl">Reps · last set</span>
      <div class="setrow"><span class="s">${repsModeOf(e) === 'last' ? 'Last set' : 'Last set (of ' + ((e.reps||[]).length || 1) + ' sets)'}</span>
        <div class="setstepper">
          <button data-rd="-1" aria-label="fewer reps">−</button>
          <input id="ewreps" type="text" inputmode="numeric" value="${r != null ? r : ''}" placeholder="—" aria-label="Reps in the last set">
          <button data-rd="1" aria-label="more reps">+</button>
        </div>
      </div>
    </div>
    <div class="modal-sec">
      <span class="lbl">Date</span>
      <div class="setrow"><span class="s">Logged</span>
        <input class="datein" id="ewdate" type="date" value="${esc(e.date)}" aria-label="Date logged"></div>
      <div class="choicehint">Changing the date moves the record and leaves a hidden marker on the old day, so the other phone follows.</div>
    </div>
    <div class="cta-row">
      <button class="cta primary" id="esave" style="--pc:${colorVar}">Save changes</button>
      <button class="cta ghost" data-close>Cancel</button>
    </div>
    <div class="cta-row" style="margin-top:10px">
      <button class="cta danger" id="edel">Delete this record</button>
    </div>`;
  openOverlay(overlayShell(`${esc(e.name || e.ex)}`, `edit a past record · ${esc(p.name)}`, body, {center:true}));
  bindOverlayClicks();
  const root = document.getElementById('ov');
  root.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    const inp = document.getElementById('ewin');
    const cur = parseWeight(inp.value);
    const v = (cur != null ? cur : 0) + parseFloat(b.dataset.add);
    inp.value = v > 0 ? wFmt(v) : '';
  }));
  root.querySelectorAll('[data-rd]').forEach(b => b.addEventListener('click', () => {
    const input = document.getElementById('ewreps');
    const cur = parseRepInput(input.value) || 0;
    const next = Math.max(0, Math.min(100, cur + (+b.dataset.rd)));
    input.value = next > 0 ? next : '';
  }));
  document.getElementById('esave').addEventListener('click', () => saveEdit(entryId));
  document.getElementById('edel').addEventListener('click', () => deleteRecord(entryId));
}
function saveEdit(entryId){
  const p = me();
  const e = logOf(p.id).lifts[entryId];
  if (!e) return;
  const w = parseWeight(document.getElementById('ewin').value);
  const rv = parseRepInput(document.getElementById('ewreps').value);
  const newDate = document.getElementById('ewdate').value || e.date;
  if (w == null || w > MAXW){ toast('Enter a valid weight first'); return; }
  const snap = snapshotBefore([p.id]);
  const entry = Object.assign({}, e, { weight:w, reps: rv ? [rv] : null, ts: now() });
  if (rv) entry.repsMode = 'last'; else delete entry.repsMode;

  if (newDate !== e.date){
    const newId = 'l:' + p.id + ':' + e.ex + ':' + newDate;
    entry.id = newId; entry.date = newDate;
    logOf(p.id).lifts[newId] = entry;
    logOf(p.id).lifts[entryId] = Object.assign({}, e, { deleted:true, ts: now() });
  } else {
    logOf(p.id).lifts[entryId] = entry;
  }
  saveLog(p.id, true);
  registerUndo(snap);
  closeOverlay();
  toast(`Updated ${wFmt(w)} ${UNIT}${rv ? ' × ' + rv : ''} · ${esc(e.name || e.ex)}`, personDotColor(p.id), undoLast);
  render();
  openHistory(e.ex);          // straight back to the list, so you can see it changed
}
function deleteRecord(entryId){
  const p = me();
  const e = logOf(p.id).lifts[entryId];
  if (!e) return;
  const snap = snapshotBefore([p.id]);
  logOf(p.id).lifts[entryId] = Object.assign({}, e, { deleted:true, ts: now() });
  saveLog(p.id, true);
  registerUndo(snap);
  closeOverlay();
  toast(`Deleted ${wFmt(e.weight)} ${UNIT} · ${fmtGB(e.date, true)}`, personDotColor(p.id), undoLast);
  render();
  openHistory(e.ex);
}

/* ---------- shared helpers ---------- */
function isoDate(d){ return d.toLocaleDateString('en-CA'); }
function dateFromKey(k){ return new Date(k + 'T12:00:00'); }
function weekStartKey(offsetWeeks){
  const d = new Date();
  d.setHours(12,0,0,0);
  const dow = (d.getDay() + 6) % 7;          // Monday = 0
  d.setDate(d.getDate() - dow + (offsetWeeks || 0) * 7);
  return isoDate(d);
}
function agoText(dateStr){
  const then = dateFromKey(dateStr).getTime();
  const days = Math.round((Date.now() - then) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 7) return days + ' days ago';
  if (days < 14) return 'last week';
  if (days < 60) return Math.round(days / 7) + ' weeks ago';
  return Math.round(days / 30) + ' months ago';
}
function entriesOn(pid, date){
  return liftsOf(pid).filter(e => e.date === date);
}
function volumeOn(pid, date){
  return entriesOn(pid, date).reduce((n, e) => n + (e.weight || 0) * (lastReps(e) || 1), 0);
}
function dayVolume(pid, dow, date){
  return volumeOn(pid, date);
}
/* the most recent earlier date on which this person logged anything */
function previousSessionDate(pid, beforeDate){
  const dates = [...new Set(liftsOf(pid).map(e => e.date))].filter(d => d < beforeDate).sort();
  return dates.length ? dates[dates.length - 1] : null;
}
function sameDayLastTime(pid, dow, beforeDate){
  const dates = [...new Set(ticksForDates(pid, dow))].filter(d => d < beforeDate).sort();
  return dates.length ? dates[dates.length - 1] : null;
}
function ticksForDates(pid, dow){
  const t = logOf(pid).ticks || {};
  return Object.keys(t).filter(k => +k.split(':')[0] === dow && (t[k].items || []).length).map(k => k.split(':')[1]);
}
function pbOf(pid, canon){
  let pb = null;
  for (const e of liftsOf(pid)) if (e.ex === canon && (!pb || e.weight > pb.weight)) pb = e;
  return pb;
}
function allPBs(pid){
  const map = new Map();
  for (const e of liftsOf(pid)){
    const cur = map.get(e.ex);
    if (!cur || e.weight > cur.weight) map.set(e.ex, e);
  }
  return [...map.values()].map(e => ({
    ex:e.ex, name:CANON_LABEL[e.ex] || e.name || e.ex, muscle:muscleFor(e.ex), entry:e, weight:e.weight, date:e.date
  }));
}

/* ---------- session summary (X157) and PB celebration (X158) ---------- */
function sessionSummaryHTML(pid, day, date){
  const entries = entriesOn(pid, date);
  if (!entries.length) return '';
  const dows = ['', 'MON', 'WED', 'FRI'];
  const sets = day.ex.length;
  const vol = entries.reduce((n, e) => n + (e.weight || 0) * (lastReps(e) || 1), 0);
  const best = entries.slice().sort((a, b) => (b.weight || 0) - (a.weight || 0))[0];
  const ts = entries.map(e => e.ts).filter(Boolean).sort((a, b) => a - b);
  const mins = ts.length > 1 ? Math.max(1, Math.round((ts[ts.length-1] - ts[0]) / 60000)) : 0;
  const pbs = entries.filter(e => {
    const all = liftsOf(pid).filter(x => x.ex === e.ex && x.date <= e.date && !isDeleted(x));
    return all.length > 1 && e.weight >= Math.max(...all.map(x => x.weight));
  });
  const prev = sameDayLastTime(pid, day.n, date);
  const prevVol = prev ? volumeOn(pid, prev) : 0;
  const delta = prevVol ? vol - prevVol : 0;

  return `
    <div class="summary" role="status">
      <div class="shead"><span class="sdot"></span> Session complete</div>
      <div class="srow">
        <span><b>${entries.length}</b> of ${sets} logged</span>
        ${vol ? `<span><b>${Math.round(vol).toLocaleString('en-GB')}</b> kg moved</span>` : ''}
        ${mins ? `<span><b>${mins}</b> min</span>` : ''}
      </div>
      ${best ? `<div class="sbest">Best set: <b>${esc(best.name)} ${wFmt(best.weight)} ${UNIT}${lastReps(best) ? ' ×' + lastReps(best) : ''}</b></div>` : ''}
      ${pbs.length ? `<div class="spb">🏆 ${pbs.length === 1 ? 'A PB today' : pbs.length + ' PBs today'}: ${pbs.map(e => esc(e.name) + ' ' + wFmt(e.weight)).join(' · ')}</div>` : ''}
      ${delta ? `<div class="sdelta ${delta > 0 ? 'up' : 'down'}">${delta > 0 ? '+' : ''}${Math.round(delta).toLocaleString('en-GB')} kg against last ${esc(String(day.label).toUpperCase())}${prev ? ' (' + esc(fmtGB(prev)) + ')' : ''}</div>` : ''}
    </div>`;
}
function celebratePB(list){
  const el = document.getElementById('pbbanner');
  if (!el) return;
  const who = list.length > 1 ? 'both of you' : (list[0].name + "'s");
  const first = list[0];
  el.innerHTML = `

      <span class="pbstar">🏆</span>
      <span class="pbtxt">
        <b>${wFmt(first.entry.weight)} ${UNIT}${lastReps(first.entry) ? ' × ' + lastReps(first.entry) : ''}</b>
        <span>${esc(first.name)} — a new PB for ${esc(who)}${list.length > 1 ? ' · ' + esc(list.slice(1).map(x => x.name).join(', ')) : ''}</span>
      </span>
    </div>`;
  el.classList.add('show');
  clearTimeout(celebratePB.timer);
  celebratePB.timer = setTimeout(() => el.classList.remove('show'), 3600);
}

function progressLiftsView(p, lifts){
  const map = new Map();

    g.entries.sort((a, b) => a.ts - b.ts);

/* X168 — this month against last month, per lift */
function monthCompareHTML(p){
  const lifts = liftsOf(p.id);
  const now = new Date();
  const thisM = isoDate(now).slice(0, 7);
  const lm = new Date(now); lm.setMonth(lm.getMonth() - 1);
  const lastM = isoDate(lm).slice(0, 7);
  const bestIn = m => {
    const map = new Map();
    for (const e of lifts) if (e.date.slice(0, 7) === m){
      const cur = map.get(e.ex);
      if (!cur || e.weight > cur.weight) map.set(e.ex, e);
    }
    return map;
  };
  const a = bestIn(thisM), b = bestIn(lastM);
  const rows = [];
  for (const [ex, e] of a){
    const was = b.get(ex);
    if (!was) continue;
    rows.push({ name:CANON_LABEL[ex] || e.name || ex, now:e.weight, then:was.weight, delta:e.weight - was.weight });
  }
  if (!rows.length) return '';
  rows.sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta));
  const monthName = m => new Date(m + '-15T12:00:00').toLocaleDateString('en-GB', { month:'long' });
  return `
    <div class="block">
      <div class="block-label">This month vs last</div>
      <p style="font-size:14px;opacity:.75">Best set per lift — ${esc(monthName(thisM))} against ${esc(monthName(lastM))}.</p>
      ${rows.map(r => `
        <div class="cmpline">
          <span class="nm">${esc(r.name)}</span>
          <span class="was">${wFmt(r.then)}</span>
          <span class="to">${wFmt(r.now)} ${UNIT}</span>
          <span class="dl ${r.delta > 0 ? 'up' : (r.delta < 0 ? 'down' : '')}">${r.delta > 0 ? '+' : ''}${r.delta ? wFmt(r.delta) : '—'}</span>
        </div>`).join('')}
    </div>`;
}

/* X108 — twelve weeks at a glance, and this week against the plan */
function progressMapView(p){
  const weeks = 12;
  const grid = [];
  for (let w = weeks - 1; w >= 0; w--){
    const startKey = weekStartKey(-w);
    const cols = DAYS.map(d => {
      // the date for that training day inside that week
      const start = dateFromKey(startKey);
      const offset = (d.dow - 1 + 7) % 7;           // Monday = 1
      const dt = new Date(start); dt.setDate(start.getDate() + offset);
      const key = isoDate(dt);
      const t = logOf(p.id).ticks[tickKey(d.dow, key)];
      const items = t ? (t.items || []).length : 0;
      return { key, dow:d.n, items, future: key > todayKey() };
    });
    grid.push({ week:w + 1, cols });
  }
  const cell = c => {
    if (c.future) return `<span class="hmc future" title="${c.key}"></span>`;
    const lvl = c.items === 0 ? 0 : c.items <= 4 ? 1 : c.items <= 7 ? 2 : 3;
    return `<span class="hmc l${lvl}" title="${c.key} — ${c.items} logged"></span>`;
  };
  const gridHTML = grid.map(g => `
    <div class="hmweek">
      <span class="hw">${g.week}</span>
      ${g.cols.map(cell).join('')}
    </div>`).join('');

  const totalDays = ticksForDates(p.id, 1).length + ticksForDates(p.id, 3).length + ticksForDates(p.id, 5).length;
  const last12 = grid.reduce((n, g) => n + g.cols.reduce((m, c) => m + (c.items ? 1 : 0), 0), 0);

  // this week: what the plan asks per muscle vs what has actually been logged
  const ws = weekStartKey(0);
  const thisWeek = liftsOf(p.id).filter(e => e.date >= ws);
  const plan = new Map();
  for (const d of DAYS) for (const e of d.ex) plan.set(e.muscle, (plan.get(e.muscle) || 0) + 1);
  const done = new Map();
  for (const e of thisWeek) done.set(muscleFor(e.ex), (done.get(muscleFor(e.ex)) || 0) + 1);
  const rows = [...plan.entries()].sort((a, b) => b[1] - a[1]);

  return `
    <div class="block" style="border-top:none;padding-top:4px;margin-top:8px">
      <div class="block-label">Twelve weeks</div>
      <p style="font-size:14px;opacity:.75">One square per session day. Filled by how much of the session was logged —
         light, mid, full. Numbered by week, newest at the bottom.</p>
      <div class="hmgrid">${gridHTML}</div>
      <div class="hmkey"><span class="hmc l0"></span> none <span class="hmc l1"></span> started
        <span class="hmc l2"></span> most <span class="hmc l3"></span> full</div>
      <div class="sumline" style="margin-top:18px">
        <div class="statcard"><span class="v" style="color:${personDotColor(p.id)}">${totalDays}</span><span class="k">sessions all time</span></div>
        <div class="statcard"><span class="v" style="color:${personDotColor(p.id)}">${last12}</span><span class="k">in 12 weeks</span></div>
        <div class="statcard"><span class="v" style="color:${personDotColor(p.id)}">${streakWeeks(p.id)}</span><span class="k">weeks in a row</span></div>
      </div>
    </div>
    <div class="block">
      <div class="block-label">This week against the plan</div>
      <p style="font-size:14px;opacity:.75">How many exercises hit each muscle so far this week (Monday to today).</p>
      ${rows.map(([mus, want]) => {
        const got = Math.min(done.get(mus) || 0, want);
        const pct = want ? Math.round(got / want * 100) : 0;
        return `<div class="mfreq">
          <span class="fm">${esc(mus)}</span>
          <span class="fbar"><span style="width:${pct}%"></span></span>
          <span class="fv">${got}/${want}</span>
        </div>`;
      }).join('')}
    </div>`;
}

/* X123 + X163 — the two of you */
function progressTwoView(p){
  const others = S.people.filter(x => x.id !== p.id);
  if (!others.length) return `<div class="empty">Only one person in this room.</div>`;
  const other = others[0];
  const mine = new Map(allPBs(p.id).map(x => [x.ex, x]));
  const theirs = new Map(allPBs(other.id).map(x => [x.ex, x]));
  const shared = [...new Set([...mine.keys(), ...theirs.keys()])].filter(ex => mine.has(ex) && theirs.has(ex));
  const mineOnly = [...mine.keys()].filter(ex => !theirs.has(ex));
  const theirsOnly = [...theirs.keys()].filter(ex => !mine.has(ex));

  const bar = (ex) => {
    const a = mine.get(ex), b = theirs.get(ex);
    const mx = Math.max(a.weight, b.weight, 1);
    return `
      <div class="vsrow">
        <span class="vn">${esc(a.name)}</span>
        <span class="vcol">
          <span class="vbar" style="width:${Math.round(a.weight / mx * 100)}%;background:${personDotColor(p.id)}"></span>
          <span class="vv">${esc(p.name)} ${wFmt(a.weight)}<span class="u">${UNIT}</span></span>
        </span>
        <span class="vcol">
          <span class="vbar" style="width:${Math.round(b.weight / mx * 100)}%;background:${personDotColor(other.id)}"></span>
          <span class="vv">${esc(other.name)} ${wFmt(b.weight)}<span class="u">${UNIT}</span></span>
        </span>
      </div>`;
  };

  const feed = liftsOf(other.id)
    .filter(e => !isDeleted(e))
    .sort((a, b) => (b.ts || 0) - (a.ts || 0))
    .slice(0, 8)
    .map(e => {
      const before = liftsOf(other.id).filter(x => x.ex === e.ex && x.ts < e.ts);
      const best = before.reduce((m, x) => Math.max(m, x.weight), 0);
      const isPB = e.weight > best && before.length > 0;
      return `
        <div class="feedrow">
          <span class="fpdot" style="background:${personDotColor(other.id)}"></span>
          <span class="ftxt"><b>${esc(e.name)}</b> ${wFmt(e.weight)} ${UNIT}${lastReps(e) ? ' × ' + lastReps(e) : ''}${isPB ? ' <span class="fpb">PB</span>' : ''}</span>
          <span class="fwhen">${esc(agoText(e.date))}</span>
        </div>`;
    }).join('');

  return `
    <div class="block" style="border-top:none;padding-top:4px;margin-top:8px">
      <div class="block-label">Lifts you both do · ${shared.length}</div>
      <p style="font-size:14px;opacity:.75">Bars are drawn against the heavier of the two. Dumbbell numbers are per hand,
         and a machine and a cable are different lifts, so compare only what is genuinely the same.</p>
      ${shared.length ? shared.sort().map(bar).join('') : '<div class="empty">No lift logged by both of you yet.</div>'}
    </div>
    ${mineOnly.length || theirsOnly.length ? `
    <div class="block">
      <div class="block-label">Only one of you has logged</div>
      <div class="two-lists">
        <div><span class="tl">${esc(p.name)}</span>
          ${mineOnly.length ? mineOnly.map(ex => `<div class="tinyrow">${esc(CANON_LABEL[ex] || ex)}</div>`).join('') : '<div class="tinyrow muted">nothing yet</div>'}</div>
        <div><span class="tl">${esc(other.name)}</span>
          ${theirsOnly.length ? theirsOnly.map(ex => `<div class="tinyrow">${esc(CANON_LABEL[ex] || ex)}</div>`).join('') : '<div class="tinyrow muted">nothing yet</div>'}</div>
      </div>
    </div>` : ''}
    <div class="block">
      <div class="block-label">${esc(other.name)}'s latest</div>
      ${feed || '<div class="empty">Nothing logged yet.</div>'}
    </div>
    <div class="block">

/* X118 + X184 — memories */
function onThisDayHTML(p){
  const today = todayKey();
  const md = today.slice(5);                                  // MM-DD
  const yearsAgo = new Date().getFullYear() - 1 + '-' + md;
  const hits = liftsOf(p.id).filter(e => (e.date.slice(5) === md) || (e.date === yearsAgo));
  const first = liftsOf(p.id).slice().sort((a, b) => (a.ts || 0) - (b.ts || 0))[0];
  let out = '';
  if (hits.length){
    out += `<p style="font-size:14px;opacity:.8">On this date before:</p>` + hits.slice(0, 6).map(e =>
      `<div class="feedrow"><span class="fpdot" style="background:${personDotColor(p.id)}"></span>
        <span class="ftxt"><b>${esc(e.name)}</b> ${wFmt(e.weight)} ${UNIT}${lastReps(e) ? ' × ' + lastReps(e) : ''}</span>
        <span class="fwhen">${esc(agoText(e.date))}</span></div>`).join('');
  }
  if (first){
    const days = Math.round((Date.now() - dateFromKey(first.date).getTime()) / 86400000);
    if (days >= 30){
      out += `<div class="nudge"><span class="nb">${days >= 365 ? (days / 365).toFixed(1).replace('.0','') + 'y' : Math.round(days / 30) + 'm'}</span>
        <span class="nt">since you logged your first lift — <b>${esc(first.name)}</b>, ${wFmt(first.weight)} ${UNIT}, ${esc(fmtGB(first.date))}. Keep going.</span></div>`;
    }
  }
  if (!out) out = `<div class="tinyrow muted">Nothing from this date to show yet — it builds up as you log.</div>`;
  return out;
}

/* ---------- streaks ---------- */
function sessionStreak(pid){
  const weeks = new Set();
  for (const dow of [1, 3, 5]) for (const d of ticksForDates(pid, dow)) weeks.add(weekStartKeyOf(d));
  let n = 0;
  for (let i = 0; i < 260; i++){
    if (weeks.has(weekStartKey(-i))) n++;
    else if (i > 0) break;
  }
  return n;
}
function streakWeeks(pid){
  const perWeek = new Map();
  for (const dow of [1, 3, 5]) for (const d of ticksForDates(pid, dow)){
    const w = weekStartKeyOf(d);
    perWeek.set(w, (perWeek.get(w) || 0) + 1);
  }
  let n = 0;
  for (let i = 0; i < 260; i++){
    const w = weekStartKey(-i);
    if ((perWeek.get(w) || 0) > 0) n++;
    else if (i > 0) break;
  }
  return n;
}
function weekStartKeyOf(dateKey){
  const d = dateFromKey(dateKey);
  const dow = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dow);
  return isoDate(d);
}

function muscleFor(ex){
  for (const d of DAYS) for (const e of d.ex) if (e.canon === ex || (e.opts && e.opts.some(o=>o.id===ex))) return e.muscle;
  return MUSCLE_FALLBACK[ex] || '';
}
function liftCount(lifts){
  const days = new Set(lifts.map(e => e.date));
  return days.size;
}
function sparkSVG(weights){
  if (weights.length < 2) return '<span class="spark" style="display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);letter-spacing:.05em;font-family:\'IBM Plex Mono\',monospace">soon</span>';
  const w = 74, h = 28, p = 3;
  const mn = Math.min(...weights), mx = Math.max(...weights);
  const rng = (mx - mn) || 1;
  const pts = weights.map((v,i) => {
    const x = p + (i/(weights.length-1))*(w-2*p);
    const y = h - p - ((v - mn)/rng)*(h-2*p);
    return [x,y];
  });
  const line = pts.map(pt => pt.map(v=>v.toFixed(1)).join(',')).join(' ');
  const last = pts[pts.length-1];
  const first = pts[0];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${first[0].toFixed(1)},${h-p} ${line}" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--accent)" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.4" fill="var(--accent)"/>
  </svg>`;
}

/* ============================================================
   Timer tab
   ============================================================ */
const Timer = { total:0, left:0, raf:null, end:0, running:false, preset:null };
let audioCtx = null;
function beep(){
  try {
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.3, audioCtx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + .5);
    o.start(); o.stop(audioCtx.currentTime + .55);
  } catch(e){}
}
const timerLeft = () => Math.max(0, Math.round((Timer.end - now())/1000));
const timerLabel = () => {
  if (Timer.running) return 'Pause';
  if (Timer.total > 0 && Timer.left < Timer.total) return 'Resume'; // paused mid-countdown
  return 'Start';
};
function renderTimer(){
  setPersonAccent();
  const total = Timer.total, left = Math.max(0, Math.round(Timer.running ? (Timer.end - now())/1000 : Timer.left));
  const pct = total ? (1 - left/total)*100 : 0;
  const mm = String(Math.floor(left/60)).padStart(2,'0'), ss = String(left%60).padStart(2,'0');
  const hasPreset = !!Timer.preset;
  document.getElementById('app').innerHTML = `
    <div class="anim">
      <div class="eyebrow">REST <span class="live">TIMER</span></div>
      <h1 class="small">Between <span class="idx">sets</span></h1>
      <div class="timer-card">
        <div class="tring" id="tring"><span class="tdisp" id="tdisp">${mm}:${ss}<span class="unit">sec</span></span></div>
        <div class="tctl">
          <button class="cta ${Timer.running?'ghost':'primary'}" id="tstart">${timerLabel()}</button>
          <button class="cta ghost" id="treset" ${total?'':'disabled'}>Reset</button>
        </div>
        <div class="tpresets" id="tpresets">
          <button class="tpreset" data-s="105" aria-pressed="${hasPreset && Timer.preset===105}">Compound 1:45</button>
          <button class="tpreset" data-s="60"  aria-pressed="${hasPreset && Timer.preset===60}">Isolation 1:00</button>
          <button class="tpreset" data-s="45"  aria-pressed="${hasPreset && Timer.preset===45}">Core 0:45</button>
        </div>
        <div class="tend-note" id="tendnote"></div>
        <p style="margin-top:22px;font-size:13px;color:var(--muted);line-height:1.6">Presets match the plan: compounds 90–120s, isolation 45–75s, core 30–60s. The timer pings when it's time to lift again.</p>
      </div>
    </div>`;
  const ring = document.getElementById('tring');
  ring.style.background = `conic-gradient(var(--accent) ${pct*3.6}deg, var(--line) 0deg)`;
  document.getElementById('tstart').addEventListener('click', toggleTimer);
  document.getElementById('treset').addEventListener('click', () => {
    Timer.running = false; cancelAnimationFrame(Timer.raf);
    Timer.total = 0; Timer.left = 0; Timer.preset = null;
    renderTimer();
  });
  document.querySelectorAll('.tpreset').forEach(b => b.addEventListener('click', () => {
    const s = +b.dataset.s;
    Timer.running = false; cancelAnimationFrame(Timer.raf);
    Timer.total = s; Timer.left = s; Timer.preset = s;
    renderTimer();
    beep();
  }));
  document.getElementById('tendnote').innerHTML = '';
}
function toggleTimer(){
  if (Timer.running){
    // pause — in place, no screen rebuild
    Timer.running = false;
    cancelAnimationFrame(Timer.raf);
    Timer.left = timerLeft();
    const btn = document.getElementById('tstart');
    if (btn) btn.textContent = 'Resume';
    paintTimer();
    return;
  }
  if (!Timer.total){
    // Start with no preset picked → default to compound
    Timer.total = REST_MIN.compound; Timer.left = Timer.total; Timer.preset = REST_MIN.compound;
    renderTimer();
    return;
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  Timer.end = now() + Timer.left*1000;
  Timer.running = true;
  const btn = document.getElementById('tstart');
  if (btn) btn.textContent = 'Pause';
  tickTimer();
}
function paintTimer(){
  const left = Math.max(0, Math.round(Timer.running ? (Timer.end - now())/1000 : Timer.left));
  const d = document.getElementById('tdisp');
  const ring = document.getElementById('tring');
  if (!d) return;
  const mm = String(Math.floor(left/60)).padStart(2,'0'), ss = String(left%60).padStart(2,'0');
  d.innerHTML = `${mm}:${ss}<span class="unit">sec</span>`;
  if (ring){
    const pct = Timer.total ? (1 - left/Timer.total)*100 : 0;
    ring.style.background = `conic-gradient(var(--accent) ${pct*3.6}deg, var(--line) 0deg)`;
  }
}
function tickTimer(){
  if (!Timer.running) return;
  const left = timerLeft();
  Timer.left = left;
  const d = document.getElementById('tdisp');
  const ring = document.getElementById('tring');
  if (d && ring){
    const mm = String(Math.floor(left/60)).padStart(2,'0'), ss = String(left%60).padStart(2,'0');
    d.innerHTML = `${mm}:${ss}<span class="unit">sec</span>`;
    const pct = Timer.total ? (1 - left/Timer.total)*100 : 0;
    ring.style.background = `conic-gradient(var(--accent) ${pct*3.6}deg, var(--line) 0deg)`;
  }
  if (left <= 0){
    Timer.running = false;
    beep(); setTimeout(beep, 500); setTimeout(beep, 1000);
    try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
    const n = document.getElementById('tendnote');
    if (n) n.innerHTML = `<b>Time's up</b> — rest over, next set when you're ready.`;
    const b = document.getElementById('tstart');
    if (b) b.textContent = 'Start';
    if (d) d.innerHTML = `00:00<span class="unit">sec</span>`;
    Timer.left = Timer.total; // pressing Start runs a fresh full rest
    return;
  }
  Timer.raf = requestAnimationFrame(tickTimer);
}

      const pp = S.people.find(x => x.id === id);
      pp.name = nm;
      saveSettings(); render(); openSettings();
    }
  }));
  root.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'connect') openSyncSetup();
    else if (a === 'reconnect'){
      S.sync.pin = ''; S.sync.room = ''; S.sync.lastErr = '';
      saveSettings();
      openSyncSetup();
    }
    else if (a === 'syncnow') doSync(true);
    else if (a === 'unsync'){
      if (!confirm('Disconnect this phone from sync? Its local data stays.')) return;
      S.sync = { pin:'', room:'', lastSync:0, lastErr:'', busy:false };
      saveSettings(); openSettings();
    }
    else if (a === 'cleanreps') cleanOldReps();
    else if (a === 'hap-on'){ S.haptics = true; saveSettings(); openSettings(); }
    else if (a === 'hap-off'){ S.haptics = false; saveSettings(); openSettings(); }
    else if (a === 'con-normal'){ setContrast('normal'); openSettings(); }
    else if (a === 'con-high'){ setContrast('high'); openSettings(); }
    else if (a === 'restore') openRestoreSheet();
    else if (a === 'expjson') exportData('json');
    else if (a === 'expcsv') exportData('csv');
    else if (a === 'wipe') openEraseSheet();
  }));
}

function exportData(fmt){
  const stamp = todayKey();
  const all = {};
  for (const p of S.people) all[p.id] = logOf(p.id);
  let name, type, text;
  if (fmt === 'json'){
    name = `gym-backup-${stamp}.json`;
    type = 'application/json';
    text = JSON.stringify({
      app:'Session', schema:EXPORT_SCHEMA, version:APP_VERSION,
      exported:new Date().toISOString(), unit:UNIT, people:S.people, data:all
    }, null, 2);
  } else {
    name = `gym-weights-${stamp}.csv`;
    type = 'text/csv';
    const rows = ['person,date,exercise,weight_kg,reps,note,last_reps'];
    for (const p of S.people){
      for (const e of liftsOf(p.id)){
        const lr = lastReps(e);
        rows.push([p.name, e.date, e.name || e.ex, e.weight, e.reps ? e.reps.join('/') : '', e.note || '',
                   lr != null ? lr : ''].map(v => '"'+String(v).replace(/"/g,'""')+'"').join(','));
      }

    S.lastBackup = now();
    saveSettings();
    toast('Backup downloaded');

/* ============================================================
   Restore from a backup (the one real hole: you could export but not import)
   Merges only — newest wins, exactly like sync. It never deletes and it never
   overwrites anything newer, so a stale backup file cannot do damage.
   ============================================================ */
function analyseBackup(obj){
  const out = { lifts:[], ticks:[], unknownPeople:[], peopleCount:0, exported:obj && obj.exported };
  if (!obj || typeof obj !== 'object') return null;
  const data = obj.data;
  if (!data || typeof data !== 'object') return null;
  const known = new Set(S.people.map(p => p.id));
  for (const pid of Object.keys(data)){
    if (!known.has(pid)){ out.unknownPeople.push(pid); continue; }
    out.peopleCount++;
    const bucket = data[pid] || {};
    for (const id of Object.keys(bucket.lifts || {})){
      const e = bucket.lifts[id];
      if (e && typeof e === 'object' && e.weight != null) out.lifts.push({ pid, id, entry:e });
    }
    for (const k of Object.keys(bucket.ticks || {})){
      const t = bucket.ticks[k];
      if (t && typeof t === 'object') out.ticks.push({ pid, k, t });
    }
  }
  return out;
}
function previewBackup(plan){
  let add = 0, update = 0, skip = 0;
  for (const x of plan.lifts){
    const cur = logOf(x.pid).lifts[x.id];
    if (!cur) add++;
    else if ((x.entry.ts || 0) > (cur.ts || 0)) update++;
    else skip++;
  }
  let tAdd = 0, tUpdate = 0, tSkip = 0;
  for (const x of plan.ticks){
    const cur = logOf(x.pid).ticks[x.k];
    if (!cur) tAdd++;
    else if ((x.t.ts || 0) > (cur.ts || 0)) tUpdate++;
    else tSkip++;
  }
  return { add, update, skip, tAdd, tUpdate, tSkip };
}

      const warn = plan.unknownPeople.length
        ? `<div style="margin-top:10px;opacity:.85">Ignoring data for unknown people: ${esc(plan.unknownPeople.join(', '))}</div>` : '';
      box.innerHTML = `
        <div class="hint-row" style="border-style:solid">

          <b>${st.add}</b> will be added · <b>${st.update}</b> will be updated (they are newer than what is here) ·
          <b>${st.skip}</b> skipped (you already have a newer version)<br><br>
          Ticks: <b>${st.tAdd}</b> added · <b>${st.tUpdate}</b> updated · <b>${st.tSkip}</b> skipped
          ${warn}

          <button class="cta primary" id="restorego" style="--pc:${personDotColor(me().id)}">Merge it in</button>
        </div>`;
      const go = document.getElementById('restorego');
      if (go) go.addEventListener('click', () => doRestore(plan));
    };
    rd.onerror = () => { box.innerHTML = `<div class="hint-row" style="border-color:var(--d3)">Could not read that file.</div>`; };

function doRestore(plan){
  const st = previewBackup(plan);
  const snap = snapshotBefore(S.people.map(p => p.id));
  let changed = 0;
  for (const x of plan.lifts){
    const cur = logOf(x.pid).lifts[x.id];
    if (!cur || (x.entry.ts || 0) > (cur.ts || 0)){ logOf(x.pid).lifts[x.id] = x.entry; changed++; }
  }
  for (const x of plan.ticks){
    const cur = logOf(x.pid).ticks[x.k];
    if (!cur || (x.t.ts || 0) > (cur.ts || 0)){ logOf(x.pid).ticks[x.k] = x.t; changed++; }
  }
  for (const p of S.people) saveLog(p.id, true);
  // restored records can carry old timestamps, so make the next sync a full one
  S.sync.upTs = 0;
  S.sync.count = 0;
  saveSettings();
  registerUndo(snap);
  closeOverlay();
  toast(`Restored ${changed} of ${plan.lifts.length + plan.ticks.length} records`, null, undoLast);
  render();
}

/* ============================================================
   X144 — plate calculator
   Per side, from a standard set, with the bar weight optional.
   ============================================================ */
const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
let plateBar = 20;
function plateMath(target, bar){
  const perSide = (target - bar) / 2;
  if (target <= 0) return { error:'Pick a weight above zero.' };
  if (perSide < 0) return { error:`That is lighter than the bar (${bar} kg) — use a lighter bar or dumbbells.` };
  let left = Math.round(perSide * 100) / 100;
  const out = [];
  for (const pl of PLATES){
    const n = Math.floor((left + 1e-9) / pl);
    if (n > 0){ out.push({ plate:pl, n }); left = Math.round((left - n * pl) * 100) / 100; }
  }
  return { perSide:Math.round(perSide * 100) / 100, plates:out, remainder:left, bar };
}
function plateHTML(target, bar){
  const r = plateMath(target, bar);
  if (r.error) return `<div class="hint-row" style="border-color:var(--d3)">${esc(r.error)}</div>`;
  return `
    <div class="hint-row" style="border-style:solid">
      <b>${wFmt(r.bar)} kg bar</b> + <b>${wFmt(r.perSide)} kg per side</b>${r.remainder ? ` <span style="opacity:.7">(${wFmt(r.remainder)} kg cannot be made exactly)</span>` : ''}
    </div>
    <div class="plate-row">
      ${r.plates.map(p => `<span class="plate"><b>${wFmt(p.plate)}</b><span>×${p.n}</span></span>`).join('') || '<span class="plate none">no plates needed</span>'}
      <span class="plate bar"><b>bar</b><span>${wFmt(r.bar)}</span></span>
    </div>`;
}

function wipeLocal(){
  const keys = [];
  try { for (const k of Object.keys(localStorage)) if (k.startsWith('gym:') || /^session:/.test(k)) keys.push(k); } catch(e){}
  for (const k of keys){ try { localStorage.removeItem(k); } catch(e){} }
  try { Object.keys(mem).forEach(k => { if (k.startsWith('gym:') || /^session:/.test(k)) delete mem[k]; }); } catch(e){}
  // clear through the store too, so a host-injected storage bridge is emptied as well
  if (window.storage && window.storage.set){
    (async () => { for (const k of keys){ try { await window.storage.set(k, ''); } catch(e){} } })();
  }
  location.reload();
}

/* ============================================================
   Sync engine (Supabase)
   ============================================================ */
function syncConfigured(){
  return !!(SUPABASE.url && SUPABASE.anonKey && SUPABASE_TABLE_SQL_OK);
}
let syncTimer = null, syncInFlight = false;
function scheduleSync(){
  clearTimeout(syncTimer);
  if (!syncConfigured()) return;
  syncTimer = setTimeout(() => doSync(false), 2500);
}
/* the 64-char value sent to the database: derived from the PIN entirely
   in the browser so the store never needs a server-side hash function */
const wireSecret = secret => sha256('gym-store:' + secret);
async function doSync(manual, secretOverride){
  if (!syncConfigured()) return { ok:false, msg:'Sync not configured (see SETUP.md)' };
  if (syncInFlight){
    // A background sync is already running. Never report success for a PIN we have not checked —
    // wait for the running one to finish first, then report its outcome honestly.
    if (!manual) return { ok:true, silent:true };
    while (syncInFlight) await new Promise(r => setTimeout(r, 120));
    if (!secretOverride) return { ok:true, checked:true };
  }
  if (!secretOverride && !S.sync.pin) {
    // first time: prompt for the shared PIN
    if (manual) openSyncSetup();
    return { ok:false, silent:true };
  }
  syncInFlight = true;
  S.sync.busy = true;
  S.sync.lastErr = '';
  saveSettings();
  try {
    const secret = secretOverride || sha256('gym-pin:' + S.sync.pin.toLowerCase());
    // Every 20th sync (and every manual one) sends everything, so a missed row can never be
    // lost forever; in between we only send and ask for what has changed since last time.
    const full = !!manual || ((S.sync.count || 0) % 20 === 0);
    const upTs = full ? 0 : (S.sync.upTs || 0);
    const downTs = full ? 0 : (S.sync.downTs || 0);

    const all = [];
    for (const p of S.people){
      for (const e of Object.values(logOf(p.id).lifts)) all.push({ id:e.id, pid:p.id, ts:e.ts, data:e });
      for (const k of Object.keys(logOf(p.id).ticks)){
        const t = logOf(p.id).ticks[k];
        const [dow, date] = k.split(':');
        all.push({ id:'t:' + p.id + ':' + dow + ':' + date, pid:p.id, ts:t.ts, data:{ kind:'tick', pid:p.id, dow:+dow, date, items:t.items, ts:t.ts } });
      }
    }
    const rows = full ? all : all.filter(r => (r.ts || 0) > upTs);
    const maxUp = all.reduce((m, r) => Math.max(m, r.ts || 0), 0);
    const res = await fetch(SUPABASE.url.replace(/\/$/,'') + '/rest/v1/rpc/sync_state', {
      method:'POST',
      headers:{ 'apikey': SUPABASE.anonKey, 'Authorization':'Bearer ' + SUPABASE.anonKey, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_secret: secret, p_rows: rows, p_since: downTs })
    });
    if (!res.ok){
      let msg = 'Sync failed (' + res.status + ')';
      try {
        const j = await res.json();
        msg = (j.message || j.msg || msg);
        if (j.code === 'PGRST202' || /could not find the function/i.test(msg)){
          msg = 'Database setup isn\u2019t finished yet — open Supabase → SQL Editor and run supabase.sql once.';
        } else if (res.status === 401 || res.status === 403){
          msg = 'Sync store rejected the app key — check the URL/key in the SYNC CONFIG block.';
        }
      } catch(e){}
      throw new Error(msg);
    }
    const remote = await res.json();
    let changed = 0;
    for (const row of (remote || [])){
      const d = row.data || {};
      if (d.kind === 'tick'){
        const pid = d.pid, key = tickKey(d.dow, d.date);
        const t = logOf(pid).ticks[key];
        if (!t || d.ts > t.ts){
          logOf(pid).ticks[key] = { items:(d.items||[]).slice(), ts:d.ts };
          changed++;
        }
      } else if (d.id && d.ts){
        const pid = d.pid;
        const cur = logOf(pid).lifts[d.id];
        if (!cur || d.ts > cur.ts){
          logOf(pid).lifts[d.id] = d;
          changed++;
        }
      }
    }
    if (changed){
      for (const p of S.people) saveLog(p.id, true);
    }
    // remember how far we have got, so the next sync is a fraction of the work
    const maxDown = (remote || []).reduce((m, r) => Math.max(m, r.ts || 0), 0);
    S.sync.upTs = Math.max(S.sync.upTs || 0, maxUp);
    S.sync.downTs = Math.max(S.sync.downTs || 0, maxDown);
    S.sync.count = (S.sync.count || 0) + 1;
    S.sync.lastSync = now();
    S.sync.lastErr = '';
    await saveSettings();
    render();
    return { ok:true };
  } catch(e){
    S.sync.lastErr = String(e && e.message ? e.message : e).slice(0,200);
    await saveSettings();
    render();
    return { ok:false, msg: S.sync.lastErr };
  } finally {
    syncInFlight = false;
    S.sync.busy = false;
    saveSettings();
  }
}


/* ============================================================
   Boot, install and offline (Release 3)
   ============================================================ */
function firstPaint(){
  const sk = document.getElementById('bootskeleton');
  const sp = document.getElementById('splash');
  if (sk) sk.classList.add('gone');
  if (sp){
    sp.classList.add('gone');
    setTimeout(() => { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 600);
  }
}

/* ---- offline / online, said plainly ---- */
let lastOnline = navigator.onLine !== false;
function netNoteHTML(){
  if (lastOnline) return '';
  return `<span class="sync-line"><span class="dotlive"></span>Offline — everything still saves on this phone and syncs when you have signal.</span>`;
}
function watchConnection(){
  const mark = () => {
    const was = lastOnline;
    lastOnline = navigator.onLine !== false;
    if (was !== lastOnline) render();
    if (lastOnline && syncConfigured() && S.sync.pin && !syncInFlight) doSync(false);
  };
  window.addEventListener('online', mark);
  window.addEventListener('offline', mark);
}

/* ---- ask the browser to keep our data, and say whether it agreed ---- */
async function storageStateLabel(){
  try {
    if (!navigator.storage || !navigator.storage.persisted) return 'not supported on this device';
    const already = await navigator.storage.persisted();
    if (already) return 'protected';
    const granted = navigator.storage.persist ? await navigator.storage.persist() : false;
    return granted ? 'protected' : 'not protected — install to home screen for the strongest protection';
  } catch(e){ return 'unknown'; }
}
let storageLabelCache = null;
function storageRowHTMLSync(){
  const ok = storageLabelCache === 'protected';
  const label = storageLabelCache || 'checking…';
  return `<div class="sv ${ok ? 'ok' : ''}" style="margin-top:6px">Storage: <b>${esc(label)}</b></div>`;
}
async function storageRowHTML(){
  if (!storageLabelCache) storageLabelCache = await storageStateLabel();
  const ok = storageLabelCache === 'protected';
  return `<div class="sv ${ok ? 'ok' : ''}" style="margin-top:6px">Storage: <b>${esc(storageLabelCache)}</b></div>`;
}

/* ---- install: how it is opened matters, so say so ---- */
function isStandalone(){
  try {
    if (window.navigator && window.navigator.standalone === true) return true;
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
  } catch(e){}
  return false;
}
function installRowHTML(){
  const standalone = isStandalone();
  if (standalone) return `<div class="sv ok" style="margin-top:6px">Opened as an installed app ✓ — and that is what keeps iOS from clearing this phone's data after a quiet week.</div>`;
  return `<div class="sv warn" style="margin-top:6px">Opened in a browser tab. Add it to your home screen
    (Share → Add to Home Screen) so it opens full screen and so iOS does not clear the data after 7 days without a visit.</div>`;
}

/* ---- the phone's top bar follows the day's accent ---- */
const THEME_COLOR = { 1:'#F5C518', 2:'#4C8DFF', 3:'#F0575C' };
function paintThemeColor(){
  const day = (view === 'session') ? currentDay() : null;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', day ? (THEME_COLOR[day.n] || '#12161A') : '#12161A');
}

/* ---- service worker: cache the shell, and take updates on a fresh launch ---- */
let reloadingForUpdate = false;
function registerServiceWorker(){
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js', { scope:'./' });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloadingForUpdate) return;
        reloadingForUpdate = true;
        location.reload();
      });
      // A fresh launch is the safe moment to adopt a downloaded update.
      const adopt = () => {
        if (reg.waiting && !document.getElementById('overlayroot').innerHTML){
          reg.waiting.postMessage({ type:'SKIP_WAITING' });
        }
      };
      adopt();
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'installed') adopt(); });
      });
      reg.update().catch(() => {});
    } catch(e){}
  });
}

/* ---- a tab shortcut from the home screen can name the screen ---- */
function applyStartTab(){
  try {
    const t = new URLSearchParams(location.search).get('tab');
    if (t && NAV.some(n => n.v === t)) view = t;
  } catch(e){}
}

/* ============================================================
   Boot
   ============================================================ */
(async function boot(){
  // Whatever happens below, the app must never be left behind the splash screen.
  setTimeout(firstPaint, 4000);
  await loadSettings();
  await loadLogs();
  await migrateLegacy();

  if (S.contrast === 'high') document.documentElement.classList.add('contrast-high');
  document.getElementById('switch').innerHTML = '';
  applyStartTab();
  render();
  firstPaint();

  document.getElementById('gearbtn').addEventListener('click', openSettings);
  watchConnection();
  registerServiceWorker();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  if (!S.onboarded){
    onboard();
  } else if (syncConfigured() && S.sync.pin){
    doSync(false);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    // a new day (or a new session) may have started while the app sat in the background
    if (lastRenderedDay !== todayKey()){ lastRenderedDay = todayKey(); render(); }
    if (syncConfigured() && S.sync.pin) doSync(false);
  });
  window.addEventListener('focus', () => {
    if (lastRenderedDay !== todayKey()){ lastRenderedDay = todayKey(); render(); }
    if (syncConfigured() && S.sync.pin && !syncInFlight) doSync(false);
  });
  setInterval(() => {
    if (document.hidden) return;
    if (lastRenderedDay !== todayKey()){ lastRenderedDay = todayKey(); render(); }
    if (syncConfigured() && S.sync.pin && !syncInFlight) doSync(false);
  }, 60000);
})();
</script>
